<text x="48.0" y="700.0" font-size="12" fill="#495057" text-anchor="start">来源：PE = 港股收盘价 × 港元兑人民币中间价 × 总股本 / 当时已披露的最近四季度 Non-IFRS 归母净利润（本文自算，业绩公告次一交易日更新分</text>
<text x="48.0" y="718.0" font-size="12" fill="#495057" text-anchor="start">母）；利润取公司季度业绩公告。</text>
