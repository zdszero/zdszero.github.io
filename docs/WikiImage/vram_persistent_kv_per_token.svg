<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="580" rx="12" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#212529">每个 token 在每一层存什么：MHA / GQA / MLA</text>
  <text x="450" y="56" text-anchor="middle" font-size="13" fill="#868e96">单位成本由注意力结构决定；TP 能否摊薄它，取决于存的东西有没有 head 维</text>

  <!-- panel MHA -->
  <rect x="24" y="76" width="276" height="210" rx="10" fill="#f8f9fa" stroke="#e9ecef"/>
  <text x="162" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#3b5bdb">MHA</text>
  <text x="162" y="118" text-anchor="middle" font-size="11" fill="#868e96">每个 head 各一份 K、V</text>
  <text x="44" y="150" font-size="12" font-weight="700" fill="#495057">K</text>
  <rect x="62" y="136" width="22" height="22" rx="3" fill="#edf2ff" stroke="#4c6ef5"/>
  <rect x="88" y="136" width="22" height="22" rx="3" fill="#edf2ff" stroke="#4c6ef5"/>
  <rect x="114" y="136" width="22" height="22" rx="3" fill="#edf2ff" stroke="#4c6ef5"/>
  <rect x="140" y="136" width="22" height="22" rx="3" fill="#edf2ff" stroke="#4c6ef5"/>
  <rect x="166" y="136" width="22" height="22" rx="3" fill="#edf2ff" stroke="#4c6ef5"/>
  <rect x="192" y="136" width="22" height="22" rx="3" fill="#edf2ff" stroke="#4c6ef5"/>
  <text x="226" y="152" font-size="12" fill="#868e96">… ×64</text>
  <text x="44" y="186" font-size="12" font-weight="700" fill="#495057">V</text>
  <rect x="62" y="172" width="22" height="22" rx="3" fill="#edf2ff" stroke="#4c6ef5"/>
  <rect x="88" y="172" width="22" height="22" rx="3" fill="#edf2ff" stroke="#4c6ef5"/>
  <rect x="114" y="172" width="22" height="22" rx="3" fill="#edf2ff" stroke="#4c6ef5"/>
  <rect x="140" y="172" width="22" height="22" rx="3" fill="#edf2ff" stroke="#4c6ef5"/>
  <rect x="166" y="172" width="22" height="22" rx="3" fill="#edf2ff" stroke="#4c6ef5"/>
  <rect x="192" y="172" width="22" height="22" rx="3" fill="#edf2ff" stroke="#4c6ef5"/>
  <text x="226" y="188" font-size="12" fill="#868e96">… ×64</text>
  <text x="162" y="228" text-anchor="middle" font-size="12" font-family="monospace" fill="#3b5bdb">2 × 64 × 128</text>
  <text x="162" y="248" text-anchor="middle" font-size="12" font-family="monospace" fill="#3b5bdb">= 16384 元素</text>
  <text x="162" y="272" text-anchor="middle" font-size="11" fill="#868e96">head 多，TP 能充分切</text>

  <!-- panel GQA -->
  <rect x="312" y="76" width="276" height="210" rx="10" fill="#f8f9fa" stroke="#e9ecef"/>
  <text x="450" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#0b7285">GQA（Llama-3-70B）</text>
  <text x="450" y="118" text-anchor="middle" font-size="11" fill="#868e96">8 个 Q head 共享一组 K、V</text>
  <text x="332" y="150" font-size="12" font-weight="700" fill="#495057">K</text>
  <rect x="350" y="136" width="22" height="22" rx="3" fill="#e6fcf5" stroke="#0ca678"/>
  <rect x="376" y="136" width="22" height="22" rx="3" fill="#e6fcf5" stroke="#0ca678"/>
  <rect x="402" y="136" width="22" height="22" rx="3" fill="#e6fcf5" stroke="#0ca678"/>
  <rect x="428" y="136" width="22" height="22" rx="3" fill="#e6fcf5" stroke="#0ca678"/>
  <rect x="454" y="136" width="22" height="22" rx="3" fill="#e6fcf5" stroke="#0ca678"/>
  <rect x="480" y="136" width="22" height="22" rx="3" fill="#e6fcf5" stroke="#0ca678"/>
  <rect x="506" y="136" width="22" height="22" rx="3" fill="#e6fcf5" stroke="#0ca678"/>
  <rect x="532" y="136" width="22" height="22" rx="3" fill="#e6fcf5" stroke="#0ca678"/>
  <text x="332" y="186" font-size="12" font-weight="700" fill="#495057">V</text>
  <rect x="350" y="172" width="22" height="22" rx="3" fill="#e6fcf5" stroke="#0ca678"/>
  <rect x="376" y="172" width="22" height="22" rx="3" fill="#e6fcf5" stroke="#0ca678"/>
  <rect x="402" y="172" width="22" height="22" rx="3" fill="#e6fcf5" stroke="#0ca678"/>
  <rect x="428" y="172" width="22" height="22" rx="3" fill="#e6fcf5" stroke="#0ca678"/>
  <rect x="454" y="172" width="22" height="22" rx="3" fill="#e6fcf5" stroke="#0ca678"/>
  <rect x="480" y="172" width="22" height="22" rx="3" fill="#e6fcf5" stroke="#0ca678"/>
  <rect x="506" y="172" width="22" height="22" rx="3" fill="#e6fcf5" stroke="#0ca678"/>
  <rect x="532" y="172" width="22" height="22" rx="3" fill="#e6fcf5" stroke="#0ca678"/>
  <text x="450" y="228" text-anchor="middle" font-size="12" font-family="monospace" fill="#0b7285">2 × 8 × 128</text>
  <text x="450" y="248" text-anchor="middle" font-size="12" font-family="monospace" fill="#0b7285">= 2048 元素</text>
  <text x="450" y="272" text-anchor="middle" font-size="11" fill="#868e96">只有 8 个 head，TP &gt; 8 后复制</text>
  <!-- panel MLA -->
  <rect x="600" y="76" width="276" height="210" rx="10" fill="#f8f9fa" stroke="#e9ecef"/>
  <text x="738" y="100" text-anchor="middle" font-size="14" font-weight="700" fill="#5f3dc4">MLA（DeepSeek-V3）</text>
  <text x="738" y="118" text-anchor="middle" font-size="11" fill="#868e96">只存一份压缩 latent + RoPE key</text>
  <rect x="620" y="140" width="190" height="40" rx="5" fill="#f3f0ff" stroke="#7048e8"/>
  <text x="715" y="165" text-anchor="middle" font-size="12" font-family="monospace" fill="#5f3dc4">c_kv · 512</text>
  <rect x="814" y="140" width="42" height="40" rx="5" fill="#fff9db" stroke="#f08c00"/>
  <text x="835" y="165" text-anchor="middle" font-size="11" font-family="monospace" fill="#e8590c">rope</text>
  <text x="835" y="196" text-anchor="middle" font-size="11" font-family="monospace" fill="#e8590c">64</text>
  <text x="738" y="228" text-anchor="middle" font-size="12" font-family="monospace" fill="#5f3dc4">512 + 64</text>
  <text x="738" y="248" text-anchor="middle" font-size="12" font-family="monospace" fill="#5f3dc4">= 576 元素，没有 head 维</text>
  <text x="738" y="272" text-anchor="middle" font-size="11" fill="#868e96">attention TP 组内每卡整份</text>

  <!-- grid -->
  <text x="24" y="318" font-size="14" font-weight="700" fill="#212529">每 token 每卡 KV（BF16）</text>
  <text x="250" y="318" font-size="11" fill="#868e96">MHA 一行为假想：Llama-3-70B 形状但 64 个 KV head</text>
  <text x="300" y="348" text-anchor="middle" font-size="12" font-weight="700" fill="#495057">层数</text>
  <text x="440" y="348" text-anchor="middle" font-size="12" font-weight="700" fill="#495057">全部层，不切</text>
  <text x="600" y="348" text-anchor="middle" font-size="12" font-weight="700" fill="#495057">TP=8 每卡</text>
  <text x="770" y="348" text-anchor="middle" font-size="12" font-weight="700" fill="#495057">TP=16 每卡</text>

  <text x="40" y="384" font-size="13" font-weight="700" fill="#3b5bdb">MHA</text>
  <text x="300" y="384" text-anchor="middle" font-size="12" font-family="monospace" fill="#495057">80</text>
  <rect x="370" y="364" width="140" height="30" rx="6" fill="#edf2ff" stroke="#4c6ef5"/>
  <text x="440" y="384" text-anchor="middle" font-size="12" font-family="monospace" fill="#3b5bdb">2.5 MiB</text>
  <rect x="530" y="364" width="140" height="30" rx="6" fill="#edf2ff" stroke="#4c6ef5"/>
  <text x="600" y="384" text-anchor="middle" font-size="12" font-family="monospace" fill="#3b5bdb">320 KiB</text>
  <rect x="700" y="364" width="140" height="30" rx="6" fill="#edf2ff" stroke="#4c6ef5"/>
  <text x="770" y="384" text-anchor="middle" font-size="12" font-family="monospace" fill="#3b5bdb">160 KiB</text>

  <text x="40" y="426" font-size="13" font-weight="700" fill="#0b7285">GQA</text>
  <text x="300" y="426" text-anchor="middle" font-size="12" font-family="monospace" fill="#495057">80</text>
  <rect x="370" y="406" width="140" height="30" rx="6" fill="#e6fcf5" stroke="#0ca678"/>
  <text x="440" y="426" text-anchor="middle" font-size="12" font-family="monospace" fill="#0b7285">320 KiB</text>
  <rect x="530" y="406" width="140" height="30" rx="6" fill="#e6fcf5" stroke="#0ca678"/>
  <text x="600" y="426" text-anchor="middle" font-size="12" font-family="monospace" fill="#0b7285">40 KiB</text>
  <rect x="700" y="406" width="140" height="30" rx="6" fill="#fff4e6" stroke="#f08c00"/>
  <text x="770" y="426" text-anchor="middle" font-size="12" font-family="monospace" fill="#e8590c">40 KiB（复制）</text>

  <text x="40" y="468" font-size="13" font-weight="700" fill="#5f3dc4">MLA</text>
  <text x="300" y="468" text-anchor="middle" font-size="12" font-family="monospace" fill="#495057">61</text>
  <rect x="370" y="448" width="140" height="30" rx="6" fill="#f3f0ff" stroke="#7048e8"/>
  <text x="440" y="468" text-anchor="middle" font-size="12" font-family="monospace" fill="#5f3dc4">68.6 KiB</text>
  <rect x="530" y="448" width="140" height="30" rx="6" fill="#fff4e6" stroke="#f08c00"/>
  <text x="600" y="468" text-anchor="middle" font-size="12" font-family="monospace" fill="#e8590c">68.6 KiB</text>
  <rect x="700" y="448" width="140" height="30" rx="6" fill="#fff4e6" stroke="#f08c00"/>
  <text x="770" y="468" text-anchor="middle" font-size="12" font-family="monospace" fill="#e8590c">68.6 KiB</text>

  <!-- note -->
  <rect x="24" y="500" width="852" height="60" rx="8" fill="#f8f9fa" stroke="#e9ecef"/>
  <text x="450" y="524" text-anchor="middle" font-size="12" fill="#495057">琥珀色 = 加 TP 不再省 KV。不切时 MLA 最省；TP=8 的每卡视角下，GQA 反而更省。</text>
  <text x="450" y="544" text-anchor="middle" font-size="12" fill="#495057">MLA 要让集群容量随卡数增长，需要 DP Attention 把不同请求的 KV 放到不同 rank。</text>
</svg>
