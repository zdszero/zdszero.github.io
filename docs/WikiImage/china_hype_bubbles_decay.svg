<text x="48.0" y="500.0" font-size="12" fill="#495057" text-anchor="start">高点市值：乐视网 1,527 亿元、暴风 369 亿元、商汤 2,729 亿港元、云从 437 亿元、MiniMax 3,883 亿港元、智谱 10,745 亿港元。商汤 2024—</text>
<text x="48.0" y="518.0" font-size="12" fill="#495057" text-anchor="start">2026 年多次配售，股本增加 27%，所以市值比例高于股价比例。</text>
<text x="48.0" y="536.0" font-size="12" fill="#495057" text-anchor="start">智谱 5 个月跌到高点的 17%，商汤用了 24 个月跌到 14%（月末最低 8%，第 27 个月）。乐视网 2019-05 起暂停上市，2020-07 退市时只剩 0.5%；暴</text>
