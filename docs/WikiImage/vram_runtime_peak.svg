<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#868e96"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="500" rx="12" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#212529">一次 prefill forward 中同时存活的显存</text>
  <text x="450" y="56" text-anchor="middle" font-size="13" fill="#868e96">8192 token、hidden 4096、intermediate 14336、词表 128256、BF16；柱高 = 该时刻存活的 activation</text>

  <!-- legend -->
  <g font-size="11.5" fill="#495057">
    <rect x="110" y="72" width="14" height="12" rx="2" fill="#edf2ff" stroke="#4c6ef5"/>
    <text x="130" y="82">hidden / residual（跨层常驻）</text>
    <rect x="300" y="72" width="14" height="12" rx="2" fill="#e6fcf5" stroke="#0ca678"/>
    <text x="320" y="82">QKV / attn 输出</text>
    <rect x="430" y="72" width="14" height="12" rx="2" fill="#fff4e6" stroke="#f08c00"/>
    <text x="450" y="82">MLP 中间层</text>
    <rect x="540" y="72" width="14" height="12" rx="2" fill="#fff5f5" stroke="#fa5252"/>
    <text x="560" y="82">logits（BF16 / FP32）</text>
  </g>

  <!-- axis -->
  <line x1="90" y1="390" x2="720" y2="390" stroke="#adb5bd" stroke-width="1.5"/>

  <!-- bracket over one decoder layer -->
  <path d="M110 118 L110 110 L510 110 L510 118" fill="none" stroke="#0b7285" stroke-width="1.5"/>
  <text x="310" y="104" text-anchor="middle" font-size="12" font-weight="700" fill="#0b7285">一个 decoder 层（× 32 层，每层复用同一批空闲块）</text>

  <!-- peak line -->
  <line x1="90" y1="160" x2="560" y2="160" stroke="#e8590c" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="96" y="153" font-size="11.5" fill="#e8590c">层内峰值 ≈ 0.72 GiB</text>
  <!-- c1 QKV -->
  <rect x="110" y="350" width="50" height="40" fill="#edf2ff" stroke="#4c6ef5"/>
  <rect x="110" y="320" width="50" height="30" fill="#e6fcf5" stroke="#0ca678"/>
  <!-- c2 attention -->
  <rect x="180" y="370" width="50" height="20" fill="#edf2ff" stroke="#4c6ef5"/>
  <rect x="180" y="340" width="50" height="30" fill="#e6fcf5" stroke="#0ca678"/>
  <rect x="180" y="320" width="50" height="20" fill="#c3fae8" stroke="#0ca678"/>
  <!-- c3 o_proj -->
  <rect x="250" y="350" width="50" height="40" fill="#edf2ff" stroke="#4c6ef5"/>
  <!-- c4 gate_up -->
  <rect x="320" y="350" width="50" height="40" fill="#edf2ff" stroke="#4c6ef5"/>
  <rect x="320" y="210" width="50" height="140" fill="#fff4e6" stroke="#f08c00"/>
  <!-- c5 act -->
  <rect x="390" y="370" width="50" height="20" fill="#edf2ff" stroke="#4c6ef5"/>
  <rect x="390" y="230" width="50" height="140" fill="#fff4e6" stroke="#f08c00"/>
  <rect x="390" y="160" width="50" height="70" fill="#ffe8cc" stroke="#e8590c"/>
  <!-- c6 down -->
  <rect x="460" y="370" width="50" height="20" fill="#edf2ff" stroke="#4c6ef5"/>
  <rect x="460" y="300" width="50" height="70" fill="#ffe8cc" stroke="#e8590c"/>
  <rect x="460" y="280" width="50" height="20" fill="#e6fcf5" stroke="#0ca678"/>

  <!-- c7 lm head, all positions (broken bar) -->
  <rect x="580" y="370" width="50" height="20" fill="#edf2ff" stroke="#4c6ef5"/>
  <rect x="580" y="130" width="50" height="240" fill="#fff5f5" stroke="#fa5252"/>
  <!-- c8 .float(): bf16 + fp32 coexist (broken bar) -->
  <rect x="650" y="290" width="50" height="100" fill="#fff5f5" stroke="#fa5252"/>
  <rect x="650" y="120" width="50" height="170" fill="#ffe3e3" stroke="#c92a2a"/>
  <!-- break marks -->
  <path d="M574 236 L636 226 L636 236 L574 246 z" fill="#ffffff"/>
  <path d="M644 206 L706 196 L706 206 L644 216 z" fill="#ffffff"/>

  <!-- value labels -->
  <g font-size="11" font-family="monospace" fill="#495057" text-anchor="middle">
    <text x="135" y="313">224M</text>
    <text x="205" y="313">224M</text>
    <text x="275" y="343">128M</text>
    <text x="345" y="203">576M</text>
    <text x="415" y="153" fill="#e8590c" font-weight="700">736M</text>
    <text x="485" y="273">352M</text>
    <text x="605" y="123" fill="#c92a2a">1.96G</text>
    <text x="675" y="113" fill="#c92a2a" font-weight="700">≈5.9G</text>
  </g>
  <g font-size="10" fill="#c92a2a" text-anchor="middle">
    <text x="605" y="300">BF16</text>
    <text x="675" y="345">BF16</text>
    <text x="675" y="260">FP32</text>
  </g>

  <!-- x labels -->
  <g font-size="11.5" fill="#495057" text-anchor="middle">
    <text x="135" y="408">QKV proj</text>
    <text x="205" y="408">attention</text>
    <text x="275" y="408">o_proj</text>
    <text x="345" y="408">gate_up</text>
    <text x="415" y="408">SiluAndMul</text>
    <text x="485" y="408">down_proj</text>
    <text x="605" y="408">lm head</text>
    <text x="675" y="408">.float()</text>
  </g>
  <text x="640" y="424" text-anchor="middle" font-size="11" fill="#868e96">若对全部 8192 个位置算 logits</text>
  <!-- inset: how SGLang caps logits -->
  <rect x="728" y="110" width="156" height="300" rx="10" fill="#f3f0ff" stroke="#7048e8"/>
  <text x="806" y="132" text-anchor="middle" font-size="13" font-weight="700" fill="#5f3dc4">把 logits 封顶</text>
  <text x="742" y="160" font-size="12" font-weight="700" fill="#5f3dc4">只取末位</text>
  <text x="742" y="177" font-size="11" fill="#495057">hidden[last_index]</text>
  <text x="742" y="193" font-size="11" fill="#495057">8 个请求 → 8 行</text>
  <text x="742" y="211" font-size="11.5" font-family="monospace" fill="#5f3dc4">[8, 128256] ≈ 4M</text>
  <line x1="742" y1="226" x2="870" y2="226" stroke="#d0bfff"/>
  <text x="742" y="248" font-size="12" font-weight="700" fill="#5f3dc4">input logprob 分块</text>
  <text x="742" y="265" font-size="11" fill="#495057">每块 2048 行</text>
  <text x="742" y="281" font-size="11" fill="#495057">BF16 + FP32 同时存活</text>
  <text x="742" y="299" font-size="11.5" font-family="monospace" fill="#5f3dc4">≈ 1.47G / 块</text>
  <line x1="742" y1="314" x2="870" y2="314" stroke="#d0bfff"/>
  <text x="742" y="336" font-size="12" font-weight="700" fill="#5f3dc4">采样原地 softmax</text>
  <text x="742" y="353" font-size="11" fill="#495057">logits[:] = softmax(...)</text>
  <text x="742" y="369" font-size="11" fill="#495057">probs 复用 logits 存储</text>

  <!-- note -->
  <rect x="30" y="440" width="840" height="44" rx="8" fill="#f8f9fa" stroke="#e9ecef"/>
  <text x="450" y="458" text-anchor="middle" font-size="12" fill="#495057">层内张量在下一层开始前就释放，32 层的峰值 ≈ 一层最宽处（MLP），不是 32 倍；</text>
  <text x="450" y="476" text-anchor="middle" font-size="12" fill="#495057">词表维度让 lm head 输出宽出一个数量级，峰值由“对多少个位置算 logits”决定。</text>
</svg>
