<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="470" rx="12" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#212529">Prefill 与 Decode 的运行时显存形态</text>
  <text x="450" y="56" text-anchor="middle" font-size="13" fill="#868e96">两者的 activation 随不同变量增长，也由不同的参数封顶</text>

  <!-- LEFT panel: prefill -->
  <rect x="30" y="74" width="410" height="300" rx="10" fill="#fff9db" stroke="#f08c00"/>
  <text x="50" y="98" font-size="14" font-weight="700" fill="#e8590c">Prefill：随单次 forward 的 token 数增长</text>
  <text x="50" y="116" font-size="11.5" fill="#868e96">一个 32k token 的 prompt</text>
  <line x1="50" y1="330" x2="420" y2="330" stroke="#adb5bd" stroke-width="1.5"/>

  <!-- unchunked -->
  <rect x="62" y="130" width="56" height="200" rx="3" fill="#fff5f5" stroke="#fa5252" stroke-dasharray="5 3"/>
  <text x="90" y="225" text-anchor="middle" font-size="11" font-family="monospace" fill="#c92a2a">4×</text>
  <!-- chunks -->
  <rect x="160" y="280" width="50" height="50" rx="3" fill="#fff4e6" stroke="#f08c00"/>
  <rect x="222" y="280" width="50" height="50" rx="3" fill="#fff4e6" stroke="#f08c00"/>
  <rect x="284" y="280" width="50" height="50" rx="3" fill="#fff4e6" stroke="#f08c00"/>
  <rect x="346" y="280" width="50" height="50" rx="3" fill="#fff4e6" stroke="#f08c00"/>
  <line x1="150" y1="280" x2="410" y2="280" stroke="#e8590c" stroke-width="1.3" stroke-dasharray="5 4"/>
  <text x="278" y="272" text-anchor="middle" font-size="11.5" font-weight="700" fill="#e8590c">峰值上限 ∝ chunked_prefill_size</text>
  <g font-size="11" fill="#495057" text-anchor="middle">
    <text x="90" y="347">不分块</text>
    <text x="90" y="362">一次 32k</text>
    <text x="185" y="347">块 1</text>
    <text x="247" y="347">块 2</text>
    <text x="309" y="347">块 3</text>
    <text x="371" y="347">块 4</text>
  </g>
  <text x="278" y="362" text-anchor="middle" font-size="11" fill="#868e96">每块 8k，块之间 activation 全部释放</text>
  <text x="278" y="160" text-anchor="middle" font-size="11.5" fill="#495057">分块后峰值与 prompt 总长无关，</text>
  <text x="278" y="177" text-anchor="middle" font-size="11.5" fill="#495057">代价是多跑几轮 forward、</text>
  <text x="278" y="194" text-anchor="middle" font-size="11.5" fill="#495057">后面的块读前面写入的 KV</text>
  <!-- RIGHT panel: decode -->
  <rect x="460" y="74" width="410" height="300" rx="10" fill="#edf2ff" stroke="#4c6ef5"/>
  <text x="480" y="98" font-size="14" font-weight="700" fill="#3b5bdb">Decode：随 batch size 增长</text>
  <text x="480" y="116" font-size="11.5" fill="#868e96">每个请求每步 1 个 token（投机解码时几个）</text>
  <line x1="480" y1="330" x2="850" y2="330" stroke="#adb5bd" stroke-width="1.5"/>

  <!-- graph-pinned region -->
  <rect x="496" y="150" width="290" height="180" rx="4" fill="#f3f0ff" stroke="#7048e8" stroke-dasharray="6 4"/>
  <text x="641" y="168" text-anchor="middle" font-size="11.5" font-weight="700" fill="#5f3dc4">CUDA Graph 私有池：按最大 capture bs 常驻</text>
  <!-- bars proportional to bs -->
  <rect x="510" y="327" width="50" height="3" fill="#dbe4ff" stroke="#4c6ef5"/>
  <rect x="578" y="310" width="50" height="20" fill="#dbe4ff" stroke="#4c6ef5"/>
  <rect x="646" y="250" width="50" height="80" fill="#dbe4ff" stroke="#4c6ef5"/>
  <rect x="714" y="180" width="50" height="150" fill="#dbe4ff" stroke="#4c6ef5"/>
  <g font-size="11" font-family="monospace" fill="#495057" text-anchor="middle">
    <text x="535" y="347">bs=1</text>
    <text x="603" y="347">bs=32</text>
    <text x="671" y="347">bs=128</text>
    <text x="739" y="347">bs=256</text>
  </g>
  <text x="832" y="236" text-anchor="middle" font-size="11" fill="#495057">超过最大</text>
  <text x="832" y="251" text-anchor="middle" font-size="11" fill="#495057">capture bs</text>
  <text x="832" y="266" text-anchor="middle" font-size="11" fill="#495057">→ 退回 eager</text>
  <text x="641" y="362" text-anchor="middle" font-size="11" fill="#868e96">单步很小，但图捕获后最大桶的峰值一直被占住</text>

  <!-- note: SGLang reserved_mem mapping -->
  <rect x="30" y="390" width="840" height="64" rx="8" fill="#f8f9fa" stroke="#e9ecef"/>
  <text x="50" y="412" font-size="12" font-weight="700" fill="#495057">SGLang 的余量估算（server_args.py，单位 MB）</text>
  <text x="50" y="432" font-size="12" fill="#495057">activation：<tspan font-family="monospace" fill="#e8590c">max(chunked_prefill_size, 2048) × 1.5</tspan>（PD decode 实例换成 running_bs × draft_tokens）</text>
  <text x="50" y="448" font-size="12" fill="#495057">decode 图：<tspan font-family="monospace" fill="#5f3dc4">max_bs × 2</tspan>（reserve_for_graph_mb）；两项计入 reserved_mem，决定 1 − mem_fraction_static</text>
</svg>
