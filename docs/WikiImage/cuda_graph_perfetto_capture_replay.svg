<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#868e96"/>
    </marker>
    <marker id="arA" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#f08c00"/>
    </marker>
    <marker id="arT" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#0ca678"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="480" rx="12" fill="#ffffff"/>
  <text x="30" y="34" font-size="20" font-weight="700" fill="#212529">stream 是 capture 时写依赖的语法，replay 时只剩 DAG</text>
  <text x="30" y="56" font-size="13" fill="#868e96">示意：代码里用了三条 stream；replay 后 Perfetto 里的 stream 号由驱动决定，主链被切成很多段</text>

  <!-- panel A: capture -->
  <rect x="30" y="78" width="270" height="300" rx="10" fill="#edf2ff" stroke="#4c6ef5"/>
  <text x="46" y="102" font-size="14" font-weight="700" fill="#3b5bdb">① capture：代码里的 stream</text>
  <text x="46" y="128" font-size="11" fill="#495057">compute（current stream）</text>
  <rect x="46" y="136" width="70" height="30" rx="6" fill="#ffffff" stroke="#4c6ef5"/>
  <text x="81" y="156" font-size="12" font-weight="700" fill="#3b5bdb" text-anchor="middle">L0</text>
  <rect x="124" y="136" width="70" height="30" rx="6" fill="#ffffff" stroke="#4c6ef5"/>
  <text x="159" y="156" font-size="12" font-weight="700" fill="#3b5bdb" text-anchor="middle">L1</text>
  <rect x="202" y="136" width="70" height="30" rx="6" fill="#ffffff" stroke="#4c6ef5"/>
  <text x="237" y="156" font-size="12" font-weight="700" fill="#3b5bdb" text-anchor="middle">L2</text>

  <text x="46" y="196" font-size="11" fill="#495057">alt_stream</text>
  <rect x="46" y="204" width="50" height="28" rx="6" fill="#e6fcf5" stroke="#0ca678"/>
  <text x="71" y="222" font-size="11" font-weight="700" fill="#0b7285" text-anchor="middle">SE0</text>

  <text x="46" y="262" font-size="11" fill="#495057">k3_weight_shard 侧流</text>
  <rect x="60" y="270" width="56" height="28" rx="6" fill="#fff9db" stroke="#f08c00"/>
  <text x="88" y="288" font-size="11" font-weight="700" fill="#e8590c" text-anchor="middle">AG1</text>
  <rect x="138" y="270" width="56" height="28" rx="6" fill="#fff9db" stroke="#f08c00"/>
  <text x="166" y="288" font-size="11" font-weight="700" fill="#e8590c" text-anchor="middle">AG2</text>

  <path d="M96 210 L106 170" stroke="#0ca678" stroke-width="1.6" fill="none" marker-end="url(#arT)"/>
  <path d="M116 270 L128 170" stroke="#f08c00" stroke-width="1.6" fill="none" marker-end="url(#arA)"/>
  <path d="M194 270 L206 170" stroke="#f08c00" stroke-width="1.6" fill="none" marker-end="url(#arA)"/>
  <path d="M116 166 L140 268" stroke="#f08c00" stroke-width="1.4" stroke-dasharray="4 3" fill="none" marker-end="url(#arA)"/>

  <text x="46" y="326" font-size="11" fill="#495057">实线：wait_event 汇合</text>
  <text x="46" y="344" font-size="11" fill="#495057">虚线：AG2 等 L0 做完（槽位复用）</text>
  <text x="46" y="362" font-size="11" fill="#868e96">SE0 = 共享专家，AG = 权重 AllGather</text>
  <path d="M302 228 L316 228" stroke="#868e96" stroke-width="2" marker-end="url(#ar)"/>

  <!-- panel B: graph -->
  <rect x="320" y="78" width="240" height="300" rx="10" fill="#f8f9fa" stroke="#adb5bd"/>
  <text x="336" y="102" font-size="14" font-weight="700" fill="#495057">② graph：节点 + 依赖边</text>
  <rect x="405" y="126" width="70" height="30" rx="6" fill="#ffffff" stroke="#4c6ef5"/>
  <text x="440" y="146" font-size="12" font-weight="700" fill="#3b5bdb" text-anchor="middle">L0</text>
  <rect x="405" y="206" width="70" height="30" rx="6" fill="#ffffff" stroke="#4c6ef5"/>
  <text x="440" y="226" font-size="12" font-weight="700" fill="#3b5bdb" text-anchor="middle">L1</text>
  <rect x="405" y="286" width="70" height="30" rx="6" fill="#ffffff" stroke="#4c6ef5"/>
  <text x="440" y="306" font-size="12" font-weight="700" fill="#3b5bdb" text-anchor="middle">L2</text>
  <rect x="494" y="166" width="54" height="28" rx="6" fill="#e6fcf5" stroke="#0ca678"/>
  <text x="521" y="184" font-size="11" font-weight="700" fill="#0b7285" text-anchor="middle">SE0</text>
  <rect x="330" y="166" width="54" height="28" rx="6" fill="#fff9db" stroke="#f08c00"/>
  <text x="357" y="184" font-size="11" font-weight="700" fill="#e8590c" text-anchor="middle">AG1</text>
  <rect x="330" y="246" width="54" height="28" rx="6" fill="#fff9db" stroke="#f08c00"/>
  <text x="357" y="264" font-size="11" font-weight="700" fill="#e8590c" text-anchor="middle">AG2</text>
  <path d="M440 156 L440 202" stroke="#868e96" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M440 236 L440 282" stroke="#868e96" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M475 148 L494 170" stroke="#0ca678" stroke-width="1.6" marker-end="url(#arT)"/>
  <path d="M516 194 L478 214" stroke="#0ca678" stroke-width="1.6" marker-end="url(#arT)"/>
  <path d="M384 184 L403 212" stroke="#f08c00" stroke-width="1.6" marker-end="url(#arA)"/>
  <path d="M384 264 L403 292" stroke="#f08c00" stroke-width="1.6" marker-end="url(#arA)"/>
  <path d="M405 152 L372 243" stroke="#f08c00" stroke-width="1.4" stroke-dasharray="4 3" fill="none" marker-end="url(#arA)"/>
  <text x="336" y="344" font-size="11" fill="#495057">节点上不再带 stream 信息</text>
  <text x="336" y="362" font-size="11" fill="#868e96">capture 用的 stream 只用来推出边</text>
  <path d="M562 228 L576 228" stroke="#868e96" stroke-width="2" marker-end="url(#ar)"/>
  <!-- panel C: replay as seen in Perfetto -->
  <rect x="580" y="78" width="290" height="300" rx="10" fill="#f3f0ff" stroke="#7048e8"/>
  <text x="596" y="102" font-size="14" font-weight="700" fill="#5f3dc4">③ replay：Perfetto 看到的轨道</text>
  <text x="596" y="141" font-size="11" font-family="monospace" fill="#495057">s31</text>
  <rect x="640" y="118" width="18" height="6" rx="2" fill="#7048e8"/>
  <rect x="640" y="127" width="18" height="20" rx="4" fill="#ffffff" stroke="#adb5bd"/>

  <text x="596" y="175" font-size="11" font-family="monospace" fill="#495057">s377</text>
  <rect x="660" y="152" width="64" height="6" rx="2" fill="#7048e8"/>
  <rect x="660" y="161" width="64" height="20" rx="4" fill="#ffffff" stroke="#4c6ef5"/>
  <text x="692" y="175" font-size="11" font-weight="700" fill="#3b5bdb" text-anchor="middle">L0</text>

  <text x="596" y="209" font-size="11" font-family="monospace" fill="#495057">s380</text>
  <rect x="688" y="186" width="32" height="6" rx="2" fill="#7048e8"/>
  <rect x="688" y="195" width="32" height="20" rx="4" fill="#e6fcf5" stroke="#0ca678"/>
  <text x="704" y="209" font-size="10" font-weight="700" fill="#0b7285" text-anchor="middle">SE0</text>

  <text x="596" y="243" font-size="11" font-family="monospace" fill="#495057">s379</text>
  <rect x="728" y="220" width="62" height="6" rx="2" fill="#7048e8"/>
  <rect x="728" y="229" width="62" height="20" rx="4" fill="#ffffff" stroke="#4c6ef5"/>
  <text x="759" y="243" font-size="11" font-weight="700" fill="#3b5bdb" text-anchor="middle">L1</text>

  <text x="596" y="277" font-size="11" font-family="monospace" fill="#495057">s382</text>
  <rect x="794" y="254" width="60" height="6" rx="2" fill="#7048e8"/>
  <rect x="794" y="263" width="60" height="20" rx="4" fill="#ffffff" stroke="#4c6ef5"/>
  <text x="824" y="277" font-size="11" font-weight="700" fill="#3b5bdb" text-anchor="middle">L2</text>

  <text x="596" y="311" font-size="11" font-family="monospace" fill="#495057">s376</text>
  <rect x="646" y="288" width="144" height="6" rx="2" fill="#7048e8"/>
  <rect x="646" y="297" width="74" height="20" rx="4" fill="#fff9db" stroke="#f08c00"/>
  <text x="683" y="311" font-size="10.5" font-weight="700" fill="#e8590c" text-anchor="middle">AG1</text>
  <rect x="726" y="297" width="64" height="20" rx="4" fill="#fff9db" stroke="#f08c00"/>
  <text x="758" y="311" font-size="10.5" font-weight="700" fill="#e8590c" text-anchor="middle">AG2</text>

  <text x="596" y="344" font-size="11" fill="#495057">紫条：step[TARGET_VERIFY] 在该轨道的投影</text>
  <text x="596" y="362" font-size="11" fill="#868e96">长度 = 这条轨道上首尾 kernel 的跨度</text>

  <!-- note -->
  <rect x="30" y="394" width="840" height="66" rx="8" fill="#f8f9fa" stroke="#e9ecef"/>
  <text x="46" y="418" font-size="12" fill="#495057">一次 cudaGraphLaunch 的 kernel 共用一个 correlation id；驱动把节点摆到内部 stream 上，Perfetto 按 stream 分轨。</text>
  <text x="46" y="440" font-size="12" fill="#495057">所以轨道数反映驱动怎么摆放节点，不等于并发路数。真正的并发只看依赖边：这里是主链 + 共享专家分叉 + 权重 AllGather 侧流。</text>


</svg>
