<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="500" rx="12" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#212529">一次异步 AllReduce 的三个时刻，以及跨 rank 的等待</text>
  <text x="450" y="56" text-anchor="middle" font-size="13" fill="#868e96">torch.distributed NCCL 后端示意（非实测比例）：通信在内部 NCCL stream 上执行，与计算 stream 通过事件衔接</text>

  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#868e96"/></marker>
  </defs>

  <!-- lane labels -->
  <g font-size="12" fill="#495057">
    <text x="30" y="114">rank 0 · CPU</text>
    <text x="30" y="159">rank 0 · 计算 stream</text>
    <text x="30" y="204">rank 0 · NCCL stream</text>
    <text x="30" y="269">rank 1 · 计算 stream</text>
    <text x="30" y="314">rank 1 · NCCL stream</text>
  </g>
  <line x1="30" y1="236" x2="870" y2="236" stroke="#dee2e6" stroke-width="1.5"/>

  <!-- moment markers -->
  <g stroke="#f08c00" stroke-width="1.5" stroke-dasharray="3 3">
    <line x1="345" y1="88" x2="345" y2="96"/>
    <line x1="505" y1="88" x2="505" y2="141"/>
    <line x1="640" y1="88" x2="640" y2="141"/>
  </g>
  <g font-size="11" font-weight="700" text-anchor="middle" fill="#ffffff">
    <circle cx="345" cy="78" r="9" fill="#f08c00"/><text x="345" y="82">1</text>
    <circle cx="505" cy="78" r="9" fill="#f08c00"/><text x="505" y="82">2</text>
    <circle cx="640" cy="78" r="9" fill="#f08c00"/><text x="640" y="82">3</text>
  </g>

  <!-- rank0 CPU -->
  <g font-size="11" text-anchor="middle">
    <rect x="160" y="97" width="70" height="26" rx="6" fill="#f1f3f5" stroke="#adb5bd"/>
    <text x="195" y="114" fill="#495057">提交 生产 x</text>
    <rect x="235" y="97" width="110" height="26" rx="6" fill="#fff4e6" stroke="#f08c00"/>
    <text x="290" y="114" fill="#e8590c" font-weight="700">all_reduce 异步</text>
    <rect x="350" y="97" width="80" height="26" rx="6" fill="#f1f3f5" stroke="#adb5bd"/>
    <text x="390" y="114" fill="#495057">提交 独立计算</text>
    <rect x="435" y="97" width="70" height="26" rx="6" fill="#fff4e6" stroke="#f08c00"/>
    <text x="470" y="114" fill="#e8590c" font-weight="700" font-size="10.5">work.wait()</text>
    <rect x="510" y="97" width="70" height="26" rx="6" fill="#f1f3f5" stroke="#adb5bd"/>
    <text x="545" y="114" fill="#495057">提交 消费 x</text>
  </g>
  <text x="652" y="114" font-size="11" fill="#868e96">CPU 不阻塞，继续调度下一步…</text>

  <!-- rank0 compute -->
  <g font-size="11.5" text-anchor="middle">
    <rect x="160" y="142" width="140" height="26" rx="6" fill="#edf2ff" stroke="#4c6ef5"/>
    <text x="230" y="159" fill="#3b5bdb" font-weight="700">生产 x</text>
    <rect x="305" y="142" width="195" height="26" rx="6" fill="#edf2ff" stroke="#4c6ef5"/>
    <text x="402" y="159" fill="#3b5bdb">独立计算（可重叠）</text>
    <rect x="505" y="142" width="135" height="26" rx="6" fill="#f8f9fa" stroke="#adb5bd" stroke-dasharray="4 3"/>
    <text x="572" y="159" fill="#868e96">等通信</text>
    <rect x="645" y="142" width="135" height="26" rx="6" fill="#edf2ff" stroke="#4c6ef5"/>
    <text x="712" y="159" fill="#3b5bdb" font-weight="700">消费 x</text>
  </g>

  <!-- rank0 NCCL -->
  <g font-size="11.5" text-anchor="middle">
    <rect x="305" y="187" width="175" height="26" rx="6" fill="#fff5f5" stroke="#fa5252"/>
    <text x="392" y="204" fill="#c92a2a">等 rank 1 到达</text>
    <rect x="480" y="187" width="160" height="26" rx="6" fill="#fff9db" stroke="#f08c00"/>
    <text x="560" y="204" fill="#e8590c" font-weight="700">AllReduce 传输</text>
  </g>
  <path d="M300 168 L304 185" stroke="#868e96" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  <path d="M640 187 L646 170" stroke="#868e96" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  <!-- rank1 compute -->
  <g font-size="11.5" text-anchor="middle">
    <rect x="160" y="252" width="315" height="26" rx="6" fill="#edf2ff" stroke="#4c6ef5"/>
    <text x="317" y="269" fill="#3b5bdb" font-weight="700">生产 x（负载更重，更晚完成）</text>
    <rect x="480" y="252" width="160" height="26" rx="6" fill="#f8f9fa" stroke="#adb5bd" stroke-dasharray="4 3"/>
    <text x="560" y="269" fill="#868e96">等通信</text>
    <rect x="645" y="252" width="135" height="26" rx="6" fill="#edf2ff" stroke="#4c6ef5"/>
    <text x="712" y="269" fill="#3b5bdb" font-weight="700">消费 x</text>
  </g>

  <!-- rank1 NCCL -->
  <rect x="480" y="297" width="160" height="26" rx="6" fill="#fff9db" stroke="#f08c00"/>
  <text x="560" y="314" text-anchor="middle" font-size="11.5" fill="#e8590c" font-weight="700">AllReduce 传输</text>
  <path d="M475 278 L480 295" stroke="#868e96" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>
  <path d="M640 297 L646 280" stroke="#868e96" stroke-width="1.5" fill="none" marker-end="url(#ar)"/>

  <!-- cross-rank rendezvous -->
  <path d="M480 180 L480 330" stroke="#0ca678" stroke-width="1.5" stroke-dasharray="5 3" fill="none"/>
  <text x="480" y="346" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0b7285">两端都到达，传输才开始</text>

  <!-- legend -->
  <rect x="50" y="358" width="800" height="80" rx="9" fill="#ffffff" stroke="#e9ecef"/>
  <g font-size="12" fill="#495057">
    <circle cx="74" cy="374" r="9" fill="#f08c00"/><text x="74" y="378" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">1</text>
    <text x="92" y="378">all_reduce(async_op=True) 返回 Work：只表示通信已入队，结果还没有算出来</text>
    <circle cx="74" cy="398" r="9" fill="#f08c00"/><text x="74" y="402" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">2</text>
    <text x="92" y="402">work.wait()：让 rank 0 的计算 stream 在此等待通信完成；CPU 本身不等，继续提交后续工作</text>
    <circle cx="74" cy="422" r="9" fill="#f08c00"/><text x="74" y="426" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">3</text>
    <text x="92" y="426">通信在 GPU 上真正完成；排在它后面的“消费 x”这时才开始执行</text>
  </g>

  <!-- note -->
  <rect x="50" y="450" width="800" height="36" rx="9" fill="#f8f9fa" stroke="#e9ecef"/>
  <text x="68" y="473" font-size="12" fill="#495057">rank 0 先到也只能等：慢 rank 的时间被计入“通信耗时”；async_op 只提供重叠机会，能重叠的只有不依赖 x 的独立计算。</text>
</svg>
