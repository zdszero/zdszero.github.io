    <rect x="620" y="378" width="5" height="2"/><rect x="628" y="378" width="5" height="2"/>
    <rect x="636" y="378" width="5" height="2"/><rect x="644" y="378" width="5" height="2"/>
    <rect x="652" y="378" width="5" height="2"/><rect x="660" y="378" width="5" height="2"/>
    <rect x="668" y="378" width="5" height="2"/><rect x="676" y="378" width="5" height="2"/>
    <rect x="684" y="378" width="5" height="2"/><rect x="692" y="378" width="5" height="2"/>
    <rect x="700" y="378" width="5" height="2"/><rect x="708" y="378" width="5" height="2"/>
    <rect x="716" y="378" width="5" height="2"/><rect x="724" y="378" width="5" height="2"/>
    <rect x="732" y="378" width="5" height="2"/><rect x="740" y="378" width="5" height="2"/>
    <rect x="748" y="378" width="5" height="2"/><rect x="756" y="378" width="5" height="2"/>
    <rect x="764" y="378" width="5" height="2"/><rect x="772" y="378" width="5" height="2"/>
    <rect x="780" y="378" width="5" height="2"/>
  </g>
  <rect x="810" y="361.28" width="44" height="18.72" fill="#f3f0ff" stroke="#7048e8"/>

  <!-- value labels -->
  <g font-size="11" font-weight="700" text-anchor="middle" fill="#495057">
    <text x="95" y="370">0.18</text>
    <text x="147" y="244" fill="#3b5bdb">7.17</text>
    <text x="244" y="370" fill="#0b7285">0.23</text>
    <text x="352" y="363" fill="#5f3dc4">0.56</text>
    <text x="525" y="350">1.33</text>
    <text x="577" y="189" fill="#3b5bdb">10.24</text>
    <text x="698" y="366" fill="#0b7285">1.35</text>
    <text x="832" y="355" fill="#5f3dc4">1.04</text>
  </g>
  <g font-size="10" fill="#3b5bdb" text-anchor="middle">
    <text x="147" y="320">最大一档</text>
    <text x="577" y="320">最大一档</text>
  </g>
  <g font-size="10" fill="#868e96" text-anchor="start">
    <text x="612" y="346">bs 184 留 0.37，其后每档约 0.05</text>
  </g>

  <!-- x labels -->
  <g font-size="10.5" fill="#495057" text-anchor="middle">
    <text x="95" y="396">静态</text><text x="147" y="396">bs 24</text>
    <text x="244" y="396">其余 5 档</text><text x="352" y="396">draft</text>
    <text x="525" y="396">静态</text><text x="577" y="396">bs 192</text>
    <text x="698" y="396">其余 22 档</text><text x="832" y="396">draft</text>
  </g>
  <g font-size="11" fill="#212529" text-anchor="middle">
    <text x="263" y="414">target 7.58 + draft 0.56 = <tspan font-weight="700">8.14 GiB</tspan></text>
    <text x="698" y="414">target 12.92 + draft 1.04 = <tspan font-weight="700">13.96 GiB</tspan></text>
  </g>

  <!-- note strip -->
  <rect x="24" y="424" width="872" height="32" rx="8" fill="#f8f9fa"/>
  <text x="460" y="444" text-anchor="middle" font-size="11.5" fill="#495057">DP2 多捕获 17 档，档位增量只多 1.1 GiB。两边差的 5.8 GiB 里，最大一档 +3.1，静态 buffer +1.2，draft +0.5。</text>
</svg>
