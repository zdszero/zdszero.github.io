<text x="48.0" y="806.0" font-size="12" fill="#495057" text-anchor="start">来源：东方财富研报中心报告摘要、东方财富估值分析与期货日 K、东方财富股吧帖子标题。2026 年的“高估”只基于预测下调，全年实际值以年报为</text>
