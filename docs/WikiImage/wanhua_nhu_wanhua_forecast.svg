<text x="48.0" y="520.0" font-size="12" fill="#495057" text-anchor="start">2021-02-18 股价见顶时，国金对 2021 年的预测是 142.3 亿，之后上修到 246 亿；2026-03-02 见顶后，国信把 2026E 从 158.7 亿上修到 202.3 亿，</text>
<text x="48.0" y="538.0" font-size="12" fill="#495057" text-anchor="start">股价却比顶点低 27%。</text>
<text x="48.0" y="556.0" font-size="12" fill="#495057" text-anchor="start">2024E 从 2022-04 的 280 亿一路下修，实际 130.3 亿。2026 年尚无年度实际值，前三季度为 156.6 亿。</text>
<text x="48.0" y="574.0" font-size="12" fill="#495057" text-anchor="start">来源：东方财富研报中心报告摘要；实际值为公司年报，画在年报披露日。</text>
