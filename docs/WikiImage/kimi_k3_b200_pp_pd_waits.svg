<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="920" height="560" rx="12" fill="#ffffff"/>
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#868e96"/>
    </marker>
  </defs>
  <text x="460" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#212529">PP16 prefill 的四处等待，以及各自怎么拿掉</text>
  <text x="460" y="56" text-anchor="middle" font-size="13" fill="#868e96">红色是改之前多出来的等待；绿色是改之后。前三项是 PD 控制面，最后一项是 stage 间数据面</text>

  <!-- panel 1: early last chunk -->
  <rect x="20" y="74" width="430" height="200" rx="10" fill="#f8f9fa" stroke="#e9ecef"/>
  <text x="36" y="98" font-size="13.5" font-weight="700" fill="#212529">① 早发 last chunk（luno-4975）</text>
  <text x="36" y="116" font-size="11" fill="#868e96">每个 stage 算完自己的层，这几层的 KV 就已是终值</text>
  <text x="36" y="144" font-size="11" fill="#c92a2a" font-weight="700">旧</text>
  <rect x="60" y="130" width="70" height="22" rx="4" fill="#edf2ff" stroke="#4c6ef5"/>
  <text x="95" y="145" text-anchor="middle" font-size="10" fill="#3b5bdb">本 stage 算完</text>
  <rect x="130" y="130" width="200" height="22" rx="4" fill="#fff5f5" stroke="#fa5252"/>
  <text x="230" y="145" text-anchor="middle" font-size="10" fill="#c92a2a">等输出环回到 PP0、再通知回来</text>
  <rect x="330" y="130" width="60" height="22" rx="4" fill="#fff4e6" stroke="#f08c00"/>
  <text x="360" y="145" text-anchor="middle" font-size="10" fill="#e8590c">发 KV</text>
  <text x="36" y="186" font-size="11" fill="#0b7285" font-weight="700">新</text>
  <rect x="60" y="172" width="70" height="22" rx="4" fill="#edf2ff" stroke="#4c6ef5"/>
  <text x="95" y="187" text-anchor="middle" font-size="10" fill="#3b5bdb">本 stage 算完</text>
  <rect x="130" y="172" width="60" height="22" rx="4" fill="#fff4e6" stroke="#f08c00"/>
  <text x="160" y="187" text-anchor="middle" font-size="10" fill="#e8590c">发 KV</text>
  <text x="200" y="187" font-size="10" fill="#0b7285">下一轮 CPU 阶段就发，不等环</text>
  <text x="36" y="226" font-size="11" fill="#495057">只有 PP0 发 aux（首 token），其余 stage 各发自己层的</text>
  <text x="36" y="244" font-size="11" fill="#495057">KV / state，输出环里“回传再下发”的那半圈直接去掉</text>
  <text x="36" y="262" font-size="10.5" fill="#868e96">仅 Mooncake；不支持 logprob、grammar 等（DSPARK 除外）</text>

  <!-- panel 2: sideband consensus -->
  <rect x="470" y="74" width="430" height="200" rx="10" fill="#f8f9fa" stroke="#e9ecef"/>
  <text x="486" y="98" font-size="13.5" font-weight="700" fill="#212529">② sideband 入队共识（luno-4978）</text>
  <text x="486" y="116" font-size="11" fill="#868e96">“16 个 stage 都准备好接这个请求”怎么确认</text>
  <text x="486" y="144" font-size="11" fill="#c92a2a" font-weight="700">旧</text>
  <g font-size="9.5" text-anchor="middle" fill="#c92a2a">
    <circle cx="524" cy="140" r="10" fill="#fff5f5" stroke="#fa5252"/><text x="524" y="144">s0</text>
    <circle cx="574" cy="140" r="10" fill="#fff5f5" stroke="#fa5252"/><text x="574" y="144">s1</text>
    <circle cx="624" cy="140" r="10" fill="#fff5f5" stroke="#fa5252"/><text x="624" y="144">s2</text>
    <circle cx="724" cy="140" r="10" fill="#fff5f5" stroke="#fa5252"/><text x="724" y="144">s15</text>
  </g>
  <path d="M534 140 L560 140" stroke="#868e96" stroke-width="1.6" marker-end="url(#ar)"/>
  <path d="M584 140 L610 140" stroke="#868e96" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="674" y="144" text-anchor="middle" font-size="11" fill="#868e96">· · ·</text>
  <text x="746" y="144" font-size="10" fill="#c92a2a">每轮迭代走一跳</text>
  <text x="746" y="158" font-size="10" fill="#c92a2a">固定等 pp_size 轮</text>
  <text x="486" y="196" font-size="11" fill="#0b7285" font-weight="700">新</text>
  <circle cx="560" cy="210" r="13" fill="#e6fcf5" stroke="#0ca678"/>
  <text x="560" y="214" text-anchor="middle" font-size="9.5" fill="#0b7285">PP0</text>
  <g font-size="9" text-anchor="middle" fill="#0b7285">
    <circle cx="640" cy="184" r="9" fill="#ffffff" stroke="#0ca678"/><text x="640" y="187">s1</text>
    <circle cx="660" cy="210" r="9" fill="#ffffff" stroke="#0ca678"/><text x="660" y="213">s2</text>
    <circle cx="640" cy="236" r="9" fill="#ffffff" stroke="#0ca678"/><text x="640" y="239">s15</text>
  </g>
  <g stroke="#0ca678" stroke-width="1.4" fill="none">
    <path d="M631 186 L575 205" marker-end="url(#ar)"/>
    <path d="M651 210 L577 210" marker-end="url(#ar)"/>
    <path d="M631 234 L575 215" marker-end="url(#ar)"/>
  </g>
  <text x="690" y="200" font-size="10.5" fill="#0b7285">各 stage 经 ZMQ 旁路</text>
  <text x="690" y="216" font-size="10.5" fill="#0b7285">直接报 PP_READY，</text>
  <text x="690" y="232" font-size="10.5" fill="#0b7285">PP0 收齐 16 份即放行</text>
  <text x="486" y="262" font-size="10.5" fill="#868e96">串行 16 跳 → 一次并行报到；启动时集体校验两侧开关一致</text>
  <!-- panel 3: target-parallel transfer -->
  <rect x="20" y="288" width="430" height="200" rx="10" fill="#f8f9fa" stroke="#e9ecef"/>
  <text x="36" y="312" font-size="13.5" font-weight="700" fill="#212529">③ 按目标并行发送（luno-4976）</text>
  <text x="36" y="330" font-size="11" fill="#868e96">一个请求要发给 DCP 组的 8 个 decode rank</text>
  <text x="36" y="356" font-size="11" fill="#c92a2a" font-weight="700">旧</text>
  <g font-size="9.5" text-anchor="middle">
    <rect x="60" y="344" width="34" height="20" rx="4" fill="#ffffff" stroke="#adb5bd"/><text x="77" y="358" fill="#495057">R1</text>
    <rect x="98" y="344" width="34" height="20" rx="4" fill="#ffffff" stroke="#adb5bd"/><text x="115" y="358" fill="#495057">R2</text>
    <rect x="136" y="344" width="34" height="20" rx="4" fill="#ffffff" stroke="#adb5bd"/><text x="153" y="358" fill="#495057">R3</text>
    <rect x="214" y="342" width="70" height="24" rx="4" fill="#fff5f5" stroke="#fa5252"/><text x="249" y="358" fill="#c92a2a">1 个线程</text>
  </g>
  <path d="M172 354 L210 354" stroke="#868e96" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="292" y="352" font-size="10" fill="#c92a2a">key = 目标端口之和</text>
  <text x="292" y="366" font-size="10" fill="#c92a2a">集群固定 → 恒定</text>
  <text x="36" y="404" font-size="11" fill="#0b7285" font-weight="700">新</text>
  <g font-size="9.5" text-anchor="middle" fill="#0b7285">
    <rect x="60" y="392" width="72" height="20" rx="4" fill="#ffffff" stroke="#0ca678"/><text x="96" y="406">R1 → d0…d7</text>
    <rect x="214" y="380" width="56" height="18" rx="4" fill="#e6fcf5" stroke="#0ca678"/><text x="242" y="393">worker 0</text>
    <rect x="214" y="402" width="56" height="18" rx="4" fill="#e6fcf5" stroke="#0ca678"/><text x="242" y="415">worker 1</text>
    <rect x="214" y="424" width="56" height="18" rx="4" fill="#e6fcf5" stroke="#0ca678"/><text x="242" y="437">worker n</text>
  </g>
  <g stroke="#0ca678" stroke-width="1.3" fill="none">
    <path d="M134 400 L210 390" marker-end="url(#ar)"/>
    <path d="M134 402 L210 410" marker-end="url(#ar)"/>
    <path d="M134 404 L210 430" marker-end="url(#ar)"/>
  </g>
  <text x="280" y="402" font-size="10" fill="#0b7285">每个目标一个任务</text>
  <text x="280" y="416" font-size="10" fill="#0b7285">按 hash(room) 分线程</text>
  <text x="36" y="460" font-size="11" fill="#495057">8 个目标的发送真正并行；一个 room 的全部目标完成才算</text>
  <text x="36" y="476" font-size="11" fill="#495057">完成，任一目标失败就广播给整个 room</text>

  <!-- panel 4: eager bank -->
  <rect x="470" y="288" width="430" height="200" rx="10" fill="#f8f9fa" stroke="#e9ecef"/>
  <text x="486" y="312" font-size="13.5" font-weight="700" fill="#212529">④ eager bank（luno-4974，s7 → s8）</text>
  <text x="486" y="330" font-size="11" fill="#868e96">s7（层 43~47）不写 bank 行，4 行 bank 纯透传，占跨机流量 80%</text>
  <text x="486" y="356" font-size="11" fill="#c92a2a" font-weight="700">旧</text>
  <rect x="510" y="342" width="130" height="22" rx="4" fill="#edf2ff" stroke="#4c6ef5"/>
  <text x="575" y="357" text-anchor="middle" font-size="10" fill="#3b5bdb">forward（层 43~47）</text>
  <rect x="640" y="342" width="200" height="22" rx="4" fill="#fff5f5" stroke="#fa5252"/>
  <text x="740" y="357" text-anchor="middle" font-size="10" fill="#c92a2a">发 hidden + 整个 bank（无可重叠）</text>
  <text x="486" y="398" font-size="11" fill="#0b7285" font-weight="700">新</text>
  <rect x="510" y="384" width="130" height="22" rx="4" fill="#edf2ff" stroke="#4c6ef5"/>
  <text x="575" y="399" text-anchor="middle" font-size="10" fill="#3b5bdb">forward（层 43~47）</text>
  <rect x="510" y="408" width="150" height="18" rx="4" fill="#fff4e6" stroke="#f08c00"/>
  <text x="585" y="421" text-anchor="middle" font-size="9.5" fill="#e8590c">pp_bank：继承的行，收到即发</text>
  <rect x="640" y="384" width="80" height="22" rx="4" fill="#e6fcf5" stroke="#0ca678"/>
  <text x="680" y="399" text-anchor="middle" font-size="10" fill="#0b7285">hidden + 新行</text>
  <text x="730" y="399" font-size="10" fill="#0b7285">接收端在侧流上提前一轮预取</text>
  <text x="486" y="452" font-size="11" fill="#495057">boundary stall 33.2 / 30.5 ms → 11.2 / 9.8 ms；吞吐</text>
  <text x="486" y="468" font-size="11" fill="#495057">61623 → 63882 tok/s（+3.7%），字节完全相同，bit-exact</text>
  <text x="486" y="482" font-size="10" fill="#868e96">2 机 PP16，varlen prefill，平均输入 76K，200 请求，各跑两次</text>

  <rect x="20" y="502" width="880" height="44" rx="10" fill="#f8f9fa" stroke="#e9ecef"/>
  <text x="36" y="522" font-size="12" fill="#495057">关键点：PP16 把一个请求拆成 16 段，任何“绕环一圈再继续”的协议都要付 16 倍的延迟。四项改动的共同做法是：</text>
  <text x="36" y="538" font-size="12" fill="#495057">数据已经是终值就立刻发，确认改成向中心并行报到，发送按目标拆开，大块透传数据不跟着计算排队。</text>
</svg>
