<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 572" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="572" rx="12" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#212529">每个部件都有自己的地址，靠 PCIe 总线地址互通</text>
  <text x="450" y="56" text-anchor="middle" font-size="13" fill="#868e96">发起者把自己的地址翻成总线地址；Switch / RC 按总线地址路由；目标再翻成自己的物理地址</text>

  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#868e96"/></marker>
    <marker id="ara" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#f08c00"/></marker>
    <marker id="arb" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#4c6ef5"/></marker>
    <marker id="art" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#0ca678"/></marker>
  </defs>

  <!-- column headers -->
  <g font-size="12" font-weight="700" fill="#868e96">
    <text x="40" y="94">发起者与它的地址</text>
    <text x="230" y="94">发起者侧翻译</text>
    <text x="478" y="94">PCIe 总线地址空间</text>
    <text x="670" y="94">目标侧翻译</text>
  </g>

  <!-- initiators -->
  <rect x="40" y="110" width="170" height="56" rx="8" fill="#f1f3f5" stroke="#adb5bd"/>
  <text x="54" y="133" font-size="12.5" font-weight="700" fill="#495057">CPU 进程</text>
  <text x="54" y="152" font-size="11" fill="#868e96">虚拟地址</text>
  <rect x="40" y="184" width="170" height="56" rx="8" fill="#fff4e6" stroke="#f08c00"/>
  <text x="54" y="207" font-size="12.5" font-weight="700" fill="#e8590c">RDMA 网卡</text>
  <text x="54" y="226" font-size="11" fill="#868e96">MR 地址 + rkey</text>
  <rect x="40" y="258" width="170" height="56" rx="8" fill="#edf2ff" stroke="#4c6ef5"/>
  <text x="54" y="281" font-size="12.5" font-weight="700" fill="#3b5bdb">GPU（SM / CE）</text>
  <text x="54" y="300" font-size="11" fill="#868e96">GPU 虚拟地址（UVA）</text>
  <rect x="40" y="332" width="170" height="56" rx="8" fill="#e6fcf5" stroke="#0ca678"/>
  <text x="54" y="355" font-size="12.5" font-weight="700" fill="#0b7285">NVMe 控制器</text>
  <text x="54" y="374" font-size="11" fill="#868e96">命令里的 PRP 地址</text>

  <!-- initiator-side translators -->
  <g fill="#f3f0ff" stroke="#7048e8">
    <rect x="230" y="110" width="150" height="56" rx="8"/>
    <rect x="230" y="184" width="150" height="56" rx="8"/>
    <rect x="230" y="258" width="150" height="56" rx="8"/>
    <rect x="230" y="332" width="150" height="56" rx="8" fill="#f8f9fa" stroke="#adb5bd" stroke-dasharray="4 3"/>
  </g>
  <g font-size="12.5" font-weight="700" fill="#5f3dc4">
    <text x="244" y="133">CPU MMU 页表</text>
    <text x="244" y="207">网卡翻译表</text>
    <text x="244" y="281">GPU MMU 页表</text>
    <text x="244" y="355" fill="#495057">不翻译</text>
  </g>
  <g font-size="11" fill="#868e96">
    <text x="244" y="152">本地 DRAM 不上 PCIe</text>
    <text x="244" y="226">ibv_reg_mr 时建立</text>
    <text x="244" y="300">锁页时驱动写入</text>
    <text x="244" y="374">PRP 直接填 IOVA</text>
  </g>
  <g stroke="#adb5bd" stroke-width="2">
    <path d="M210 138 L230 138"/><path d="M210 212 L230 212"/><path d="M210 286 L230 286"/><path d="M210 360 L230 360"/>
  </g>
  <!-- bus address space -->
  <rect x="470" y="104" width="166" height="292" rx="10" fill="#f8f9fa" stroke="#adb5bd"/>
  <rect x="478" y="112" width="150" height="58" rx="8" fill="#f1f3f5" stroke="#868e96"/>
  <text x="490" y="132" font-size="12.5" font-weight="700" fill="#495057">寄存器 / 门铃</text>
  <text x="490" y="149" font-size="10.5" fill="#868e96">GPU BAR0 · 网卡 UAR</text>
  <text x="490" y="163" font-size="10.5" fill="#868e96">NVMe BAR0</text>
  <rect x="478" y="180" width="150" height="70" rx="8" fill="#edf2ff" stroke="#4c6ef5"/>
  <text x="490" y="206" font-size="12.5" font-weight="700" fill="#3b5bdb">GPU BAR1</text>
  <text x="490" y="225" font-size="11" fill="#868e96">显存窗口</text>
  <rect x="478" y="260" width="150" height="128" rx="8" fill="#e6fcf5" stroke="#0ca678"/>
  <text x="490" y="286" font-size="12.5" font-weight="700" fill="#0b7285">Host DRAM</text>
  <text x="490" y="305" font-size="11" fill="#868e96">设备看到的是 IOVA</text>

  <!-- initiator -> bus -->
  <path d="M382 138 L474 140" stroke="#868e96" stroke-width="2" marker-end="url(#ar)"/>
  <text x="428" y="131" text-anchor="middle" font-size="11" fill="#495057">MMIO</text>
  <path d="M382 206 L474 210" stroke="#f08c00" stroke-width="2.5" marker-end="url(#ara)"/>
  <text x="428" y="199" text-anchor="middle" font-size="11" font-weight="700" fill="#e8590c">显存 MR</text>
  <path d="M382 222 C 425 222, 430 272, 474 272" fill="none" stroke="#f08c00" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#ara)"/>
  <path d="M382 290 L474 318" stroke="#4c6ef5" stroke-width="2" marker-end="url(#arb)"/>
  <path d="M382 360 L474 360" stroke="#0ca678" stroke-width="2" marker-end="url(#art)"/>
  <text x="428" y="353" text-anchor="middle" font-size="11" fill="#0b7285">DMA 目标</text>

  <!-- target-side translation -->
  <rect x="670" y="112" width="190" height="58" rx="8" fill="#f1f3f5" stroke="#adb5bd"/>
  <text x="684" y="132" font-size="12.5" font-weight="700" fill="#495057">设备寄存器</text>
  <text x="684" y="149" font-size="11" fill="#868e96">一次 store 变成 PCIe 写，</text>
  <text x="684" y="163" font-size="11" fill="#868e96">设备开始取描述符</text>
  <rect x="670" y="180" width="190" height="70" rx="8" fill="#edf2ff" stroke="#4c6ef5"/>
  <text x="684" y="201" font-size="12.5" font-weight="700" fill="#3b5bdb">BAR1 页表 → HBM 页</text>
  <text x="684" y="220" font-size="11" fill="#868e96">显存要先映射进窗口，</text>
  <text x="684" y="236" font-size="11" fill="#868e96">窗口大小限制可暴露的量</text>
  <rect x="670" y="260" width="190" height="128" rx="8" fill="#e6fcf5" stroke="#0ca678"/>
  <text x="684" y="283" font-size="12.5" font-weight="700" fill="#0b7285">IOMMU → DRAM 物理页</text>
  <text x="684" y="304" font-size="11" fill="#495057">只放行驱动为该设备</text>
  <text x="684" y="320" font-size="11" fill="#495057">建立过映射的页</text>
  <text x="684" y="344" font-size="11" fill="#868e96">Passthrough / Identity</text>
  <text x="684" y="360" font-size="11" fill="#868e96">模式下 IOVA = 物理地址</text>
  <g stroke="#868e96" stroke-width="2">
    <path d="M638 141 L666 141" marker-end="url(#ar)"/><path d="M638 215 L666 215" marker-end="url(#ar)"/><path d="M638 324 L666 324" marker-end="url(#ar)"/>
  </g>

  <!-- registration = two mappings -->
  <text x="40" y="424" font-size="13" font-weight="700" fill="#212529">“锁页”“注册”做的事：在发起者和目标两侧各建好一条映射</text>
  <g font-size="11.5">
    <rect x="40" y="436" width="266" height="52" rx="8" fill="#edf2ff" stroke="#4c6ef5"/>
    <text x="54" y="457" font-weight="700" fill="#3b5bdb">cudaHostRegister</text>
    <text x="54" y="477" fill="#495057">GPU 页表 + IOMMU</text>
    <rect x="317" y="436" width="266" height="52" rx="8" fill="#fff4e6" stroke="#f08c00"/>
    <text x="331" y="457" font-weight="700" fill="#e8590c">ibv_reg_mr（Host 内存）</text>
    <text x="331" y="477" fill="#495057">网卡翻译表 + IOMMU（虚线）</text>
    <rect x="594" y="436" width="266" height="52" rx="8" fill="#fff4e6" stroke="#f08c00"/>
    <text x="608" y="457" font-weight="700" fill="#e8590c">GPUDirect RDMA（显存 MR）</text>
    <text x="608" y="477" fill="#495057">网卡翻译表 + GPU BAR1 页表</text>
  </g>

  <!-- note -->
  <rect x="40" y="502" width="820" height="54" rx="10" fill="#f8f9fa" stroke="#e9ecef"/>
  <text x="56" y="524" font-size="12" fill="#495057">“A 能直接访问 B 的内存”= A 侧有一条映射指到某段总线地址，B 在这段地址上应答并翻译到自己的物理页。</text>
  <text x="56" y="544" font-size="11.5" fill="#868e96">CPU 访问本地 DRAM 只经过自己的 MMU，不上 PCIe；它访问设备 BAR 才是 MMIO。</text>
</svg>
