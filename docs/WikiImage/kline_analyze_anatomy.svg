<path d="M600 174.2 l8 -5 l0 10 z" fill="#f08c00" stroke="#f08c00" stroke-width="1" stroke-linejoin="round"/>
<text x="585.0" y="352.0" font-size="12" fill="#e8590c" font-weight="700" font-family="monospace" text-anchor="middle">90%</text>
<text x="585.0" y="372.0" font-size="12" fill="#212529" font-weight="700" text-anchor="middle">锤子线</text>
<text x="585.0" y="390.0" font-size="11" fill="#868e96" text-anchor="middle">低位被承接</text>
<line x1="665.0" y1="159.0" x2="665.0" y2="233.1" stroke="#fa5252" stroke-width="1.5"/>
<line x1="665.0" y1="235.0" x2="665.0" y2="311.0" stroke="#fa5252" stroke-width="1.5"/>
<rect x="654.0" y="233.1" width="22.0" height="1.9" rx="1" fill="#fff5f5" stroke="#fa5252" stroke-width="1.5"/>
<path d="M680 233.1 l8 -5 l0 10 z" fill="#f08c00" stroke="#f08c00" stroke-width="1" stroke-linejoin="round"/>
<text x="665.0" y="352.0" font-size="12" fill="#e8590c" font-weight="700" font-family="monospace" text-anchor="middle">51%</text>
<text x="665.0" y="372.0" font-size="12" fill="#212529" font-weight="700" text-anchor="middle">十字星</text>
<text x="665.0" y="390.0" font-size="11" fill="#868e96" text-anchor="middle">多空平衡</text>
<line x1="745.0" y1="159.0" x2="745.0" y2="295.8" stroke="#0ca678" stroke-width="1.5"/>
<line x1="745.0" y1="301.5" x2="745.0" y2="311.0" stroke="#0ca678" stroke-width="1.5"/>
