<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<defs><marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#868e96"/></marker><marker id="ar-amber" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#f08c00"/></marker></defs>
<rect x="0" y="0" width="900" height="500" rx="12" fill="#ffffff"/>
<text x="30.0" y="34.0" font-size="20" fill="#212529" font-weight="700" text-anchor="start">一根 K 线 = 一个周期内多空博弈的记录</text>
<text x="30.0" y="56.0" font-size="13" fill="#868e96" text-anchor="start">实体是市场最终接受的价格区间，影线是盘中被试探、随后被拒绝的价格</text>
<rect x="30.0" y="78.0" width="410.0" height="330.0" rx="10" fill="#f8f9fa" stroke="#e9ecef" stroke-width="1.0"/>
