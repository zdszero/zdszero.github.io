<text x="190.0" y="330.8" font-size="11" fill="#868e96" text-anchor="start">低价被买方拒绝</text>
<text x="150.0" y="396.0" font-size="12.5" fill="#fa5252" font-weight="700" text-anchor="middle">阳线：收 &gt; 开</text>
