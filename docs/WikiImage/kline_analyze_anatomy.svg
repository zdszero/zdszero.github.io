<path d="M760 301.5 l8 -5 l0 10 z" fill="#f08c00" stroke="#f08c00" stroke-width="1" stroke-linejoin="round"/>
<text x="745.0" y="352.0" font-size="12" fill="#e8590c" font-weight="700" font-family="monospace" text-anchor="middle">6%</text>
<text x="745.0" y="372.0" font-size="12" fill="#212529" font-weight="700" text-anchor="middle">长上影</text>
<text x="745.0" y="390.0" font-size="11" fill="#868e96" text-anchor="middle">高位被抛压</text>
<line x1="825.0" y1="159.0" x2="825.0" y2="168.5" stroke="#0ca678" stroke-width="1.5"/>
<line x1="825.0" y1="303.4" x2="825.0" y2="311.0" stroke="#0ca678" stroke-width="1.5"/>
