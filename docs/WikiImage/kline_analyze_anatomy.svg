<text x="108.0" y="292.0" font-size="11.5" fill="#495057" text-anchor="end">开盘价</text>
<line x1="112.0" y1="343.2" x2="128.0" y2="343.2" stroke="#868e96" stroke-width="1" stroke-dasharray="2 2"/>
<text x="108.0" y="347.2" font-size="11.5" fill="#495057" text-anchor="end">最低价</text>
<path d="M176 151.2 L182 151.2 L182 196.8 L176 196.8" fill="none" stroke="#e8590c" stroke-width="1.5" stroke-linejoin="round"/>
<text x="190.0" y="172.0" font-size="12" fill="#e8590c" font-weight="700" text-anchor="start">上影线</text>
<text x="190.0" y="188.0" font-size="11" fill="#868e96" text-anchor="start">高价被卖方拒绝</text>
<path d="M176 201.6 L182 201.6 L182 285.6 L176 285.6" fill="none" stroke="#3b5bdb" stroke-width="1.5" stroke-linejoin="round"/>
<text x="190.0" y="241.6" font-size="12" fill="#3b5bdb" font-weight="700" text-anchor="start">实体</text>
<text x="190.0" y="257.6" font-size="11" fill="#868e96" text-anchor="start">多空最终认可的区间</text>
<path d="M176 290.4 L182 290.4 L182 343.2 L176 343.2" fill="none" stroke="#e8590c" stroke-width="1.5" stroke-linejoin="round"/>
