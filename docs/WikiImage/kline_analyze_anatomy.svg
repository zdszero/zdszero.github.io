<path d="M840 303.4 l8 -5 l0 10 z" fill="#f08c00" stroke="#f08c00" stroke-width="1" stroke-linejoin="round"/>
<text x="825.0" y="352.0" font-size="12" fill="#e8590c" font-weight="700" font-family="monospace" text-anchor="middle">5%</text>
<text x="825.0" y="372.0" font-size="12" fill="#212529" font-weight="700" text-anchor="middle">大阴线</text>
<text x="825.0" y="390.0" font-size="11" fill="#868e96" text-anchor="middle">卖方全程主导</text>
<text x="480.0" y="126.0" font-size="11" fill="#868e96" text-anchor="start">▶ = 收盘价；数字 = (收 − 低) ÷ (高 − 低)</text>
<rect x="30.0" y="424.0" width="840.0" height="58.0" rx="8" fill="#f8f9fa" stroke="#e9ecef" stroke-width="1.0"/>
<text x="46.0" y="446.0" font-size="12" fill="#495057" text-anchor="start">先看两件事：实体有多长（共识有多强），收盘落在区间的哪里（这一周期最终谁赢）。</text>
<text x="46.0" y="465.0" font-size="12" fill="#495057" text-anchor="start">影线越长，说明那一侧在盘中推过去的价格被反击得越彻底。颜色沿用 A 股习惯：红涨绿跌。</text>
</svg>
