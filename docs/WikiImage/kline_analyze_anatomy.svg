<line x1="150.0" y1="151.2" x2="150.0" y2="199.2" stroke="#fa5252" stroke-width="1.5"/>
<line x1="150.0" y1="288.0" x2="150.0" y2="343.2" stroke="#fa5252" stroke-width="1.5"/>
