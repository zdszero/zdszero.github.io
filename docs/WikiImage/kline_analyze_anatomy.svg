<line x1="377.0" y1="343.2" x2="386.0" y2="343.2" stroke="#868e96" stroke-width="1" stroke-dasharray="2 2"/>
<text x="389.0" y="347.2" font-size="11.5" fill="#495057" text-anchor="start">最低价</text>
<text x="355.0" y="396.0" font-size="12.5" fill="#0ca678" font-weight="700" text-anchor="middle">阴线：收 &lt; 开</text>
<rect x="460.0" y="78.0" width="410.0" height="330.0" rx="10" fill="#f8f9fa" stroke="#e9ecef" stroke-width="1.0"/>
<text x="480.0" y="104.0" font-size="13.5" fill="#212529" font-weight="700" text-anchor="start">读法：同样的高低区间，收盘落在哪里</text>
<line x1="505.0" y1="159.0" x2="505.0" y2="166.6" stroke="#fa5252" stroke-width="1.5"/>
