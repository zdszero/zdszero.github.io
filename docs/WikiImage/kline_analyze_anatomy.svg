<text x="505.0" y="372.0" font-size="12" fill="#212529" font-weight="700" text-anchor="middle">大阳线</text>
<text x="505.0" y="390.0" font-size="11" fill="#868e96" text-anchor="middle">买方全程主导</text>
<line x1="585.0" y1="159.0" x2="585.0" y2="174.2" stroke="#fa5252" stroke-width="1.5"/>
