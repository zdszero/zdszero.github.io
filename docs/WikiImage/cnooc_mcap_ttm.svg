<text x="48.0" y="728.0" font-size="12" fill="#495057" text-anchor="start">2022-12 → 2024-06：TTM 利润只增 4%，市值增至 2.4 倍；2025-04 → 2026-03：TTM 利润降 11%，市值增至 1.86 倍。两次上涨都主要来自 PE。</text>
<text x="48.0" y="746.0" font-size="12" fill="#495057" text-anchor="start">2026-03 以后油价两次冲到 110 美元以上，月末市值没有回到 4 月末的 12,230 亿元（日度高点为 03-23 的 12,773 亿元）。</text>
<text x="48.0" y="764.0" font-size="12" fill="#495057" text-anchor="start">来源：东方财富 H 股（116.00883）与布伦特（112.B00Y）日 K、港元兑人民币中间价（120.HKDCNYC），财报来自 F10 与公司公告。月均布伦特为</text>
