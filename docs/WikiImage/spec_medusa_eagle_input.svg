<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="920" height="500" rx="12" fill="#ffffff"/>
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#868e96"/>
    </marker>
  </defs>
  <text x="460" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#212529">Medusa 与 EAGLE：都读 target 末层特征，差在要不要看「刚采出的 token」</text>
  <text x="460" y="56" text-anchor="middle" font-size="13" fill="#868e96">前缀「I」之后，下一个 token 可能是 am 也可能是 always；f = target 末层特征（lm_head 之前）</text>

  <!-- panel A: Medusa -->
  <rect x="24" y="74" width="428" height="290" rx="10" fill="#f8f9fa" stroke="#e9ecef"/>
  <text x="40" y="98" font-size="14" font-weight="700" fill="#e8590c">Medusa：k 个独立的头</text>
  <rect x="60" y="190" width="70" height="40" rx="8" fill="#fff4e6" stroke="#f08c00"/>
  <text x="95" y="215" text-anchor="middle" font-size="12" fill="#e8590c">f_I</text>
  <g font-size="11" text-anchor="middle">
    <rect x="190" y="118" width="110" height="30" rx="6" fill="#fff4e6" stroke="#f08c00"/><text x="245" y="137" fill="#e8590c">head 1 → t+1</text>
    <rect x="190" y="166" width="110" height="30" rx="6" fill="#fff4e6" stroke="#f08c00"/><text x="245" y="185" fill="#e8590c">head 2 → t+2</text>
    <rect x="190" y="214" width="110" height="30" rx="6" fill="#fff4e6" stroke="#f08c00"/><text x="245" y="233" fill="#e8590c">head 3 → t+3</text>
    <text x="245" y="270" fill="#868e96">…</text>
  </g>
  <path d="M130 205 L186 133" stroke="#868e96" stroke-width="1.5" marker-end="url(#ar)"/>
  <path d="M130 210 L186 181" stroke="#868e96" stroke-width="1.5" marker-end="url(#ar)"/>
  <path d="M130 215 L186 229" stroke="#868e96" stroke-width="1.5" marker-end="url(#ar)"/>
  <g font-size="11" fill="#495057">
    <text x="312" y="137">am / always</text>
    <text x="312" y="185">a / going …</text>
    <text x="312" y="233">？</text>
  </g>
  <text x="40" y="300" font-size="11.5" fill="#495057">每个头是 1 层 FFN + 残差：softmax(W2(SiLU(W1·f) + f))。</text>
  <text x="40" y="320" font-size="11.5" fill="#495057">head 2 不知道 head 1 最后采了 am 还是 always，</text>
  <text x="40" y="340" font-size="11.5" fill="#495057">只能给出两种续写的「平均」，越往后越不准。</text>
  <!-- panel B: EAGLE -->
  <rect x="468" y="74" width="428" height="290" rx="10" fill="#f8f9fa" stroke="#e9ecef"/>
  <text x="484" y="98" font-size="14" font-weight="700" fill="#3b5bdb">EAGLE：特征 + 前移一位的 token，逐步自回归</text>
  <g font-size="11" text-anchor="middle">
    <rect x="490" y="120" width="56" height="30" rx="6" fill="#fff4e6" stroke="#f08c00"/><text x="518" y="139" fill="#e8590c">f_I</text>
    <rect x="490" y="156" width="56" height="30" rx="6" fill="#f1f3f5" stroke="#adb5bd"/><text x="518" y="175" fill="#495057">e(am)</text>
    <rect x="576" y="136" width="96" height="34" rx="6" fill="#edf2ff" stroke="#4c6ef5"/><text x="624" y="152" fill="#3b5bdb">fc + 1 层</text><text x="624" y="165" fill="#3b5bdb">decoder</text>
    <rect x="700" y="136" width="56" height="34" rx="6" fill="#fff4e6" stroke="#f08c00"/><text x="728" y="157" fill="#e8590c">f̂_am</text>
    <rect x="790" y="136" width="80" height="34" rx="6" fill="#f1f3f5" stroke="#adb5bd"/><text x="830" y="157" fill="#495057">lm_head → a</text>

    <rect x="490" y="220" width="56" height="30" rx="6" fill="#fff4e6" stroke="#f08c00"/><text x="518" y="239" fill="#e8590c">f̂_am</text>
    <rect x="490" y="256" width="56" height="30" rx="6" fill="#f1f3f5" stroke="#adb5bd"/><text x="518" y="275" fill="#495057">e(a)</text>
    <rect x="576" y="236" width="96" height="34" rx="6" fill="#edf2ff" stroke="#4c6ef5"/><text x="624" y="252" fill="#3b5bdb">同一个</text><text x="624" y="265" fill="#3b5bdb">draft 层</text>
    <rect x="700" y="236" width="56" height="34" rx="6" fill="#fff4e6" stroke="#f08c00"/><text x="728" y="257" fill="#e8590c">f̂_a</text>
    <rect x="790" y="236" width="80" height="34" rx="6" fill="#f1f3f5" stroke="#adb5bd"/><text x="830" y="257" fill="#495057">→ 下一个</text>
  </g>
  <path d="M546 135 L572 148" stroke="#868e96" stroke-width="1.5" marker-end="url(#ar)"/>
  <path d="M546 171 L572 158" stroke="#868e96" stroke-width="1.5" marker-end="url(#ar)"/>
  <path d="M672 153 L696 153" stroke="#868e96" stroke-width="1.5" marker-end="url(#ar)"/>
  <path d="M756 153 L786 153" stroke="#868e96" stroke-width="1.5" marker-end="url(#ar)"/>
  <path d="M546 235 L572 248" stroke="#868e96" stroke-width="1.5" marker-end="url(#ar)"/>
  <path d="M546 271 L572 258" stroke="#868e96" stroke-width="1.5" marker-end="url(#ar)"/>
  <path d="M672 253 L696 253" stroke="#868e96" stroke-width="1.5" marker-end="url(#ar)"/>
  <path d="M756 253 L786 253" stroke="#868e96" stroke-width="1.5" marker-end="url(#ar)"/>
  <path d="M728 170 C 728 200, 518 190, 518 216" stroke="#f08c00" stroke-width="1.3" fill="none" stroke-dasharray="4 3" marker-end="url(#ar)"/>
  <path d="M830 170 C 830 210, 562 200, 560 236 L 552 262" stroke="#868e96" stroke-width="1.3" fill="none" stroke-dasharray="4 3" marker-end="url(#ar)"/>
  <text x="484" y="310" font-size="11.5" fill="#495057">输入里带上「刚采出的 token」，就消除了采样带来的</text>
  <text x="484" y="330" font-size="11.5" fill="#495057">分叉：预测的是 am 之后的特征，而不是两种的平均。</text>
  <text x="484" y="350" font-size="10.5" fill="#868e96">embedding、lm_head 借 target（灰色），draft 自己只有 fc + 1 层</text>

  <rect x="24" y="380" width="872" height="100" rx="8" fill="#f8f9fa" stroke="#e9ecef"/>
  <text x="44" y="404" font-size="12" font-weight="700" fill="#212529">论文里的消融（Vicuna 7B，EAGLE 论文）</text>
  <text x="44" y="426" font-size="12" fill="#495057">· 只用 token 做 draft 输入：1.5×；改成特征：1.9×；特征 + 前移一位的 token：2.8×。</text>
  <text x="44" y="446" font-size="12" fill="#495057">· Medusa 的 draft 准确率约 0.6，EAGLE 约 0.8；MT-bench 上 EAGLE 比 Medusa 快 1.47～1.60×。</text>
  <text x="44" y="466" font-size="12" fill="#495057">· Medusa 的 typical acceptance 在非 greedy 时不保分布；EAGLE 沿用标准投机采样，严格无损。</text>
</svg>
