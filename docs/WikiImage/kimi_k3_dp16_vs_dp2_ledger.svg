<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 456" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="920" height="456" rx="12" fill="#ffffff"/>
  <text x="460" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#212529">一张卡每步要碰的数据：状态守恒，权重不守恒</text>
  <text x="460" y="56" text-anchor="middle" font-size="13" fill="#868e96">实例 256 个请求、16 张卡、100k 上下文；灰框是整个实例，着色部分是一张卡每步读写的那一份</text>

  <!-- column headers -->
  <rect x="170" y="70" width="192" height="26" rx="6" fill="#495057"/>
  <text x="266" y="88" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">KDA state · 守恒</text>
  <rect x="420" y="70" width="192" height="26" rx="6" fill="#495057"/>
  <text x="516" y="88" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">MLA latent KV · 守恒</text>
  <rect x="670" y="70" width="192" height="26" rx="6" fill="#f08c00"/>
  <text x="766" y="88" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">非专家权重 · 不守恒</text>
  <g font-size="10.5" fill="#868e96" text-anchor="middle">
    <text x="266" y="110">横：96 head　纵：256 请求</text>
    <text x="516" y="110">横：100k token　纵：256 请求</text>
    <text x="766" y="110">左：attention 投影　右：MoE 段</text>
  </g>

  <!-- row labels -->
  <text x="24" y="160" font-size="14" font-weight="700" fill="#0b7285">A · DP16</text>
  <text x="24" y="178" font-size="11" fill="#868e96">每卡独占 16 个请求</text>
  <text x="24" y="308" font-size="14" font-weight="700" fill="#5f3dc4">B · DP2 × DCP8</text>
  <text x="24" y="326" font-size="11" fill="#868e96">8 卡共享 128 个请求</text>

  <!-- instance frames -->
  <g fill="#f8f9fa" stroke="#dee2e6">
    <rect x="170" y="116" width="192" height="96" rx="4"/>
    <rect x="420" y="116" width="192" height="96" rx="4"/>
    <rect x="170" y="264" width="192" height="96" rx="4"/>
    <rect x="420" y="264" width="192" height="96" rx="4"/>
  </g>

  <!-- KDA: DP16 = 16 req x 96 head, DP2 = 128 req x 12 head (same area) -->
  <rect x="170" y="116" width="192" height="6" fill="#0ca678"/>
  <text x="266" y="172" text-anchor="middle" font-size="11" fill="#868e96">本卡：16 行 × 全部 96 列</text>
  <rect x="170" y="264" width="24" height="48" fill="#7048e8"/>
  <text x="280" y="296" text-anchor="middle" font-size="11" fill="#868e96">本卡：128 行 × 12 列</text>

  <!-- MLA: DP16 = 16 req x all token, DP2 = 128 req x every 8th token -->
  <rect x="420" y="116" width="192" height="6" fill="#0ca678"/>
  <text x="516" y="172" text-anchor="middle" font-size="11" fill="#868e96">本卡：16 行 × 全部 token</text>
  <g fill="#7048e8">
    <rect x="420" y="264" width="2" height="48"/><rect x="436" y="264" width="2" height="48"/>
    <rect x="452" y="264" width="2" height="48"/><rect x="468" y="264" width="2" height="48"/>
    <rect x="484" y="264" width="2" height="48"/><rect x="500" y="264" width="2" height="48"/>
    <rect x="516" y="264" width="2" height="48"/><rect x="532" y="264" width="2" height="48"/>
    <rect x="548" y="264" width="2" height="48"/><rect x="564" y="264" width="2" height="48"/>
    <rect x="580" y="264" width="2" height="48"/><rect x="596" y="264" width="2" height="48"/>
  </g>
  <text x="516" y="338" text-anchor="middle" font-size="11" fill="#868e96">本卡：128 行 × 每 8 个 token 取 1 个</text>

  <!-- weights: solid = resident 1/8 rows, dashed amber = AllGather each step -->
  <g fill="#fff9db" stroke="#f08c00" stroke-dasharray="4 3">
    <rect x="670" y="128" width="133" height="84"/>
    <rect x="803" y="128" width="59" height="84"/>
    <rect x="803" y="276" width="59" height="84"/>
  </g>
  <rect x="670" y="276" width="133" height="84" fill="#ffffff" stroke="#dee2e6" stroke-dasharray="4 3"/>
  <rect x="670" y="116" width="133" height="12" fill="#0ca678"/>
  <rect x="803" y="116" width="59" height="12" fill="#0ca678"/>
  <rect x="670" y="264" width="133" height="12" fill="#7048e8"/>
  <rect x="803" y="264" width="59" height="12" fill="#7048e8"/>
  <g font-size="11" text-anchor="middle">
    <text x="736" y="166" fill="#e8590c" font-weight="700">每步 AllGather 7/8</text>
    <text x="736" y="182" fill="#868e96">再完整读一遍</text>
    <text x="832" y="174" fill="#e8590c" font-weight="700">AG</text>
    <text x="736" y="318" fill="#868e96">按 head 切，不需要</text>
    <text x="832" y="322" fill="#e8590c" font-weight="700">AG</text>
  </g>

  <!-- captions -->
  <g font-size="11.5" text-anchor="middle" font-weight="700">
    <text x="266" y="232" fill="#0b7285">≈ 2 × 6.9 GB</text>
    <text x="516" y="232" fill="#0b7285">≈ 22.6 GB</text>
    <text x="766" y="232" fill="#0b7285">读 ≈ 55 GB，AG 写 48.4 GB</text>
    <text x="266" y="380" fill="#5f3dc4">≈ 2 × 6.9 GB</text>
    <text x="516" y="380" fill="#5f3dc4">≈ 22.6 GB</text>
    <text x="766" y="380" fill="#5f3dc4">读 ≈ 22 GB，AG 写 14.8 GB</text>
  </g>

  <!-- note strip -->
  <rect x="24" y="400" width="872" height="38" rx="8" fill="#f8f9fa"/>
  <text x="460" y="417" text-anchor="middle" font-size="11.5" fill="#495057">同一列里两种布局的着色面积相等：16 × 96 = 128 × 12，16 × 全部 token = 128 × 1/8 token。</text>
  <text x="460" y="432" text-anchor="middle" font-size="11.5" fill="#495057">权重列中实色是本卡常驻的 1/8 行，虚线框是每步 AllGather 回来的部分；路由专家（每卡约 85 GB）两边相同，未画出；权重这一列不随并发变化。</text>
</svg>
