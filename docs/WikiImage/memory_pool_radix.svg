<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="920" height="470" rx="12" fill="#ffffff"/>
  <text x="460" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#212529">RadixCache：以 Page 为粒度共享 Prefix</text>
  <text x="460" y="56" text-anchor="middle" font-size="13" fill="#868e96">TreeNode 保存 token 序列(key) 与对应 KV 索引(value)，lock_ref 保护在用节点不被淘汰</text>

  <!-- edges -->
  <g stroke="#ced4da" stroke-width="2" fill="none">
    <path d="M160 128 L300 160"/>
    <path d="M160 128 L300 330"/>
    <path d="M470 190 L620 150"/>
    <path d="M470 190 L620 250"/>
  </g>

  <!-- root -->
  <rect x="60" y="100" width="100" height="46" rx="8" fill="#f1f3f5" stroke="#adb5bd"/>
  <text x="110" y="128" text-anchor="middle" font-size="13" font-weight="700" fill="#495057">root</text>

  <!-- shared prefix node -->
  <rect x="300" y="150" width="170" height="78" rx="8" fill="#edf2ff" stroke="#4c6ef5"/>
  <text x="312" y="172" font-size="12.5" font-weight="700" fill="#3b5bdb">共享 prefix 节点</text>
  <text x="312" y="192" font-size="11.5" font-family="monospace" fill="#343a40">key = "系统提示…"</text>
  <text x="312" y="210" font-size="11.5" font-family="monospace" fill="#343a40">value = [12,13,40,41]</text>
  <rect x="312" y="214" width="78" height="0" />
  <circle cx="452" cy="166" r="13" fill="#4c6ef5"/>
  <text x="452" y="170" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">2</text>
  <text x="452" y="150" text-anchor="middle" font-size="9.5" fill="#3b5bdb">lock_ref</text>

  <!-- child A -->
  <rect x="620" y="118" width="230" height="64" rx="8" fill="#e6fcf5" stroke="#0ca678"/>
  <text x="632" y="140" font-size="12" font-weight="700" fill="#0b7285">Req A 分支</text>
  <text x="632" y="160" font-size="11.5" font-family="monospace" fill="#343a40">key="…介绍杭州"  value=[52,53]</text>
  <text x="632" y="176" font-size="10.5" fill="#868e96">lock_ref = 1（Req A 正在解码）</text>

  <!-- child B -->
  <rect x="620" y="218" width="230" height="64" rx="8" fill="#e6fcf5" stroke="#0ca678"/>
  <text x="632" y="240" font-size="12" font-weight="700" fill="#0b7285">Req B 分支</text>
  <text x="632" y="260" font-size="11.5" font-family="monospace" fill="#343a40">key="…写首诗"   value=[61]</text>
  <text x="632" y="276" font-size="10.5" fill="#868e96">lock_ref = 1（Req B 正在解码）</text>

  <!-- evictable node -->
  <rect x="300" y="320" width="300" height="70" rx="8" fill="#fff5f5" stroke="#fa5252" stroke-dasharray="5 3"/>
  <text x="312" y="342" font-size="12.5" font-weight="700" fill="#c92a2a">可淘汰节点（lock_ref = 0）</text>
  <text x="312" y="362" font-size="11.5" font-family="monospace" fill="#343a40">key="SELECT * …"  value=[7,8,9]</text>
  <text x="312" y="380" font-size="10.5" fill="#868e96">host_value 已备份到 CPU → evict() 按 LRU 释放设备 KV</text>

  <!-- legend / flow -->
  <rect x="60" y="410" width="790" height="46" rx="8" fill="#f8f9fa" stroke="#e9ecef"/>
  <text x="76" y="430" font-size="12" fill="#495057" font-weight="600">新请求到达：</text>
  <text x="160" y="430" font-size="12" fill="#495057">match_prefix() 找最长可复用前缀 → 复用其 value（零拷贝）→ 仅为剩余 token 调 allocator 分配新 KV</text>
  <text x="76" y="448" font-size="11.5" fill="#868e96">inc_lock_ref / dec_lock_ref 维护引用计数；lock_ref=0 且显存不足时，evict() 自底向上按 last_access_time 淘汰</text>
</svg>
