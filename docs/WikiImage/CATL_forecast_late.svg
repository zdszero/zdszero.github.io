<text x="48.0" y="524.0" font-size="12" fill="#495057" text-anchor="start">2024-01-31 预测 2024 年仅增 5% 至 463 亿元，实际 507 亿元；2026-05-06 顶部后股价到 10-20 已跌 44%，2026-10-21 三季报点评才把 2026、</text>
