<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 490" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="490" rx="12" fill="#ffffff"/>
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#868e96"/>
    </marker>
  </defs>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#212529">SGLang Kimi K3：snapshot bank 与一次聚合点</text>
  <text x="450" y="56" text-anchor="middle" font-size="13" fill="#868e96">冻结的块摘要放在 bank 里，当前块的部分和就是层间传递的 residual；每个读入点把两者聚合后交给子层</text>

  <!-- Left: bank -->
  <rect x="30" y="74" width="270" height="330" rx="10" fill="#f8f9fa" stroke="#0ca678"/>
  <rect x="30" y="74" width="270" height="28" rx="10" fill="#0ca678"/>
  <text x="44" y="93" font-size="14" font-weight="700" fill="#ffffff">bank：AttnResidual</text>
  <text x="48" y="124" font-family="monospace" font-size="11" fill="#0b7285">block_residual [T, NB, H]</text>
  <g font-family="monospace" font-size="12" text-anchor="start">
    <rect x="48" y="136" width="232" height="28" rx="6" fill="#f1f3f5" stroke="#adb5bd"/><text x="58" y="155" fill="#868e96">0</text><text x="82" y="155" fill="#495057" font-weight="700">v₀ Embedding</text>
    <rect x="48" y="170" width="232" height="28" rx="6" fill="#e6fcf5" stroke="#0ca678"/><text x="58" y="189" fill="#868e96">1</text><text x="82" y="189" fill="#0b7285" font-weight="700">b₁</text>
    <rect x="48" y="204" width="232" height="28" rx="6" fill="#e6fcf5" stroke="#0ca678"/><text x="58" y="223" fill="#868e96">2</text><text x="82" y="223" fill="#0b7285" font-weight="700">b₂</text>
    <rect x="48" y="238" width="232" height="28" rx="6" fill="#ffffff" stroke="#0ca678" stroke-dasharray="4 3"/><text x="58" y="257" fill="#868e96">3</text><text x="82" y="257" fill="#868e96">下一个写入位置</text>
    <text x="58" y="284" fill="#868e96">…</text>
  </g>
  <text x="272" y="257" text-anchor="end" font-size="11" font-weight="700" fill="#e8590c">← nvb = 3</text>
  <path d="M48 300 L280 300" stroke="#dee2e6" stroke-width="1"/>
  <text x="48" y="320" font-size="11" fill="#868e96">层间传递的 residual（不在 bank 里）</text>
  <rect x="48" y="330" width="232" height="44" rx="6" fill="#fff4e6" stroke="#f08c00"/>
  <text x="58" y="348" font-family="monospace" font-size="12" font-weight="700" fill="#e8590c">prefix = p（当前块部分和）</text>
  <text x="58" y="366" font-size="10.5" fill="#868e96">待加的子层输出在读入点里才加上</text>
  <text x="48" y="394" font-size="10.5" fill="#868e96">NB = cdiv(end_layer, attn_res_block_size) ≤ 8</text>

  <!-- Middle: one aggregation point -->
  <rect x="320" y="74" width="270" height="330" rx="10" fill="#f8f9fa" stroke="#f08c00"/>
  <rect x="320" y="74" width="270" height="28" rx="10" fill="#f08c00"/>
  <text x="334" y="93" font-size="14" font-weight="700" fill="#ffffff">_aggregate：一次聚合点</text>
  <g>
    <rect x="336" y="114" width="238" height="52" rx="8" fill="#fff9db" stroke="#f08c00"/>
    <text x="348" y="134" font-size="12.5" font-weight="700" fill="#e8590c">① 打分：nvb + 1 行各一个分数</text>
    <text x="348" y="154" font-size="10.5" fill="#495057">rrms(v) · (cw · v)，cw = γ ⊙ w 由 get_cw 缓存</text>
    <rect x="336" y="178" width="238" height="52" rx="8" fill="#f3f0ff" stroke="#7048e8"/>
    <text x="348" y="198" font-size="12.5" font-weight="700" fill="#5f3dc4">② Softmax：沿来源轴</text>
    <text x="348" y="218" font-size="10.5" fill="#495057">fast 路径按行块做 online softmax</text>
    <rect x="336" y="242" width="238" height="52" rx="8" fill="#e6fcf5" stroke="#0ca678"/>
    <text x="348" y="262" font-size="12.5" font-weight="700" fill="#0b7285">③ 对原始行加权求和</text>
    <text x="348" y="282" font-size="10.5" fill="#495057">pending add 先折入 prefix（fused_add）</text>
    <rect x="336" y="306" width="238" height="52" rx="8" fill="#edf2ff" stroke="#4c6ef5"/>
    <text x="348" y="326" font-size="12.5" font-weight="700" fill="#3b5bdb">④ out norm：子层原有的 PreNorm</text>
    <text x="348" y="346" font-size="10.5" fill="#495057">input_ / post_attention_layernorm</text>
  </g>
  <g fill="none" stroke="#868e96" stroke-width="2">
    <path d="M455 166 L455 174" marker-end="url(#ar)"/><path d="M455 230 L455 238" marker-end="url(#ar)"/><path d="M455 294 L455 302" marker-end="url(#ar)"/>
  </g>
  <text x="455" y="384" text-anchor="middle" font-size="10.5" fill="#868e96">按硬件分派：fast（TMA）/ hip / fused（Triton）</text>
  <!-- Arrows: bank + prefix into the aggregation -->
  <g fill="none" stroke="#868e96" stroke-width="2">
    <path d="M280 200 C305 200 310 140 332 140" marker-end="url(#ar)"/>
    <path d="M280 352 C312 352 306 150 332 150" marker-end="url(#ar)"/>
  </g>

  <!-- Right: one decoder layer -->
  <rect x="610" y="74" width="260" height="330" rx="10" fill="#f8f9fa" stroke="#4c6ef5"/>
  <rect x="610" y="74" width="260" height="28" rx="10" fill="#4c6ef5"/>
  <text x="624" y="93" font-size="14" font-weight="700" fill="#ffffff">一个 Decoder Layer</text>
  <rect x="626" y="114" width="228" height="46" rx="8" fill="#fff4e6" stroke="#f08c00" stroke-width="1.5"/>
  <text x="638" y="133" font-size="12.5" font-weight="700" fill="#e8590c">Attn 读入点</text>
  <text x="638" y="150" font-family="monospace" font-size="10.5" fill="#495057">self_attention_res_{norm,proj}</text>
  <rect x="626" y="172" width="228" height="32" rx="8" fill="#f1f3f5" stroke="#adb5bd"/>
  <text x="740" y="193" text-anchor="middle" font-size="12.5" font-weight="700" fill="#495057">Self-Attention</text>
  <rect x="626" y="216" width="228" height="46" rx="8" fill="#fff4e6" stroke="#f08c00" stroke-width="1.5"/>
  <text x="638" y="235" font-size="12.5" font-weight="700" fill="#e8590c">FFN 读入点</text>
  <text x="638" y="252" font-family="monospace" font-size="10.5" fill="#495057">mlp_res_{norm,proj}</text>
  <rect x="626" y="274" width="228" height="32" rx="8" fill="#f1f3f5" stroke="#adb5bd"/>
  <text x="740" y="295" text-anchor="middle" font-size="12.5" font-weight="700" fill="#495057">MLP / MoE</text>
  <g fill="none" stroke="#868e96" stroke-width="2">
    <path d="M740 160 L740 168" marker-end="url(#ar)"/><path d="M740 204 L740 212" marker-end="url(#ar)"/><path d="M740 262 L740 270" marker-end="url(#ar)"/>
  </g>
  <rect x="626" y="318" width="228" height="74" rx="8" fill="#f3f0ff" stroke="#7048e8"/>
  <text x="638" y="337" font-size="12" font-weight="700" fill="#5f3dc4">写块层：layer_idx % block_size == 0</text>
  <text x="638" y="355" font-size="10.5" fill="#495057">Attn 读入点的 prefix 正是上一块的完整</text>
  <text x="638" y="370" font-size="10.5" fill="#495057">摘要：参与聚合，同时写入 bank[nvb]；</text>
  <text x="638" y="385" font-size="10.5" fill="#495057">随后 residual 清空，开始新块</text>

  <!-- Arrows: aggregation output to both read points -->
  <g fill="none" stroke="#868e96" stroke-width="2">
    <path d="M574 332 L598 332 L598 137 L622 137" marker-end="url(#ar)"/>
    <path d="M598 239 L622 239" marker-end="url(#ar)"/>
  </g>

  <!-- Note strip -->
  <rect x="30" y="420" width="840" height="54" rx="8" fill="#f8f9fa" stroke="#e9ecef"/>
  <text x="450" y="442" text-anchor="middle" font-size="12" fill="#495057">bank 每次前向新建，只服务当前 Token 沿深度的计算，不是 KV Cache，不跨生成步保留</text>
  <text x="450" y="462" text-anchor="middle" font-size="12" fill="#495057">PP：整块随 attn_res_bank 传给下一 Stage 继续写；SP-MoE：每个 rank 只读写自己 token 分片的行</text>
</svg>
