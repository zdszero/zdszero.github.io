<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#495057"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="560" rx="12" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="600" fill="#212529">每个显存指标能看见哪些分配者</text>
  <text x="450" y="56" text-anchor="middle" font-size="13" fill="#868e96">一块 GPU 的 HBM 自下而上按物理分配者堆叠；右侧括号是各指标覆盖的范围</text>

  <!-- stacked HBM bar: x 120..400, y 80..500 -->
  <text x="260" y="76" text-anchor="middle" font-size="12" fill="#495057">HBM total</text>

  <!-- free -->
  <rect x="120" y="82" width="280" height="56" fill="#f8f9fa" stroke="#adb5bd" stroke-dasharray="5 4"/>
  <text x="260" y="115" text-anchor="middle" font-size="13" fill="#495057">空闲（free）</text>

  <!-- PyTorch reserved: y 138..388 -->
  <rect x="120" y="138" width="280" height="250" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="1.5"/>
  <text x="128" y="154" font-size="11" fill="#1c7ed6" font-weight="600">PyTorch caching allocator</text>

  <rect x="132" y="162" width="256" height="36" rx="4" fill="#ffffff" stroke="#74c0fc" stroke-dasharray="4 3"/>
  <text x="260" y="185" text-anchor="middle" font-size="12" fill="#495057">缓存空闲块 / 碎片（reserved − allocated）</text>

  <rect x="132" y="204" width="256" height="50" rx="4" fill="#fff4e6" stroke="#f08c00"/>
  <text x="260" y="226" text-anchor="middle" font-size="12" fill="#212529">CUDA Graph 私有池</text>
  <text x="260" y="243" text-anchor="middle" font-size="11" fill="#868e96">decode activation · workspace · 静态输出</text>

  <rect x="132" y="260" width="256" height="34" rx="4" fill="#d0ebff" stroke="#1c7ed6"/>
  <text x="260" y="282" text-anchor="middle" font-size="12" fill="#212529">eager activation / workspace</text>

  <rect x="132" y="300" width="256" height="40" rx="4" fill="#d0ebff" stroke="#1c7ed6"/>
  <text x="260" y="325" text-anchor="middle" font-size="12" fill="#212529">KV Cache（普通模式）</text>

  <rect x="132" y="346" width="256" height="36" rx="4" fill="#d0ebff" stroke="#1c7ed6"/>
  <text x="260" y="369" text-anchor="middle" font-size="12" fill="#212529">Model Weights</text>

  <!-- outside PyTorch: y 388..500 -->
  <rect x="120" y="388" width="280" height="38" fill="#f3f0ff" stroke="#7048e8"/>
  <text x="260" y="412" text-anchor="middle" font-size="12" fill="#212529">KV Cache（post-capture，VMM arena）</text>

  <rect x="120" y="426" width="280" height="38" fill="#fff0f6" stroke="#d6336c"/>
  <text x="260" y="450" text-anchor="middle" font-size="12" fill="#212529">NCCL / DeepEP / 直接 cudaMalloc</text>

  <rect x="120" y="464" width="280" height="36" fill="#f1f3f5" stroke="#495057"/>
  <text x="260" y="487" text-anchor="middle" font-size="12" fill="#212529">CUDA context / 库</text>

  <!-- left label -->
  <text x="108" y="450" text-anchor="end" font-size="11" fill="#d6336c">PyTorch</text>
  <text x="108" y="465" text-anchor="end" font-size="11" fill="#d6336c">看不见</text>
  <text x="108" y="258" text-anchor="end" font-size="11" fill="#1c7ed6">PyTorch</text>
  <text x="108" y="273" text-anchor="end" font-size="11" fill="#1c7ed6">看得见</text>
  <!-- bracket: memory_allocated -->
  <path d="M422,204 L430,204 L430,382 L422,382" fill="none" stroke="#1c7ed6" stroke-width="2"/>
  <line x1="430" y1="300" x2="600" y2="300" stroke="#1c7ed6" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="608" y="297" font-size="13" font-weight="600" fill="#1c7ed6">memory_allocated()</text>
  <text x="608" y="315" font-size="11" fill="#495057">活张量占用的 block，含 graph 池里的活块</text>

  <!-- bracket: memory_reserved -->
  <path d="M462,138 L470,138 L470,388 L462,388" fill="none" stroke="#1971c2" stroke-width="2"/>
  <line x1="470" y1="180" x2="600" y2="180" stroke="#1971c2" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="608" y="177" font-size="13" font-weight="600" fill="#1971c2">memory_reserved()</text>
  <text x="608" y="195" font-size="11" fill="#495057">allocated + 缓存空闲块；empty_cache() 后下降</text>

  <!-- bracket: device used -->
  <path d="M502,138 L510,138 L510,500 L502,500" fill="none" stroke="#2f9e44" stroke-width="2"/>
  <line x1="510" y1="440" x2="600" y2="440" stroke="#2f9e44" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="608" y="420" font-size="13" font-weight="600" fill="#2f9e44">mem_get_info()：total − free</text>
  <text x="608" y="438" font-size="13" font-weight="600" fill="#2f9e44">nvidia-smi / NVML 已用</text>
  <text x="608" y="456" font-size="11" fill="#495057">覆盖所有分配者，但不分用途</text>
  <text x="608" y="472" font-size="11" fill="#495057">整卡口径会算进同卡其他进程</text>

  <!-- free pointer -->
  <line x1="400" y1="110" x2="600" y2="110" stroke="#adb5bd" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="608" y="107" font-size="13" font-weight="600" fill="#495057">mem_get_info()：free</text>
  <text x="608" y="125" font-size="11" fill="#495057">SGLang 预算唯一使用的读数</text>

  <!-- note strip -->
  <rect x="40" y="514" width="820" height="34" rx="6" fill="#fff9db" stroke="#f08c00"/>
  <text x="450" y="536" text-anchor="middle" font-size="12" fill="#495057">memory_allocated ⊂ memory_reserved ⊂ 设备已用；graph 私有池在 reserved 之内，不是额外一份；reserved 与设备已用之差是 PyTorch 看不见的部分</text>
</svg>
