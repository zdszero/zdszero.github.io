<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 450" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="920" height="450" rx="12" fill="#ffffff"/>
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#868e96"/>
    </marker>
  </defs>
  <text x="460" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#212529">DSpark 的 Markov 头：把「前一个 token」接回块里</text>
  <text x="460" y="56" text-anchor="middle" font-size="13" fill="#868e96">上文之后 of course 和 no problem 都合理（概率为示意）</text>

  <!-- panel A: collision -->
  <rect x="24" y="74" width="428" height="250" rx="10" fill="#f8f9fa" stroke="#e9ecef"/>
  <text x="40" y="98" font-size="14" font-weight="700" fill="#495057">DFlash：各位置独立取 argmax</text>
  <g font-size="11.5">
    <text x="40" y="146" fill="#495057">位置 1</text>
    <text x="140" y="146" text-anchor="end" fill="#495057">of</text>
    <rect x="150" y="134" width="100" height="16" rx="3" fill="#fff4e6" stroke="#f08c00"/><text x="258" y="146" fill="#868e96">.50</text>
    <text x="140" y="168" text-anchor="end" fill="#495057">no</text>
    <rect x="150" y="156" width="96" height="16" rx="3" fill="#f1f3f5" stroke="#ced4da"/><text x="254" y="168" fill="#868e96">.48</text>
    <text x="40" y="206" fill="#495057">位置 2</text>
    <text x="140" y="206" text-anchor="end" fill="#495057">problem</text>
    <rect x="150" y="194" width="98" height="16" rx="3" fill="#fff4e6" stroke="#f08c00"/><text x="256" y="206" fill="#868e96">.49</text>
    <text x="140" y="228" text-anchor="end" fill="#495057">course</text>
    <rect x="150" y="216" width="94" height="16" rx="3" fill="#f1f3f5" stroke="#ced4da"/><text x="252" y="228" fill="#868e96">.47</text>
  </g>
  <text x="300" y="170" font-size="11" fill="#868e96">位置 2 的分布是</text>
  <text x="300" y="186" font-size="11" fill="#868e96">两种续写的混合，</text>
  <text x="300" y="202" font-size="11" fill="#868e96">不知道位置 1 取了谁</text>
  <text x="40" y="266" font-size="13" fill="#495057">拼起来：<tspan fill="#c92a2a" font-weight="700">「of problem」</tspan>，第 2 位被拒</text>
  <text x="40" y="304" font-size="10.5" fill="#868e96">论文称之为 multi-modal collision：越靠后的位置，混合得越厉害</text>
  <!-- panel B: Markov fix -->
  <rect x="468" y="74" width="428" height="250" rx="10" fill="#f8f9fa" stroke="#e9ecef"/>
  <text x="484" y="98" font-size="14" font-weight="700" fill="#0b7285">DSpark：加上「前一位取值」的偏置再采样</text>
  <g font-size="11.5">
    <text x="484" y="146" fill="#495057">位置 1</text>
    <text x="584" y="146" text-anchor="end" fill="#495057">of</text>
    <rect x="594" y="134" width="100" height="16" rx="3" fill="#e6fcf5" stroke="#0ca678"/><text x="702" y="146" fill="#868e96">.50 ← 采到</text>
    <text x="584" y="168" text-anchor="end" fill="#495057">no</text>
    <rect x="594" y="156" width="96" height="16" rx="3" fill="#f1f3f5" stroke="#ced4da"/><text x="698" y="168" fill="#868e96">.48</text>
    <text x="484" y="206" fill="#495057">位置 2</text>
    <text x="584" y="206" text-anchor="end" fill="#495057">course</text>
    <rect x="594" y="194" width="184" height="16" rx="3" fill="#e6fcf5" stroke="#0ca678"/><text x="786" y="206" fill="#868e96">.92</text>
    <text x="584" y="228" text-anchor="end" fill="#495057">problem</text>
    <rect x="594" y="216" width="8" height="16" rx="3" fill="#f1f3f5" stroke="#ced4da"/><text x="610" y="228" fill="#868e96">.04</text>
  </g>
  <path d="M720 156 C 760 160, 800 176, 800 190" stroke="#0ca678" stroke-width="1.3" fill="none" stroke-dasharray="4 3" marker-end="url(#ar)"/>
  <text x="808" y="178" font-size="11" fill="#0b7285">+ B(of)</text>
  <text x="484" y="266" font-size="13" fill="#495057">拼起来：<tspan fill="#0b7285" font-weight="700">「of course」</tspan>，两位都被接受</text>
  <text x="484" y="304" font-size="10.5" fill="#868e96">基础 logits U_k 仍来自同一次块前向，只有偏置是串行的</text>

  <rect x="24" y="340" width="872" height="94" rx="8" fill="#f8f9fa" stroke="#e9ecef"/>
  <text x="44" y="364" font-size="12" font-weight="700" fill="#212529">p_k = softmax(U_k + W1[x_prev]·W2)，x_prev 是前一位采到的 token，秩 r = 256</text>
  <text x="44" y="386" font-size="12" fill="#495057">· 问题有实测：DFlash 的块内接受率随位置下降，代码 0.87 → 0.78，对话 0.72 → 0.63。</text>
  <text x="44" y="406" font-size="12" fill="#495057">· 每步只是一次 embedding 查表加一次 r × V 的矩阵乘，不是模型前向；串行 γ 步的延迟开销 0.2%～1.3%。</text>
  <text x="44" y="426" font-size="12" fill="#495057">· 结构上是一阶马尔可夫：只看前一个 token。论文试过 RNN 变体，收益很小。</text>
</svg>
