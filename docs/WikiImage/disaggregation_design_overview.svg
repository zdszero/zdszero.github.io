<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 600" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="920" height="600" rx="12" fill="#ffffff"/>
  <text x="460" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#212529">一个请求在 PD 分离下的完整生命周期</text>
  <text x="460" y="56" text-anchor="middle" font-size="13" fill="#868e96">请求同时发往两个独立 Scheduler，携带相同 bootstrap_room，在 Bootstrap Server 上会合</text>

  <!-- Bootstrap Server -->
  <rect x="330" y="78" width="260" height="52" rx="10" fill="#fff9db" stroke="#f08c00"/>
  <text x="460" y="100" text-anchor="middle" font-size="13" font-weight="700" fill="#e8590c">Bootstrap Server (aiohttp)</text>
  <text x="460" y="118" text-anchor="middle" font-size="11" fill="#b26a00">服务发现「电话簿」· 不碰数据 · /route</text>

  <!-- entry dots -->
  <circle cx="150" cy="104" r="7" fill="#495057"/>
  <text x="150" y="138" text-anchor="middle" font-size="10.5" fill="#868e96">① 接入层</text>
  <text x="150" y="152" text-anchor="middle" font-size="10.5" fill="#868e96">同一 room 投递两侧</text>

  <!-- Prefill panel -->
  <rect x="40" y="178" width="390" height="376" rx="10" fill="#ffffff" stroke="#4c6ef5" stroke-width="1.5"/>
  <rect x="40" y="178" width="390" height="28" rx="10" fill="#4c6ef5"/>
  <text x="56" y="197" font-size="13" font-weight="700" fill="#ffffff">Prefill Server　（吞吐优先）</text>

  <!-- Decode panel -->
  <rect x="490" y="178" width="390" height="376" rx="10" fill="#ffffff" stroke="#0ca678" stroke-width="1.5"/>
  <rect x="490" y="178" width="390" height="28" rx="10" fill="#0ca678"/>
  <text x="506" y="197" font-size="13" font-weight="700" fill="#ffffff">Decode Server　（延迟优先）</text>

  <!-- bootstrap arrows -->
  <path d="M330 110 L300 110 Q235 110 235 176" fill="none" stroke="#f0b429" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#ary)"/>
  <text x="250" y="150" font-size="9.5" fill="#b26a00">PUT 注册</text>
  <path d="M590 110 L620 110 Q685 110 685 176" fill="none" stroke="#f0b429" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#ary)"/>
  <text x="648" y="150" font-size="9.5" fill="#b26a00">GET 查询</text>
  <path d="M157 110 L328 110" stroke="#868e96" stroke-width="1.4" stroke-dasharray="3 3"/>

  <!-- Prefill queues -->
  <rect x="70" y="224" width="330" height="56" rx="8" fill="#edf2ff" stroke="#4c6ef5"/>
  <text x="84" y="246" font-size="12.5" font-weight="700" fill="#3b5bdb">Bootstrap Queue</text>
  <text x="84" y="266" font-size="10.5" fill="#495057">等握手 · poll 状态 · max_new_tokens=1</text>
  <rect x="70" y="300" width="330" height="56" rx="8" fill="#edf2ff" stroke="#4c6ef5"/>
  <text x="84" y="322" font-size="12.5" font-weight="700" fill="#3b5bdb">Waiting Queue</text>
  <text x="84" y="342" font-size="10.5" fill="#495057">正常组 batch，执行 Prefill forward</text>
  <rect x="70" y="376" width="330" height="56" rx="8" fill="#fff4e6" stroke="#f08c00"/>
  <text x="84" y="398" font-size="12.5" font-weight="700" fill="#e8590c">Inflight Queue</text>
  <text x="84" y="418" font-size="10.5" fill="#b26a00">send_kv_chunk() 发起 RDMA 写，poll 传输</text>
  <path d="M235 280 L235 298" stroke="#868e96" stroke-width="1.8" marker-end="url(#ar)"/>
  <path d="M235 356 L235 374" stroke="#868e96" stroke-width="1.8" marker-end="url(#ar)"/>
  <rect x="70" y="452" width="330" height="48" rx="8" fill="#f8f9fa" stroke="#e9ecef"/>
  <text x="84" y="474" font-size="11.5" font-weight="700" fill="#495057">④ Success</text>
  <text x="84" y="492" font-size="10.5" fill="#868e96">释放本地 KV + 向用户返回首 token</text>
  <path d="M235 432 L235 450" stroke="#868e96" stroke-width="1.8" marker-end="url(#ar)"/>

  <!-- Decode queues -->
  <rect x="520" y="224" width="330" height="56" rx="8" fill="#e6fcf5" stroke="#0ca678"/>
  <text x="534" y="246" font-size="12.5" font-weight="700" fill="#0b7285">Prealloc Queue</text>
  <text x="534" y="266" font-size="10.5" fill="#495057">握手 + 预分配 KV 页，send_metadata 告知地址</text>
  <rect x="520" y="300" width="330" height="56" rx="8" fill="#fff4e6" stroke="#f08c00"/>
  <text x="534" y="322" font-size="12.5" font-weight="700" fill="#e8590c">Transfer Queue</text>
  <text x="534" y="342" font-size="10.5" fill="#b26a00">只 poll，等 Prefill 单边写入 KV</text>
  <rect x="520" y="376" width="330" height="56" rx="8" fill="#e5dbff" stroke="#7048e8"/>
  <text x="534" y="398" font-size="12.5" font-weight="700" fill="#5f3dc4">Waiting Queue → Prebuilt Batch</text>
  <text x="534" y="418" font-size="10.5" fill="#5f3dc4">跳过 forward，伪造「刚算完 Prefill」</text>
  <rect x="520" y="452" width="330" height="48" rx="8" fill="#e6fcf5" stroke="#0ca678"/>
  <text x="534" y="474" font-size="12.5" font-weight="700" fill="#0b7285">Running Batch</text>
  <text x="534" y="492" font-size="10.5" fill="#495057">⑤ 标准自回归 Decode，直到结束</text>
  <path d="M685 280 L685 298" stroke="#868e96" stroke-width="1.8" marker-end="url(#ar)"/>
  <path d="M685 356 L685 374" stroke="#868e96" stroke-width="1.8" marker-end="url(#ar)"/>
  <path d="M685 432 L685 450" stroke="#868e96" stroke-width="1.8" marker-end="url(#ar)"/>

  <!-- RDMA transfer arrow -->
  <path d="M400 404 L518 328" stroke="#f08c00" stroke-width="2.4" marker-end="url(#aro)"/>
  <text x="460" y="356" text-anchor="middle" font-size="11" font-weight="700" fill="#e8590c">RDMA 写 KV</text>

  <!-- ZMQ control arrow (decode → prefill) -->
  <path d="M518 252 L402 248" stroke="#7048e8" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#arp)"/>
  <text x="460" y="236" text-anchor="middle" font-size="10" fill="#5f3dc4">ZMQ 目标地址</text>

  <text x="40" y="582" font-size="11.5" fill="#868e96">关键顺序：Decode 先分配显存并把目标地址发给 Prefill，Prefill 才知道「写到哪」——这决定了两侧流水线的形状。</text>

  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#868e96"/></marker>
    <marker id="ary" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#f0b429"/></marker>
    <marker id="aro" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#f08c00"/></marker>
    <marker id="arp" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#7048e8"/></marker>
  </defs>
</svg>
