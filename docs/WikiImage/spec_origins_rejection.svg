<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="920" height="470" rx="12" fill="#ffffff"/>
  <text x="460" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#212529">拒绝采样为什么无损</text>
  <text x="460" y="56" text-anchor="middle" font-size="13" fill="#868e96">以 4 个 token 的词表为例：draft 采样 x ~ q，以 min(1, p/q) 接受；拒绝后从 max(0, p − q) 里重采</text>

  <!-- panel A -->
  <rect x="24" y="74" width="428" height="300" rx="10" fill="#f8f9fa" stroke="#e9ecef"/>
  <text x="40" y="98" font-size="14" font-weight="700" fill="#212529">两个分布</text>
  <rect x="250" y="88" width="12" height="12" rx="2" fill="#f3f0ff" stroke="#7048e8"/>
  <text x="268" y="98" font-size="11.5" fill="#495057">draft q</text>
  <rect x="330" y="88" width="12" height="12" rx="2" fill="#edf2ff" stroke="#4c6ef5"/>
  <text x="348" y="98" font-size="11.5" fill="#495057">target p</text>
  <line x1="50" y1="330" x2="430" y2="330" stroke="#adb5bd"/>
  <g font-size="10.5" text-anchor="middle">
    <rect x="72" y="270" width="26" height="60" fill="#f3f0ff" stroke="#7048e8"/><text x="85" y="264" fill="#5f3dc4">.20</text>
    <rect x="102" y="180" width="26" height="150" fill="#edf2ff" stroke="#4c6ef5"/><text x="115" y="174" fill="#3b5bdb">.50</text>
    <rect x="162" y="150" width="26" height="180" fill="#f3f0ff" stroke="#7048e8"/><text x="175" y="144" fill="#5f3dc4">.60</text>
    <rect x="192" y="240" width="26" height="90" fill="#edf2ff" stroke="#4c6ef5"/><text x="205" y="234" fill="#3b5bdb">.30</text>
    <rect x="252" y="300" width="26" height="30" fill="#f3f0ff" stroke="#7048e8"/><text x="265" y="294" fill="#5f3dc4">.10</text>
    <rect x="282" y="285" width="26" height="45" fill="#edf2ff" stroke="#4c6ef5"/><text x="295" y="279" fill="#3b5bdb">.15</text>
    <rect x="342" y="300" width="26" height="30" fill="#f3f0ff" stroke="#7048e8"/><text x="355" y="294" fill="#5f3dc4">.10</text>
    <rect x="372" y="315" width="26" height="15" fill="#edf2ff" stroke="#4c6ef5"/><text x="385" y="309" fill="#3b5bdb">.05</text>
  </g>
  <g font-size="12" text-anchor="middle" fill="#495057" font-family="monospace">
    <text x="100" y="350">A</text><text x="190" y="350">B</text><text x="280" y="350">C</text><text x="370" y="350">D</text>
  </g>
  <text x="238" y="366" text-anchor="middle" font-size="10.5" fill="#868e96">B 上 draft 过度自信（q &gt; p），A 上 draft 信心不足（q &lt; p）</text>
  <!-- panel B -->
  <rect x="468" y="74" width="428" height="300" rx="10" fill="#f8f9fa" stroke="#e9ecef"/>
  <text x="484" y="98" font-size="14" font-weight="700" fill="#212529">每个 token 最终被留下的概率</text>
  <rect x="484" y="110" width="12" height="12" rx="2" fill="#e6fcf5" stroke="#0ca678"/>
  <text x="502" y="120" font-size="11" fill="#495057">draft 提出且被接受：min(p, q)</text>
  <rect x="690" y="110" width="12" height="12" rx="2" fill="#fff4e6" stroke="#f08c00"/>
  <text x="708" y="120" font-size="11" fill="#495057">拒绝后从残差抽到</text>
  <rect x="484" y="128" width="12" height="12" rx="2" fill="none" stroke="#7048e8" stroke-dasharray="3 2"/>
  <text x="502" y="138" font-size="11" fill="#495057">q 超出 p 的部分：被拒绝，不进输出</text>
  <line x1="494" y1="330" x2="876" y2="330" stroke="#adb5bd"/>
  <g font-size="10.5" text-anchor="middle">
    <rect x="540" y="270" width="40" height="60" fill="#e6fcf5" stroke="#0ca678"/><text x="560" y="304" fill="#0b7285">.20</text>
    <rect x="540" y="180" width="40" height="90" fill="#fff4e6" stroke="#f08c00"/><text x="560" y="229" fill="#e8590c">.30</text>
    <text x="560" y="174" fill="#3b5bdb">= .50</text>
    <rect x="630" y="240" width="40" height="90" fill="#e6fcf5" stroke="#0ca678"/><text x="650" y="289" fill="#0b7285">.30</text>
    <rect x="630" y="150" width="40" height="90" fill="none" stroke="#7048e8" stroke-dasharray="4 3"/><text x="650" y="199" fill="#5f3dc4">.30</text>
    <text x="680" y="236" fill="#3b5bdb" text-anchor="start">= .30</text>
    <rect x="720" y="300" width="40" height="30" fill="#e6fcf5" stroke="#0ca678"/>
    <rect x="720" y="285" width="40" height="15" fill="#fff4e6" stroke="#f08c00"/>
    <text x="740" y="279" fill="#3b5bdb">= .15</text>
    <rect x="810" y="315" width="40" height="15" fill="#e6fcf5" stroke="#0ca678"/>
    <rect x="810" y="300" width="40" height="15" fill="none" stroke="#7048e8" stroke-dasharray="4 3"/>
    <text x="830" y="294" fill="#3b5bdb">= .05</text>
  </g>
  <g font-size="12" text-anchor="middle" fill="#495057" font-family="monospace">
    <text x="560" y="350">A</text><text x="650" y="350">B</text><text x="740" y="350">C</text><text x="830" y="350">D</text>
  </g>
  <text x="682" y="366" text-anchor="middle" font-size="10.5" fill="#868e96">绿 + 橙 = p，蓝色数字和左图的 target 完全一致</text>

  <rect x="24" y="390" width="872" height="62" rx="8" fill="#f8f9fa" stroke="#e9ecef"/>
  <text x="460" y="414" text-anchor="middle" font-size="12" fill="#495057">接受率 β = Σ min(p, q) = .20 + .30 + .10 + .05 = 0.65；被拒的 0.35 全部从残差 max(0, p − q) = {A: .30, C: .05} 里补回。</text>
  <text x="460" y="434" text-anchor="middle" font-size="12" fill="#495057">draft 越接近 target，绿色越多、需要重采的越少；但无论 draft 多差，输出分布都严格等于 p。</text>
</svg>
