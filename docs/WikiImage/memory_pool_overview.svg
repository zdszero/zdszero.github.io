<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 600" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="920" height="600" rx="12" fill="#ffffff"/>
  <text x="460" y="36" text-anchor="middle" font-size="21" font-weight="700" fill="#212529">SGLang Memory Pool：三层映射架构</text>
  <text x="460" y="58" text-anchor="middle" font-size="13" fill="#868e96">把「逻辑 token 序列」一步步解析到「物理 KV 数据」</text>

  <!-- Layer 0: logical -->
  <rect x="60" y="78" width="520" height="78" rx="10" fill="#f1f3f5" stroke="#ced4da"/>
  <text x="78" y="104" font-size="15" font-weight="700" fill="#343a40">逻辑视图  Request / Token</text>
  <text x="78" y="128" font-size="12.5" fill="#495057">Req A: [t0][t1][t2][t3] …   Req B: [t0][t1][t2] …</text>
  <text x="78" y="147" font-size="12" fill="#868e96">每个请求长度动态增长，可能共享相同 prefix</text>
  <rect x="604" y="78" width="256" height="78" rx="10" fill="#ffffff" stroke="#e9ecef"/>
  <text x="620" y="100" font-size="11.5" fill="#868e96">输入</text>
  <text x="620" y="122" font-size="12.5" fill="#495057" font-family="monospace">req_pool_idx = 7</text>
  <text x="620" y="142" font-size="12.5" fill="#495057" font-family="monospace">seq_len = 4</text>

  <path d="M320 156 L320 186" stroke="#868e96" stroke-width="2" marker-end="url(#ar)"/>

  <!-- Layer 1: ReqToTokenPool -->
  <rect x="60" y="188" width="520" height="86" rx="10" fill="#edf2ff" stroke="#4c6ef5"/>
  <rect x="60" y="188" width="520" height="26" rx="10" fill="#4c6ef5"/>
  <text x="74" y="206" font-size="14" font-weight="700" fill="#ffffff">① ReqToTokenPool　请求维度寻址</text>
  <text x="78" y="236" font-size="12.5" fill="#343a40" font-family="monospace">req_to_token[req_pool_idx, pos] = kv_index</text>
  <text x="78" y="258" font-size="12" fill="#495057">二维表 [size+1, max_context_len]，每个请求占一行</text>
  <rect x="604" y="188" width="256" height="86" rx="10" fill="#ffffff" stroke="#e9ecef"/>
  <text x="620" y="210" font-size="11.5" fill="#868e96">第 7 行前 4 个槽位</text>
  <text x="620" y="236" font-size="13" fill="#4c6ef5" font-family="monospace">[ 12, 13, 40, 41 ]</text>
  <text x="620" y="258" font-size="11.5" fill="#868e96">→ 得到 kv_index 列表</text>

  <path d="M320 274 L320 304" stroke="#868e96" stroke-width="2" marker-end="url(#ar)"/>

  <!-- Layer 2: Allocator -->
  <rect x="60" y="306" width="520" height="86" rx="10" fill="#e6fcf5" stroke="#0ca678"/>
  <rect x="60" y="306" width="520" height="26" rx="10" fill="#0ca678"/>
  <text x="74" y="324" font-size="14" font-weight="700" fill="#ffffff">② TokenToKVPoolAllocator　物理槽位分配</text>
  <text x="78" y="354" font-size="12.5" fill="#343a40" font-family="monospace">free_pages / release_pages → kv_index</text>
  <text x="78" y="376" font-size="12" fill="#495057">page_size=1 连续分配；page_size&gt;1 页式分配</text>
  <rect x="604" y="306" width="256" height="86" rx="10" fill="#ffffff" stroke="#e9ecef"/>
  <text x="620" y="328" font-size="11.5" fill="#868e96">空闲页池（page_size=64）</text>
  <text x="620" y="354" font-size="12.5" fill="#0ca678" font-family="monospace">page 0 ▪ page 1 ▪ …</text>
  <text x="620" y="376" font-size="11.5" fill="#868e96">kv_index = page*64 + 偏移</text>

  <path d="M320 392 L320 422" stroke="#868e96" stroke-width="2" marker-end="url(#ar)"/>

  <!-- Layer 3: KVCache -->
  <rect x="60" y="424" width="520" height="90" rx="10" fill="#fff9db" stroke="#f08c00"/>
  <rect x="60" y="424" width="520" height="26" rx="10" fill="#f08c00"/>
  <text x="74" y="442" font-size="14" font-weight="700" fill="#ffffff">③ KVCache　实际 KV 数据存储</text>
  <text x="78" y="472" font-size="12.5" fill="#343a40" font-family="monospace">k_buffer[layer][kv_index] , v_buffer[layer][kv_index]</text>
  <text x="78" y="494" font-size="12" fill="#495057">MHA: K/V 分离；MLA: 融合压缩 latent（单 buffer）</text>
  <rect x="604" y="424" width="256" height="90" rx="10" fill="#ffffff" stroke="#e9ecef"/>
  <text x="620" y="446" font-size="11.5" fill="#868e96">按 kv_index gather</text>
  <text x="620" y="472" font-size="12.5" fill="#f08c00" font-family="monospace">K = k_buf[L][[12,13,40,41]]</text>
  <text x="620" y="494" font-size="11.5" fill="#868e96">→ 送入 Attention Kernel</text>

  <text x="60" y="548" font-size="12" fill="#868e96">设计要点：寻址 / 分配 / 存储三者分离，仅靠 kv_index 关联——内存整理、prefix 共享、CPU offload 都只动其中一层。</text>

  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#868e96"/>
    </marker>
  </defs>
</svg>
