<text x="48.0" y="532.0" font-size="12" fill="#495057" text-anchor="start">2024 年的预测也被一起上调，到 2022-10-28 分别为 1,521 和 1,613 亿元，实际为 1,238 和 1,379 亿元。2024-04-26 一季报后再次把 2024 年预</text>
<text x="48.0" y="550.0" font-size="12" fill="#495057" text-anchor="start">测上调到 1,650 亿元，接近 H 股 2024-06-20 的高点。</text>
<text x="48.0" y="568.0" font-size="12" fill="#495057" text-anchor="start">来源：东方财富研报中心信达证券报告摘要；实际值画在年报披露后估值分母更新的日期。</text>
