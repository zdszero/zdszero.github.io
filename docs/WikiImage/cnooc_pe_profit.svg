<text x="48.0" y="654.0" font-size="12" fill="#495057" text-anchor="start">2020 到 2022 年利润从 249.6 亿元增至 1,417.0 亿元，H 股平均 PE 从 6.87 倍降到 5.07 倍，2023 年只有 3.94 倍；2024—2025 年利润回落到</text>
<text x="48.0" y="672.0" font-size="12" fill="#495057" text-anchor="start">1,221—1,379 亿元，平均 PE 回到 6 倍。2021 年的 9.11 倍是因为上半年分母仍是 2020 年的低利润。</text>
<text x="48.0" y="690.0" font-size="12" fill="#495057" text-anchor="start">来源：H 股 PE = H 股收盘价 × 港元兑人民币中间价 × 总股本 / 当时已披露 TTM 归母净利润（本文自算）；A 股 PE 取东方财富估值分析 RPT_</text>
