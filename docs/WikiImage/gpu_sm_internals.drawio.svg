<svg xmlns="http://www.w3.org/2000/svg" width="760" height="540" viewBox="0 0 760 540" font-family="-apple-system,Helvetica,Arial,sans-serif">
  <style>
    .lbl{font-size:11px;fill:#334155;font-weight:600}
    .sm{font-size:10px;fill:#fff;font-weight:600;text-anchor:middle}
    .cap{font-size:10.5px;fill:#64748b}
  </style>
  <rect x="0" y="0" width="760" height="540" fill="#fdfdfd"/>
  <text x="24" y="30" font-size="17" font-weight="800" fill="#111">SM（流式多处理器）内部结构</text>
  <text x="24" y="50" font-size="11" fill="#999">现代 NVIDIA GPU 的基本计算单元：一池核心 + 专用 Tensor Core + 片上存储</text>

  <rect x="24" y="64" width="712" height="40" rx="6" fill="#1e293b"/>
  <text x="380" y="89" class="sm" font-size="12">L1 指令缓存 / 线程块调度（整个 SM 共享）</text>

  <!-- 4 processing blocks (sub-partitions) -->
  <g>
    <rect x="24" y="116" width="160" height="300" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
    <rect x="204" y="116" width="160" height="300" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
    <rect x="384" y="116" width="160" height="300" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
    <rect x="564" y="116" width="160" height="300" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  </g>
  <text x="380" y="132" class="cap" text-anchor="middle">4 个处理子分区（每个一组 warp 调度器 + 自己的寄存器与核心）</text>

  <!-- contents replicated per block; draw via groups -->
  <g>
    <!-- block template at x=24 -->
    <rect x="36" y="144" width="136" height="26" rx="4" fill="#64748b"/><text x="104" y="161" class="sm">Warp Scheduler + Dispatch</text>
    <rect x="36" y="176" width="136" height="24" rx="4" fill="#94a3b8"/><text x="104" y="192" class="sm">寄存器文件 16K×32bit</text>
    <rect x="36" y="206" width="136" height="34" rx="4" fill="#6366f1"/><text x="104" y="227" class="sm">FP32 CUDA Cores ×32</text>
    <rect x="36" y="246" width="66" height="26" rx="4" fill="#818cf8"/><text x="69" y="263" class="sm">INT32</text>
    <rect x="106" y="246" width="66" height="26" rx="4" fill="#a5b4fc"/><text x="139" y="263" class="sm">FP64</text>
    <rect x="36" y="278" width="136" height="46" rx="4" fill="#22c55e"/><text x="104" y="300" class="sm" font-size="11">Tensor Core</text><text x="104" y="316" class="sm" font-size="9">矩阵乘加 (MMA)</text>
    <rect x="36" y="330" width="136" height="24" rx="4" fill="#cbd5e1"/><text x="104" y="346" style="font-size:10px;fill:#334155;font-weight:600" text-anchor="middle">LD/ST · SFU</text>
    <rect x="36" y="360" width="136" height="24" rx="4" fill="#e2e8f0"/><text x="104" y="376" class="cap" text-anchor="middle">L0 I-Cache</text>
  </g>
  <g transform="translate(180,0)">
    <rect x="36" y="144" width="136" height="26" rx="4" fill="#64748b"/><text x="104" y="161" class="sm">Warp Scheduler + Dispatch</text>
    <rect x="36" y="176" width="136" height="24" rx="4" fill="#94a3b8"/><text x="104" y="192" class="sm">寄存器文件 16K×32bit</text>
    <rect x="36" y="206" width="136" height="34" rx="4" fill="#6366f1"/><text x="104" y="227" class="sm">FP32 CUDA Cores ×32</text>
    <rect x="36" y="246" width="66" height="26" rx="4" fill="#818cf8"/><text x="69" y="263" class="sm">INT32</text>
    <rect x="106" y="246" width="66" height="26" rx="4" fill="#a5b4fc"/><text x="139" y="263" class="sm">FP64</text>
    <rect x="36" y="278" width="136" height="46" rx="4" fill="#22c55e"/><text x="104" y="300" class="sm" font-size="11">Tensor Core</text><text x="104" y="316" class="sm" font-size="9">矩阵乘加 (MMA)</text>
    <rect x="36" y="330" width="136" height="24" rx="4" fill="#cbd5e1"/><text x="104" y="346" style="font-size:10px;fill:#334155;font-weight:600" text-anchor="middle">LD/ST · SFU</text>
    <rect x="36" y="360" width="136" height="24" rx="4" fill="#e2e8f0"/><text x="104" y="376" class="cap" text-anchor="middle">L0 I-Cache</text>
  </g>
  <g transform="translate(360,0)">
    <rect x="36" y="144" width="136" height="26" rx="4" fill="#64748b"/><text x="104" y="161" class="sm">Warp Scheduler + Dispatch</text>
    <rect x="36" y="176" width="136" height="24" rx="4" fill="#94a3b8"/><text x="104" y="192" class="sm">寄存器文件 16K×32bit</text>
    <rect x="36" y="206" width="136" height="34" rx="4" fill="#6366f1"/><text x="104" y="227" class="sm">FP32 CUDA Cores ×32</text>
    <rect x="36" y="246" width="66" height="26" rx="4" fill="#818cf8"/><text x="69" y="263" class="sm">INT32</text>
    <rect x="106" y="246" width="66" height="26" rx="4" fill="#a5b4fc"/><text x="139" y="263" class="sm">FP64</text>
    <rect x="36" y="278" width="136" height="46" rx="4" fill="#22c55e"/><text x="104" y="300" class="sm" font-size="11">Tensor Core</text><text x="104" y="316" class="sm" font-size="9">矩阵乘加 (MMA)</text>
    <rect x="36" y="330" width="136" height="24" rx="4" fill="#cbd5e1"/><text x="104" y="346" style="font-size:10px;fill:#334155;font-weight:600" text-anchor="middle">LD/ST · SFU</text>
    <rect x="36" y="360" width="136" height="24" rx="4" fill="#e2e8f0"/><text x="104" y="376" class="cap" text-anchor="middle">L0 I-Cache</text>
  </g>
  <g transform="translate(540,0)">
    <rect x="36" y="144" width="136" height="26" rx="4" fill="#64748b"/><text x="104" y="161" class="sm">Warp Scheduler + Dispatch</text>
    <rect x="36" y="176" width="136" height="24" rx="4" fill="#94a3b8"/><text x="104" y="192" class="sm">寄存器文件 16K×32bit</text>
    <rect x="36" y="206" width="136" height="34" rx="4" fill="#6366f1"/><text x="104" y="227" class="sm">FP32 CUDA Cores ×32</text>
    <rect x="36" y="246" width="66" height="26" rx="4" fill="#818cf8"/><text x="69" y="263" class="sm">INT32</text>
    <rect x="106" y="246" width="66" height="26" rx="4" fill="#a5b4fc"/><text x="139" y="263" class="sm">FP64</text>
    <rect x="36" y="278" width="136" height="46" rx="4" fill="#22c55e"/><text x="104" y="300" class="sm" font-size="11">Tensor Core</text><text x="104" y="316" class="sm" font-size="9">矩阵乘加 (MMA)</text>
    <rect x="36" y="330" width="136" height="24" rx="4" fill="#cbd5e1"/><text x="104" y="346" style="font-size:10px;fill:#334155;font-weight:600" text-anchor="middle">LD/ST · SFU</text>
    <rect x="36" y="360" width="136" height="24" rx="4" fill="#e2e8f0"/><text x="104" y="376" class="cap" text-anchor="middle">L0 I-Cache</text>
  </g>

  <!-- shared memory / L1 -->
  <rect x="24" y="428" width="712" height="44" rx="6" fill="#0ea5e9"/>
  <text x="380" y="447" class="sm" font-size="12">共享内存 / L1 数据缓存（可配置，Hopper 起达 256 KB）</text>
  <text x="380" y="463" class="sm" font-size="10">+ TMA 张量访存加速器 · 分布式共享内存 DSMEM（Hopper 起支持跨 SM 访问）</text>
  <text x="24" y="498" class="cap">往外是全 SM 共享的 L2 缓存，再往外是片外 HBM 显存；越靠近核心的存储越快、越小、越贵。</text>
</svg>
