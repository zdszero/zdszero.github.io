<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#868e96"/>
    </marker>
    <marker id="arRed" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#c92a2a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="520" rx="12" fill="#ffffff"/>
  <text x="40" y="34" font-size="20" font-weight="700" fill="#212529">缓存分配器的碎片：有空闲，却放不下</text>
  <text x="40" y="56" font-size="13" fill="#868e96">reserved − allocated 是空闲总量；一次分配需要的是同一 segment 内一段足够大的连续空闲 block</text>

  <!-- Row A: fragmented segment -->
  <text x="40" y="92" font-size="13.5" font-weight="700" fill="#212529">默认模式：一个 segment = 一次 cudaMalloc（示例 20 MB），按需切分成 block</text>
  <rect x="40" y="104" width="800" height="54" rx="8" fill="#f8f9fa" stroke="#adb5bd"/>
  <!-- allocated blocks (blue) and free holes (dashed) -->
  <rect x="42" y="106" width="118" height="50" rx="6" fill="#edf2ff" stroke="#4c6ef5"/>
  <text x="101" y="128" font-size="12" font-weight="700" fill="#3b5bdb" text-anchor="middle">活跃 3 MB</text>
  <text x="101" y="145" font-size="11" fill="#495057" text-anchor="middle">权重/激活</text>
  <rect x="162" y="106" width="76" height="50" rx="6" fill="#ffffff" stroke="#adb5bd" stroke-dasharray="4 3"/>
  <text x="200" y="135" font-size="11.5" fill="#868e96" text-anchor="middle">空 2 MB</text>
  <rect x="242" y="106" width="156" height="50" rx="6" fill="#edf2ff" stroke="#4c6ef5"/>
  <text x="320" y="128" font-size="12" font-weight="700" fill="#3b5bdb" text-anchor="middle">活跃 4 MB</text>
  <text x="320" y="145" font-size="11" fill="#495057" text-anchor="middle">长生命周期张量</text>
  <rect x="402" y="106" width="76" height="50" rx="6" fill="#ffffff" stroke="#adb5bd" stroke-dasharray="4 3"/>
  <text x="440" y="135" font-size="11.5" fill="#868e96" text-anchor="middle">空 2 MB</text>
  <rect x="482" y="106" width="116" height="50" rx="6" fill="#edf2ff" stroke="#4c6ef5"/>
  <text x="540" y="128" font-size="12" font-weight="700" fill="#3b5bdb" text-anchor="middle">活跃 3 MB</text>
  <text x="540" y="145" font-size="11" fill="#495057" text-anchor="middle">通信 buffer</text>
  <rect x="602" y="106" width="76" height="50" rx="6" fill="#ffffff" stroke="#adb5bd" stroke-dasharray="4 3"/>
  <text x="640" y="135" font-size="11.5" fill="#868e96" text-anchor="middle">空 2 MB</text>
  <rect x="682" y="106" width="76" height="50" rx="6" fill="#edf2ff" stroke="#4c6ef5"/>
  <text x="720" y="135" font-size="12" font-weight="700" fill="#3b5bdb" text-anchor="middle">活跃 2 MB</text>
  <rect x="762" y="106" width="76" height="50" rx="6" fill="#ffffff" stroke="#adb5bd" stroke-dasharray="4 3"/>
  <text x="800" y="135" font-size="11.5" fill="#868e96" text-anchor="middle">空 2 MB</text>
  <!-- bracket over holes -->
  <path d="M200 166 L200 174 L800 174 L800 166" fill="none" stroke="#868e96" stroke-width="1.5"/>
  <text x="500" y="192" font-size="12" fill="#495057" text-anchor="middle">allocated = 12 MB，reserved = 20 MB：空闲 8 MB，但是 4 个互不相邻的 2 MB 空洞</text>

  <!-- Request flow -->
  <rect x="40" y="214" width="150" height="62" rx="10" fill="#fff9db" stroke="#f08c00"/>
  <text x="115" y="240" font-size="13.5" font-weight="700" fill="#e8590c" text-anchor="middle">新请求 6 MB</text>
  <text x="115" y="260" font-size="11" fill="#495057" text-anchor="middle">如 prefill 的临时张量</text>
  <path d="M190 245 L216 245" stroke="#868e96" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="222" y="214" width="196" height="62" rx="10" fill="#f8f9fa" stroke="#adb5bd"/>
  <text x="320" y="238" font-size="12.5" font-weight="700" fill="#495057" text-anchor="middle">① 查缓存空闲 block</text>
  <text x="320" y="258" font-size="11" fill="#868e96" text-anchor="middle">同 stream、同 pool，≥ 6 MB：无</text>
  <path d="M418 245 L444 245" stroke="#868e96" stroke-width="2" marker-end="url(#ar)"/>
  <rect x="450" y="214" width="170" height="62" rx="10" fill="#f8f9fa" stroke="#adb5bd"/>
  <text x="535" y="238" font-size="12.5" font-weight="700" fill="#495057" text-anchor="middle">② cudaMalloc 新段</text>
  <text x="535" y="258" font-size="11" fill="#868e96" text-anchor="middle">驱动层剩余不足：失败</text>
  <path d="M620 245 L646 245" stroke="#c92a2a" stroke-width="2" marker-end="url(#arRed)"/>
  <rect x="652" y="214" width="188" height="62" rx="10" fill="#fff5f5" stroke="#fa5252"/>
  <text x="746" y="238" font-size="12.5" font-weight="700" fill="#c92a2a" text-anchor="middle">③ 归还空闲段后重试</text>
  <text x="746" y="258" font-size="11" fill="#495057" text-anchor="middle">本段有活跃 block，还不掉 → OOM</text>

  <!-- Row B: expandable segments -->
  <text x="40" y="318" font-size="13.5" font-weight="700" fill="#212529">expandable_segments:True：一段预留的虚拟地址，物理页按需映射到段尾</text>
  <rect x="40" y="330" width="800" height="54" rx="8" fill="#f8f9fa" stroke="#adb5bd"/>
  <rect x="42" y="332" width="118" height="50" rx="6" fill="#edf2ff" stroke="#4c6ef5"/>
  <text x="101" y="361" font-size="12" font-weight="700" fill="#3b5bdb" text-anchor="middle">活跃 3 MB</text>
  <rect x="162" y="332" width="76" height="50" rx="6" fill="#ffffff" stroke="#adb5bd" stroke-dasharray="4 3"/>
  <text x="200" y="361" font-size="11.5" fill="#868e96" text-anchor="middle">空 2 MB</text>
  <rect x="242" y="332" width="156" height="50" rx="6" fill="#edf2ff" stroke="#4c6ef5"/>
  <text x="320" y="361" font-size="12" font-weight="700" fill="#3b5bdb" text-anchor="middle">活跃 4 MB</text>
  <rect x="402" y="332" width="236" height="50" rx="6" fill="#e6fcf5" stroke="#0ca678"/>
  <text x="520" y="354" font-size="12" font-weight="700" fill="#0b7285" text-anchor="middle">新 6 MB：接在段尾</text>
  <text x="520" y="372" font-size="11" fill="#495057" text-anchor="middle">只映射新物理页，地址连续</text>
  <rect x="642" y="332" width="196" height="50" rx="6" fill="#ffffff" stroke="#0ca678" stroke-dasharray="4 3"/>
  <text x="740" y="354" font-size="11.5" fill="#0b7285" text-anchor="middle">未映射的虚拟地址</text>
  <text x="740" y="372" font-size="11" fill="#868e96" text-anchor="middle">段尾空闲页可解除映射归还</text>
  <text x="440" y="408" font-size="12" fill="#495057" text-anchor="middle">尺寸多变的分配不必各开一段；但段内中间的空洞依旧存在，它减轻碎片而不是消除碎片</text>

  <!-- Note strip -->
  <rect x="40" y="428" width="800" height="70" rx="8" fill="#f8f9fa" stroke="#e9ecef"/>
  <text x="56" y="452" font-size="12" font-weight="700" fill="#212529">关键</text>
  <text x="96" y="452" font-size="12" fill="#495057">segment 只有在完全空闲时才能整体还给驱动；一个长寿的小张量就能钉住一整段。</text>
  <text x="96" y="472" font-size="12" fill="#495057">empty_cache() 同样只能归还完全空闲的段。max_split_size_mb 禁止切分超过阈值的大 block，</text>
  <text x="96" y="490" font-size="12" fill="#495057">让大块留给大请求——三者都作用在分配器层，不改变活跃张量本身占用多少。</text>
</svg>
