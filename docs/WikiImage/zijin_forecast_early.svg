<text x="48.0" y="514.0" font-size="12" fill="#495057" text-anchor="start">2022—2023 年预测随铜价、锂价回落逐次下调，2023 年预测从 316 亿元降到 220 亿元，实际 211 亿元；2025 年预测在 2023-10 低到 300 亿元，金</text>
<text x="48.0" y="532.0" font-size="12" fill="#495057" text-anchor="start">价上涨后一路上调到 519 亿元，实际 517.8 亿元。最后一次预测都接近实际，研报更多是在跟随商品价格修正。</text>
<text x="48.0" y="550.0" font-size="12" fill="#495057" text-anchor="start">来源：东方财富研报中心民生证券报告摘要；实际值取自公司年报（F10），画在年报披露日。</text>
