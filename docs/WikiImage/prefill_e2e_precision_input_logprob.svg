<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 570" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="570" rx="12" fill="#ffffff"/>
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#868e96"/>
    </marker>
    <marker id="arR" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#fa5252"/>
    </marker>
  </defs>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#212529">一次 prefill 如何给每个输入 token 算出 logprob</text>
  <text x="450" y="56" text-anchor="middle" font-size="13" fill="#868e96">输入 6 个 token，logprob_start_len = 0；位置 j 的输出预测的是下一个 token x[j+1]</text>

  <!-- words -->
  <text x="245" y="82" text-anchor="middle" font-size="11" fill="#868e96">The</text>
  <text x="349" y="82" text-anchor="middle" font-size="11" fill="#868e96">capital</text>
  <text x="453" y="82" text-anchor="middle" font-size="11" fill="#868e96">of</text>
  <text x="557" y="82" text-anchor="middle" font-size="11" fill="#868e96">France</text>
  <text x="661" y="82" text-anchor="middle" font-size="11" fill="#868e96">is</text>
  <text x="765" y="82" text-anchor="middle" font-size="11" fill="#868e96">Paris</text>

  <!-- row labels -->
  <text x="30" y="104" font-size="12.5" font-weight="700" fill="#3b5bdb">input_ids</text>
  <text x="30" y="118" font-size="10.5" fill="#868e96">一次 forward 全部送入</text>
  <text x="30" y="168" font-size="12.5" font-weight="700" fill="#0b7285">hidden h_j</text>
  <text x="30" y="182" font-size="10.5" fill="#868e96">causal：只看过 x[0..j]</text>
  <text x="30" y="232" font-size="12.5" font-weight="700" fill="#5f3dc4">lm_head → 分布</text>
  <text x="30" y="246" font-size="10.5" fill="#868e96">每行一个 V 维 logits</text>
  <text x="30" y="296" font-size="12.5" font-weight="700" fill="#e8590c">gather 的 token id</text>
  <text x="30" y="310" font-size="10.5" font-family="monospace" fill="#868e96">origin_input_ids[j+1]</text>
  <text x="30" y="360" font-size="12.5" font-weight="700" fill="#495057">GPU 侧 logprob</text>
  <text x="30" y="374" font-size="10.5" fill="#868e96">每行取 1 个数</text>
  <text x="30" y="444" font-size="12.5" font-weight="700" fill="#3b5bdb">返回 input_token_</text>
  <text x="30" y="458" font-size="12.5" font-weight="700" fill="#3b5bdb">logprobs</text>
  <text x="96" y="458" font-size="10.5" fill="#868e96">右移对齐到 x[j+1]</text>

