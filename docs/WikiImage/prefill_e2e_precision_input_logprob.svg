  <rect x="30" y="486" width="840" height="68" rx="10" fill="#f8f9fa" stroke="#e9ecef"/>
  <text x="48" y="510" font-size="12" fill="#495057">位置 j 的 hidden 已经看过 x[0..j]，所以第 j 行分布打分的是下一个输入 x[j+1]：错开一位 gather，再右移一位挂回 x[j+1]。</text>
  <text x="48" y="530" font-size="12" fill="#495057">第一个 token 没有上文，返回 None；最后一行没有“下一个输入”，它的 logits 用来采样第一个输出 token。</text>
  <text x="48" y="546" font-size="11" fill="#868e96">logprob = logit[x] − logsumexp(logits)，直接用模型原始 logits，不经过 temperature / top-p 等采样变换。</text>
