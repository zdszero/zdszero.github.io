<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="600" rx="12" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#212529">hidden states 发送能否和下一次 forward 重叠</text>
  <text x="450" y="56" text-anchor="middle" font-size="13" fill="#868e96">rank k 连续处理 mb j−1、j；代码里 commit(send j−1) 排在 launch(j) 之前，差别在 GPU stream 上</text>

  <!-- Panel A: default -->
  <rect x="30" y="72" width="840" height="200" rx="10" fill="#f8f9fa" stroke="#e9ecef"/>
  <text x="44" y="96" font-size="13" font-weight="700" fill="#212529">默认（SGLANG_PP_COMM_OVERLAP=0）：send / recv / wait 都排在 schedule_stream 上</text>
  <g font-size="11.5" fill="#495057">
    <text x="44" y="134">rank k · forward_stream</text>
    <text x="44" y="174">rank k · schedule_stream</text>
    <text x="44" y="214">rank k+1</text>
  </g>
  <g font-size="12" font-weight="600" text-anchor="middle">
    <rect x="230" y="114" width="200" height="30" rx="6" fill="#edf2ff" stroke="#4c6ef5"/><text x="330" y="134" fill="#3b5bdb">fwd j−1</text>
    <rect x="540" y="114" width="200" height="30" rx="6" fill="#edf2ff" stroke="#4c6ef5"/><text x="640" y="134" fill="#3b5bdb">fwd j</text>
    <rect x="430" y="154" width="110" height="30" rx="6" fill="#e6fcf5" stroke="#0ca678"/><text x="485" y="174" fill="#0b7285">send j−1</text>
    <rect x="740" y="154" width="110" height="30" rx="6" fill="#e6fcf5" stroke="#0ca678"/><text x="795" y="174" fill="#0b7285">send j</text>
    <rect x="430" y="194" width="110" height="30" rx="6" fill="#fff4e6" stroke="#f08c00"/><text x="485" y="214" fill="#e8590c">recv j−1</text>
    <rect x="540" y="194" width="200" height="30" rx="6" fill="#edf2ff" stroke="#4c6ef5"/><text x="640" y="214" fill="#3b5bdb">fwd j−1</text>
  </g>
  <path d="M540 108 L540 190" stroke="#fa5252" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="456" y="110" font-size="10.5" fill="#c92a2a">fwd j 等 send j−1</text>
  <text x="44" y="252" font-size="11.5" fill="#495057">launch 前 forward_stream.wait_stream(schedule_stream) ⇒ 同 rank 上 send 与下一次 forward 串行；</text>
  <text x="44" y="266" font-size="11.5" fill="#868e96">并行来自 CPU/GPU 重叠和跨 rank 流水（rank k 算 j 时 rank k+1 在算 j−1）</text>

  <!-- Panel B: overlap -->
  <rect x="30" y="284" width="840" height="200" rx="10" fill="#f8f9fa" stroke="#e9ecef"/>
  <text x="44" y="308" font-size="13" font-weight="700" fill="#212529">开启 SGLANG_PP_COMM_OVERLAP=1：send / recv 放到独立的 pp_comm_stream</text>
  <g font-size="11.5" fill="#495057">
    <text x="44" y="346">rank k · forward_stream</text>
    <text x="44" y="386">rank k · pp_comm_stream</text>
    <text x="44" y="426">rank k+1</text>
  </g>
  <g font-size="12" font-weight="600" text-anchor="middle">
    <rect x="230" y="326" width="200" height="30" rx="6" fill="#edf2ff" stroke="#4c6ef5"/><text x="330" y="346" fill="#3b5bdb">fwd j−1</text>
    <rect x="430" y="326" width="200" height="30" rx="6" fill="#edf2ff" stroke="#4c6ef5"/><text x="530" y="346" fill="#3b5bdb">fwd j</text>
    <rect x="630" y="326" width="200" height="30" rx="6" fill="#edf2ff" stroke="#4c6ef5"/><text x="730" y="346" fill="#3b5bdb">fwd j+1</text>
    <rect x="430" y="366" width="110" height="30" rx="6" fill="#e6fcf5" stroke="#0ca678"/><text x="485" y="386" fill="#0b7285">send j−1</text>
    <rect x="630" y="366" width="110" height="30" rx="6" fill="#e6fcf5" stroke="#0ca678"/><text x="685" y="386" fill="#0b7285">send j</text>
    <rect x="430" y="406" width="110" height="30" rx="6" fill="#fff4e6" stroke="#f08c00"/><text x="485" y="426" fill="#e8590c">recv j−1</text>
    <rect x="540" y="406" width="200" height="30" rx="6" fill="#edf2ff" stroke="#4c6ef5"/><text x="640" y="426" fill="#3b5bdb">fwd j−1</text>
  </g>
  <text x="44" y="464" font-size="11.5" fill="#495057">eager forward 不等 send：fwd j 与 send j−1 在 GPU 上同时进行；</text>
  <text x="44" y="478" font-size="11.5" fill="#868e96">例外：j−1 跑的是 CUDA graph（输出在静态 buffer，下次 replay 会覆写）⇒ commit 记录 pp_send_done_event，fwd j 等它</text>

  <!-- legend -->
  <g font-size="11.5">
    <rect x="44" y="498" width="14" height="10" rx="2" fill="#4c6ef5"/><text x="64" y="508" fill="#495057">forward</text>
    <rect x="140" y="498" width="14" height="10" rx="2" fill="#0ca678"/><text x="160" y="508" fill="#495057">NCCL send（ready_event=launch_event）</text>
    <rect x="420" y="498" width="14" height="10" rx="2" fill="#f08c00"/><text x="440" y="508" fill="#495057">NCCL recv</text>
    <path d="M540 503 L560 503" stroke="#fa5252" stroke-width="1.5" stroke-dasharray="4 3"/><text x="566" y="508" fill="#495057">GPU 上的 stream 依赖</text>
  </g>

  <rect x="30" y="524" width="840" height="62" rx="8" fill="#f8f9fa" stroke="#e9ecef"/>
  <text x="450" y="546" text-anchor="middle" font-size="12" fill="#495057">commit(j−1) 不阻塞 CPU：NCCL 的 work.wait() 只让当前 stream 等待；CPU 只会被 CPU 组上的元数据收发卡住</text>
  <text x="450" y="566" text-anchor="middle" font-size="12" fill="#495057">commit 保护的是 send buffer 的生命周期（P2PWork 持有引用、CUDA graph 静态 buffer）</text>
  <text x="450" y="580" text-anchor="middle" font-size="12" fill="#868e96">下游有没有收到，由它自己的阻塞 recv 保证</text>
</svg>
