  <text x="858.75" y="180" font-size="10" fill="#5f3dc4" text-anchor="middle" font-family="monospace">3</text>
  <text x="150" y="210" font-size="11" fill="#495057">token_idx % p 逐个分配：天然均衡，但 all-gather 回来的数据是交错的，需要重排</text>
  <text x="30" y="250" font-size="12.5" fill="#212529" font-weight="700">一层的流程</text>
  <rect x="30" y="262" width="196" height="118" rx="10" fill="#edf2ff" stroke="#4c6ef5" stroke-width="1"/>
  <text x="44" y="286" font-size="13" fill="#3b5bdb" font-weight="700">① 切分输入</text>
  <text x="44" y="310" font-size="11.5" fill="#495057">每个 rank 约 1/p 的 token</text>
  <text x="44" y="330" font-size="11.5" fill="#495057">embedding / norm / QKV 投影</text>
  <path d="M228 321 L242 321" stroke="#868e96" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <rect x="244" y="262" width="196" height="118" rx="10" fill="#fff4e6" stroke="#f08c00" stroke-width="1"/>
  <text x="258" y="286" font-size="13" fill="#e8590c" font-weight="700">② all-gather KV</text>
  <text x="258" y="310" font-size="11.5" fill="#495057">MLA latent（576 维）</text>
  <text x="258" y="330" font-size="11.5" fill="#495057">+ indexer key（bf16，量化前）</text>
  <text x="258" y="350" font-size="11.5" fill="#495057">pad → gather → 去 pad 重排</text>
  <path d="M442 321 L456 321" stroke="#868e96" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <rect x="458" y="262" width="196" height="118" rx="10" fill="#e6fcf5" stroke="#0ca678" stroke-width="1"/>
  <text x="472" y="286" font-size="13" fill="#0b7285" font-weight="700">③ 本地计算</text>
  <text x="472" y="310" font-size="11.5" fill="#495057">本地 Q × 完整 KV</text>
  <text x="472" y="330" font-size="11.5" fill="#495057">indexer → top-k → sparse MLA</text>
  <text x="472" y="350" font-size="11.5" fill="#495057">rank 之间不再通信</text>
  <path d="M656 321 L670 321" stroke="#868e96" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <rect x="672" y="262" width="196" height="118" rx="10" fill="#f3f0ff" stroke="#7048e8" stroke-width="1"/>
  <text x="686" y="286" font-size="13" fill="#5f3dc4" font-weight="700">④ 拼回输出</text>
  <text x="686" y="310" font-size="11.5" fill="#495057">最后一层后 hidden state</text>
  <text x="686" y="330" font-size="11.5" fill="#495057">all-gather + 重排</text>
  <rect x="30" y="400" width="412" height="76" rx="10" fill="#f8f9fa" stroke="#495057" stroke-width="1"/>
  <text x="44" y="422" font-size="12.5" fill="#495057" font-weight="700">Ring Attention（通用 CP）</text>
  <text x="44" y="444" font-size="11.5" fill="#495057">KV 分块绕环传 p − 1 轮，每轮算部分 attention 再合并</text>
  <text x="44" y="462" font-size="11.5" fill="#495057">top-k 选中的 token 散落各处，很难按轮次组织</text>
  <rect x="458" y="400" width="412" height="76" rx="10" fill="#fff4e6" stroke="#e8590c" stroke-width="1"/>
  <text x="472" y="422" font-size="12.5" fill="#e8590c" font-weight="700">AllGather CP（DSA 用的）</text>
  <text x="472" y="444" font-size="11.5" fill="#495057">一次 all-gather 收齐全部 KV，然后本地做完整 attention</text>
  <text x="472" y="462" font-size="11.5" fill="#495057">可行的前提：MLA latent 只有 576 维，约为 MHA 的 1/71</text>
  <rect x="30" y="492" width="840" height="56" rx="8" fill="#f8f9fa" stroke="#e9ecef" stroke-width="1"/>
  <text x="46" y="514" font-size="12" fill="#495057">indexer 必须先跨 head 求和、再取 top-k：按 head 切（TP）要 all-reduce (T, S) 的 logits，是 O(S²)；</text>
  <text x="46" y="532" font-size="12" fill="#495057">按序列切（CP）只需 all-gather 每个 token 128 维的 index key，是 O(S)。所以 DSA 用 CP 扩展 prefill。</text>
</svg>
