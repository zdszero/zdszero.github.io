  <rect x="646.0" y="158" width="20.5" height="34" rx="3" fill="#fff4e6" stroke="#f08c00" stroke-width="1"/>
  <text x="656.25" y="180" font-size="10" fill="#e8590c" text-anchor="middle" font-family="monospace">2</text>
  <rect x="668.5" y="158" width="20.5" height="34" rx="3" fill="#f3f0ff" stroke="#7048e8" stroke-width="1"/>
