  <text x="150" y="136" font-size="11" fill="#495057">切成 2p 块，rank r 拿第 r 块和第 2p−1−r 块：平均 KV 长度之和恒为 N，每个 rank 的计算量相同</text>
  <text x="30" y="170" font-size="12.5" fill="#212529" font-weight="700">interleave</text>
  <text x="30" y="186" font-size="10.5" fill="#868e96">（round-robin）</text>
