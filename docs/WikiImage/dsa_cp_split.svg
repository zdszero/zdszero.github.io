  <text x="791.25" y="180" font-size="10" fill="#3b5bdb" text-anchor="middle" font-family="monospace">0</text>
  <rect x="803.5" y="158" width="20.5" height="34" rx="3" fill="#e6fcf5" stroke="#0ca678" stroke-width="1"/>
  <text x="813.75" y="180" font-size="10" fill="#0b7285" text-anchor="middle" font-family="monospace">1</text>
  <rect x="826.0" y="158" width="20.5" height="34" rx="3" fill="#fff4e6" stroke="#f08c00" stroke-width="1"/>
  <text x="836.25" y="180" font-size="10" fill="#e8590c" text-anchor="middle" font-family="monospace">2</text>
