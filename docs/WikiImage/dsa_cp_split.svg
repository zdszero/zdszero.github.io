  <text x="431.25" y="180" font-size="10" fill="#3b5bdb" text-anchor="middle" font-family="monospace">0</text>
  <rect x="443.5" y="158" width="20.5" height="34" rx="3" fill="#e6fcf5" stroke="#0ca678" stroke-width="1"/>
  <text x="453.75" y="180" font-size="10" fill="#0b7285" text-anchor="middle" font-family="monospace">1</text>
  <rect x="466.0" y="158" width="20.5" height="34" rx="3" fill="#fff4e6" stroke="#f08c00" stroke-width="1"/>
  <text x="476.25" y="180" font-size="10" fill="#e8590c" text-anchor="middle" font-family="monospace">2</text>
  <rect x="488.5" y="158" width="20.5" height="34" rx="3" fill="#f3f0ff" stroke="#7048e8" stroke-width="1"/>
  <text x="498.75" y="180" font-size="10" fill="#5f3dc4" text-anchor="middle" font-family="monospace">3</text>
  <rect x="511.0" y="158" width="20.5" height="34" rx="3" fill="#edf2ff" stroke="#4c6ef5" stroke-width="1"/>
  <text x="521.25" y="180" font-size="10" fill="#3b5bdb" text-anchor="middle" font-family="monospace">0</text>
  <rect x="533.5" y="158" width="20.5" height="34" rx="3" fill="#e6fcf5" stroke="#0ca678" stroke-width="1"/>
  <text x="543.75" y="180" font-size="10" fill="#0b7285" text-anchor="middle" font-family="monospace">1</text>
  <rect x="556.0" y="158" width="20.5" height="34" rx="3" fill="#fff4e6" stroke="#f08c00" stroke-width="1"/>
  <text x="566.25" y="180" font-size="10" fill="#e8590c" text-anchor="middle" font-family="monospace">2</text>
