  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#212529">CP 怎么切 Q，以及一层的流程</text>
  <text x="450" y="56" text-anchor="middle" font-size="13" fill="#868e96">p = 4。因果 mask 下越靠后的 query 越贵，所以要把前后配对或交错分配</text>
  <text x="30" y="96" font-size="12.5" fill="#212529" font-weight="700">zigzag</text>
  <text x="30" y="112" font-size="10.5" fill="#868e96">（in-seq-split）</text>
