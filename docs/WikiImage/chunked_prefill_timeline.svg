<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#868e96"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="500" rx="12" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#212529">一个 32K prompt 到来时，GPU 时间线上发生了什么</text>
  <text x="450" y="56" text-anchor="middle" font-size="13" fill="#868e96">同一批 decode 请求正在逐 token 生成；比较三种处理长 prefill 的方式</text>

  <!-- legend -->
  <rect x="640" y="74" width="14" height="10" rx="2" fill="#edf2ff" stroke="#4c6ef5"/>
  <text x="660" y="83" font-size="11" fill="#495057">prefill tokens</text>
  <rect x="750" y="74" width="14" height="10" rx="2" fill="#e6fcf5" stroke="#0ca678"/>
  <text x="770" y="83" font-size="11" fill="#495057">decode step</text>

  <!-- Lane A -->
  <text x="60" y="96" font-size="13.5" font-weight="700" fill="#343a40">① 不切分：一次 forward 算完</text>
  <rect x="60" y="106" width="34" height="38" rx="6" fill="#e6fcf5" stroke="#0ca678"/>
  <rect x="100" y="106" width="34" height="38" rx="6" fill="#e6fcf5" stroke="#0ca678"/>
  <rect x="140" y="106" width="34" height="38" rx="6" fill="#e6fcf5" stroke="#0ca678"/>
  <rect x="180" y="106" width="480" height="38" rx="8" fill="#edf2ff" stroke="#4c6ef5"/>
  <text x="420" y="130" text-anchor="middle" font-size="12.5" font-weight="700" fill="#3b5bdb">32K token prefill：一次 forward</text>
  <rect x="666" y="106" width="34" height="38" rx="6" fill="#e6fcf5" stroke="#0ca678"/>
  <rect x="706" y="106" width="34" height="38" rx="6" fill="#e6fcf5" stroke="#0ca678"/>
  <rect x="746" y="106" width="34" height="38" rx="6" fill="#e6fcf5" stroke="#0ca678"/>
  <rect x="786" y="106" width="34" height="38" rx="6" fill="#e6fcf5" stroke="#0ca678"/>
  <path d="M180 150 L180 156 L660 156 L660 150" fill="none" stroke="#fa5252" stroke-width="1.5"/>
  <text x="420" y="173" text-anchor="middle" font-size="11.5" fill="#c92a2a">decode 停摆一整个长 forward（ITL 尖刺）；activation 峰值 ∝ 32K</text>
  <!-- Lane B -->
  <text x="60" y="206" font-size="13.5" font-weight="700" fill="#343a40">② 只切分（chunked prefill，不开 mixed）</text>
  <rect x="60" y="216" width="34" height="38" rx="6" fill="#e6fcf5" stroke="#0ca678"/>
  <rect x="100" y="216" width="34" height="38" rx="6" fill="#e6fcf5" stroke="#0ca678"/>
  <rect x="140" y="216" width="34" height="38" rx="6" fill="#e6fcf5" stroke="#0ca678"/>
  <rect x="180" y="216" width="117" height="38" rx="8" fill="#edf2ff" stroke="#4c6ef5"/>
  <text x="238" y="240" text-anchor="middle" font-size="12.5" font-weight="700" fill="#3b5bdb">chunk 1</text>
  <rect x="301" y="216" width="117" height="38" rx="8" fill="#edf2ff" stroke="#4c6ef5"/>
  <text x="359" y="240" text-anchor="middle" font-size="12.5" font-weight="700" fill="#3b5bdb">chunk 2</text>
  <rect x="422" y="216" width="117" height="38" rx="8" fill="#edf2ff" stroke="#4c6ef5"/>
  <text x="480" y="240" text-anchor="middle" font-size="12.5" font-weight="700" fill="#3b5bdb">chunk 3</text>
  <rect x="543" y="216" width="117" height="38" rx="8" fill="#edf2ff" stroke="#4c6ef5"/>
  <text x="601" y="240" text-anchor="middle" font-size="12.5" font-weight="700" fill="#3b5bdb">chunk 4</text>
  <rect x="666" y="216" width="34" height="38" rx="6" fill="#e6fcf5" stroke="#0ca678"/>
  <rect x="706" y="216" width="34" height="38" rx="6" fill="#e6fcf5" stroke="#0ca678"/>
  <rect x="746" y="216" width="34" height="38" rx="6" fill="#e6fcf5" stroke="#0ca678"/>
  <rect x="786" y="216" width="34" height="38" rx="6" fill="#e6fcf5" stroke="#0ca678"/>
  <path d="M180 260 L180 266 L660 266 L660 260" fill="none" stroke="#f08c00" stroke-width="1.5"/>
  <text x="420" y="283" text-anchor="middle" font-size="11.5" fill="#e8590c">单次 forward 与 activation 被 chunk 封顶；但 prefill 优先，decode 仍要等完所有 chunk</text>

  <!-- Lane C -->
  <text x="60" y="316" font-size="13.5" font-weight="700" fill="#343a40">③ 切分 + mixed chunk（enable_mixed_chunk）</text>
  <rect x="60" y="326" width="34" height="42" rx="6" fill="#e6fcf5" stroke="#0ca678"/>
  <rect x="100" y="326" width="34" height="42" rx="6" fill="#e6fcf5" stroke="#0ca678"/>
  <rect x="140" y="326" width="34" height="42" rx="6" fill="#e6fcf5" stroke="#0ca678"/>
  <rect x="180" y="326" width="117" height="25" rx="6" fill="#edf2ff" stroke="#4c6ef5"/>
  <text x="238" y="343" text-anchor="middle" font-size="12" font-weight="700" fill="#3b5bdb">chunk 1</text>
  <rect x="180" y="354" width="117" height="14" rx="4" fill="#e6fcf5" stroke="#0ca678"/>
  <text x="238" y="365" text-anchor="middle" font-size="9.5" fill="#0b7285">+ decode ×B</text>
  <rect x="301" y="326" width="117" height="25" rx="6" fill="#edf2ff" stroke="#4c6ef5"/>
  <text x="359" y="343" text-anchor="middle" font-size="12" font-weight="700" fill="#3b5bdb">chunk 2</text>
  <rect x="301" y="354" width="117" height="14" rx="4" fill="#e6fcf5" stroke="#0ca678"/>
  <text x="359" y="365" text-anchor="middle" font-size="9.5" fill="#0b7285">+ decode ×B</text>
  <rect x="422" y="326" width="117" height="25" rx="6" fill="#edf2ff" stroke="#4c6ef5"/>
  <text x="480" y="343" text-anchor="middle" font-size="12" font-weight="700" fill="#3b5bdb">chunk 3</text>
  <rect x="422" y="354" width="117" height="14" rx="4" fill="#e6fcf5" stroke="#0ca678"/>
  <text x="480" y="365" text-anchor="middle" font-size="9.5" fill="#0b7285">+ decode ×B</text>
  <rect x="543" y="326" width="117" height="25" rx="6" fill="#edf2ff" stroke="#4c6ef5"/>
  <text x="601" y="343" text-anchor="middle" font-size="12" font-weight="700" fill="#3b5bdb">chunk 4</text>
  <rect x="543" y="354" width="117" height="14" rx="4" fill="#e6fcf5" stroke="#0ca678"/>
  <text x="601" y="365" text-anchor="middle" font-size="9.5" fill="#0b7285">+ decode ×B</text>
  <rect x="666" y="326" width="34" height="42" rx="6" fill="#e6fcf5" stroke="#0ca678"/>
  <rect x="706" y="326" width="34" height="42" rx="6" fill="#e6fcf5" stroke="#0ca678"/>
  <rect x="746" y="326" width="34" height="42" rx="6" fill="#e6fcf5" stroke="#0ca678"/>
  <rect x="786" y="326" width="34" height="42" rx="6" fill="#e6fcf5" stroke="#0ca678"/>
  <text x="420" y="388" text-anchor="middle" font-size="11.5" fill="#0b7285">每一步 decode 都在前进：chunk 的 prefill tokens 与 B 个 decode token 共享一次 forward</text>

  <!-- time axis -->
  <path d="M60 404 L800 404" fill="none" stroke="#868e96" stroke-width="2" marker-end="url(#ar)"/>
  <text x="814" y="408" font-size="11" fill="#868e96">时间</text>

  <!-- note -->
  <rect x="60" y="420" width="780" height="64" rx="10" fill="#f8f9fa" stroke="#e9ecef"/>
  <text x="78" y="445" font-size="12" fill="#495057">关键：切分本身只把「一次 forward 的规模」封顶（显存峰值、单步时长）；真正让 decode 不被饿死的，</text>
  <text x="78" y="466" font-size="12" fill="#495057">是把 chunk 与 decode 拼进同一次 forward。两者叠加，长 prompt 才不再是一堵墙。</text>
</svg>
