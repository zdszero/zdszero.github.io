<text x="48.0" y="642.0" font-size="12" fill="#495057" text-anchor="start">2020Q3 单季利润同比 +32% 是这一轮最高，2021-01-25 股价见顶；随后增速降到 2021Q4 的 −25%。2023Q4—2024Q1 增速到 +44%、+54%，股价反</text>
<text x="48.0" y="660.0" font-size="12" fill="#495057" text-anchor="start">而在 2024-01-22 见底；第二次上涨期间增速从 +53% 降到 2025Q2 的 +10%，股价在增速回落中涨了 1.6 倍，见顶后单季利润才在 2026Q3 转为 −6%。</text>
<text x="48.0" y="678.0" font-size="12" fill="#495057" text-anchor="start">来源：公司季度业绩公告（Non-IFRS 本公司权益持有人应占盈利）；股价为腾讯证券港股日 K。</text>
