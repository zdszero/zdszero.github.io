  <text x="618" y="152" font-size="10.5" font-weight="700" fill="#c92a2a">不用 PXN：多 2 跳</text>
  <!-- legend -->
  <rect x="40" y="454" width="820" height="88" rx="10" fill="#ffffff" stroke="#e9ecef"/>
  <path d="M58 476 L92 476" stroke="#0ca678" stroke-width="3.5"/>
  <text x="102" y="480" font-size="12" fill="#495057"><tspan font-weight="700" fill="#0b7285">同号：</tspan>A.GPU3 → NIC3 → rail 3 → B.NIC3 → B.GPU3，只经过 1 台 Leaf</text>
  <path d="M58 502 L92 502" stroke="#fa5252" stroke-width="2.5" stroke-dasharray="6 4"/>
  <text x="102" y="506" font-size="12" fill="#495057"><tspan font-weight="700" fill="#c92a2a">异号，直接发：</tspan>A.GPU3 → NIC3 → rail 3 → Spine → rail 5 → B.GPU5，3 台交换机，还可能撞上 ECMP 冲突</text>
  <path d="M58 528 L92 528" stroke="#f08c00" stroke-width="3.5"/>
  <text x="102" y="532" font-size="12" fill="#495057"><tspan font-weight="700" fill="#e8590c">异号，PXN：</tspan>① A.GPU3 经 NVLink 交给 A.GPU5，② 由 NIC5 沿 rail 5 一跳到 B.GPU5</text>

  <!-- note -->
  <rect x="40" y="550" width="820" height="30" rx="8" fill="#f8f9fa" stroke="#e9ecef"/>
  <text x="450" y="570" text-anchor="middle" font-size="12" fill="#495057">NVLink 比网卡快一个数量级：多走一段节点内路径，换来跨机只走一跳</text>
</svg>
