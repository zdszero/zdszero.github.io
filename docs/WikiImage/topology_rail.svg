<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 590" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="590" rx="12" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#212529">Rail-optimized：同号 GPU 一跳可达，异号 GPU 用 NVLink 换 rail</text>
  <text x="450" y="56" text-anchor="middle" font-size="13" fill="#868e96">所有服务器的第 i 号网卡接到同一台（组）Leaf，这台 Leaf 就是第 i 条 rail</text>

  <!-- spine -->
  <rect x="40" y="78" width="820" height="36" rx="8" fill="#f3f0ff" stroke="#7048e8"/>
  <text x="450" y="101" text-anchor="middle" font-size="12.5" font-weight="700" fill="#5f3dc4">Spine 层（跨 rail、跨 SU 的流量才上来）</text>
  <g stroke="#d0bfff" stroke-width="2">
    <path d="M80 114 L80 176"/><path d="M186 114 L186 176"/><path d="M292 114 L292 176"/><path d="M398 114 L398 176"/>
    <path d="M504 114 L504 176"/><path d="M610 114 L610 176"/><path d="M716 114 L716 176"/><path d="M822 114 L822 176"/>
  </g>

  <!-- leaf -> NIC wiring (gray) -->
  <g stroke="#ced4da" stroke-width="1.3">
    <path d="M80 210 L70 316"/><path d="M186 210 L117 316"/><path d="M292 210 L164 316"/><path d="M398 210 L211 316"/>
    <path d="M504 210 L258 316"/><path d="M610 210 L305 316"/><path d="M716 210 L352 316"/><path d="M822 210 L399 316"/>
    <path d="M80 210 L500 316"/><path d="M186 210 L547 316"/><path d="M292 210 L594 316"/><path d="M398 210 L641 316"/>
    <path d="M504 210 L688 316"/><path d="M610 210 L735 316"/><path d="M716 210 L782 316"/><path d="M822 210 L829 316"/>
  </g>

  <!-- highlighted paths -->
  <!-- no-PXN: via spine (red dashed) -->
  <path d="M398 176 L398 120 M398 120 L610 120 M610 120 L610 176" stroke="#fa5252" stroke-width="2.5" stroke-dasharray="6 4" fill="none"/>
  <!-- same rail: GPU3 -> rail3 -> GPU3 (teal) -->
  <path d="M211 316 L398 210 L641 316" stroke="#0ca678" stroke-width="3.5" fill="none"/>
  <!-- PXN: GPU5 -> rail5 -> GPU5 (amber) -->
  <path d="M305 316 L610 210 L735 316" stroke="#f08c00" stroke-width="3.5" fill="none"/>

  <!-- leaves -->
  <g font-size="11.5" font-weight="700" fill="#0b7285" text-anchor="middle">
    <rect x="40" y="176" width="80" height="34" rx="8" fill="#e6fcf5" stroke="#0ca678"/><text x="80" y="197">rail 0</text>
    <rect x="146" y="176" width="80" height="34" rx="8" fill="#e6fcf5" stroke="#0ca678"/><text x="186" y="197">rail 1</text>
    <rect x="252" y="176" width="80" height="34" rx="8" fill="#e6fcf5" stroke="#0ca678"/><text x="292" y="197">rail 2</text>
    <rect x="358" y="176" width="80" height="34" rx="8" fill="#e6fcf5" stroke="#0ca678" stroke-width="2"/><text x="398" y="197">rail 3</text>
    <rect x="464" y="176" width="80" height="34" rx="8" fill="#e6fcf5" stroke="#0ca678"/><text x="504" y="197">rail 4</text>
    <rect x="570" y="176" width="80" height="34" rx="8" fill="#e6fcf5" stroke="#0ca678" stroke-width="2"/><text x="610" y="197">rail 5</text>
    <rect x="676" y="176" width="80" height="34" rx="8" fill="#e6fcf5" stroke="#0ca678"/><text x="716" y="197">rail 6</text>
    <rect x="782" y="176" width="80" height="34" rx="8" fill="#e6fcf5" stroke="#0ca678"/><text x="822" y="197">rail 7</text>
  </g>
  <rect x="40" y="300" width="390" height="138" rx="10" fill="#f8f9fa" stroke="#adb5bd"/>
  <rect x="52" y="388" width="366" height="18" rx="4" fill="#e6fcf5" stroke="#0ca678"/>
  <text x="235" y="401" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0b7285">NVSwitch（节点内 NVLink）</text>
  <text x="54" y="428" font-size="12" font-weight="700" fill="#495057">服务器 A</text>
  <rect x="51" y="316" width="38" height="20" rx="4" fill="#fff4e6" stroke="#f08c00"/><text x="70" y="330" text-anchor="middle" font-size="9.5" fill="#e8590c">NIC0</text>
  <rect x="51" y="346" width="38" height="30" rx="5" fill="#edf2ff" stroke="#4c6ef5"/><text x="70" y="365" text-anchor="middle" font-size="10.5" font-weight="700" fill="#3b5bdb">GPU0</text>
  <path d="M70 336 L70 346" stroke="#adb5bd" stroke-width="1.5"/>
