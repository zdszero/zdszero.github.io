  <rect x="145" y="346" width="38" height="30" rx="5" fill="#edf2ff" stroke="#4c6ef5"/><text x="164" y="365" text-anchor="middle" font-size="10.5" font-weight="700" fill="#3b5bdb">GPU2</text>
  <path d="M164 336 L164 346" stroke="#adb5bd" stroke-width="1.5"/>
  <rect x="192" y="316" width="38" height="20" rx="4" fill="#fff4e6" stroke="#f08c00"/><text x="211" y="330" text-anchor="middle" font-size="9.5" fill="#e8590c">NIC3</text>
  <rect x="192" y="346" width="38" height="30" rx="5" fill="#edf2ff" stroke="#4c6ef5" stroke-width="2"/><text x="211" y="365" text-anchor="middle" font-size="10.5" font-weight="700" fill="#3b5bdb">GPU3</text>
  <path d="M211 336 L211 346" stroke="#adb5bd" stroke-width="1.5"/>
  <rect x="239" y="316" width="38" height="20" rx="4" fill="#fff4e6" stroke="#f08c00"/><text x="258" y="330" text-anchor="middle" font-size="9.5" fill="#e8590c">NIC4</text>
  <rect x="239" y="346" width="38" height="30" rx="5" fill="#edf2ff" stroke="#4c6ef5"/><text x="258" y="365" text-anchor="middle" font-size="10.5" font-weight="700" fill="#3b5bdb">GPU4</text>
