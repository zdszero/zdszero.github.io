  <rect x="286" y="316" width="38" height="20" rx="4" fill="#fff4e6" stroke="#f08c00"/><text x="305" y="330" text-anchor="middle" font-size="9.5" fill="#e8590c">NIC5</text>
  <rect x="286" y="346" width="38" height="30" rx="5" fill="#edf2ff" stroke="#4c6ef5" stroke-width="2"/><text x="305" y="365" text-anchor="middle" font-size="10.5" font-weight="700" fill="#3b5bdb">GPU5</text>
  <path d="M305 336 L305 346" stroke="#adb5bd" stroke-width="1.5"/>
  <rect x="333" y="316" width="38" height="20" rx="4" fill="#fff4e6" stroke="#f08c00"/><text x="352" y="330" text-anchor="middle" font-size="9.5" fill="#e8590c">NIC6</text>
  <rect x="333" y="346" width="38" height="30" rx="5" fill="#edf2ff" stroke="#4c6ef5"/><text x="352" y="365" text-anchor="middle" font-size="10.5" font-weight="700" fill="#3b5bdb">GPU6</text>
  <path d="M352 336 L352 346" stroke="#adb5bd" stroke-width="1.5"/>
  <rect x="380" y="316" width="38" height="20" rx="4" fill="#fff4e6" stroke="#f08c00"/><text x="399" y="330" text-anchor="middle" font-size="9.5" fill="#e8590c">NIC7</text>
  <rect x="380" y="346" width="38" height="30" rx="5" fill="#edf2ff" stroke="#4c6ef5"/><text x="399" y="365" text-anchor="middle" font-size="10.5" font-weight="700" fill="#3b5bdb">GPU7</text>
  <path d="M399 336 L399 346" stroke="#adb5bd" stroke-width="1.5"/>
  <rect x="470" y="300" width="390" height="138" rx="10" fill="#f8f9fa" stroke="#adb5bd"/>
  <rect x="482" y="388" width="366" height="18" rx="4" fill="#e6fcf5" stroke="#0ca678"/>
  <text x="665" y="401" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0b7285">NVSwitch（节点内 NVLink）</text>
  <text x="484" y="428" font-size="12" font-weight="700" fill="#495057">服务器 B</text>
  <rect x="481" y="316" width="38" height="20" rx="4" fill="#fff4e6" stroke="#f08c00"/><text x="500" y="330" text-anchor="middle" font-size="9.5" fill="#e8590c">NIC0</text>
  <rect x="481" y="346" width="38" height="30" rx="5" fill="#edf2ff" stroke="#4c6ef5"/><text x="500" y="365" text-anchor="middle" font-size="10.5" font-weight="700" fill="#3b5bdb">GPU0</text>
  <path d="M500 336 L500 346" stroke="#adb5bd" stroke-width="1.5"/>
  <rect x="528" y="316" width="38" height="20" rx="4" fill="#fff4e6" stroke="#f08c00"/><text x="547" y="330" text-anchor="middle" font-size="9.5" fill="#e8590c">NIC1</text>
  <rect x="528" y="346" width="38" height="30" rx="5" fill="#edf2ff" stroke="#4c6ef5"/><text x="547" y="365" text-anchor="middle" font-size="10.5" font-weight="700" fill="#3b5bdb">GPU1</text>
  <path d="M547 336 L547 346" stroke="#adb5bd" stroke-width="1.5"/>
  <rect x="575" y="316" width="38" height="20" rx="4" fill="#fff4e6" stroke="#f08c00"/><text x="594" y="330" text-anchor="middle" font-size="9.5" fill="#e8590c">NIC2</text>
  <rect x="575" y="346" width="38" height="30" rx="5" fill="#edf2ff" stroke="#4c6ef5"/><text x="594" y="365" text-anchor="middle" font-size="10.5" font-weight="700" fill="#3b5bdb">GPU2</text>
  <path d="M594 336 L594 346" stroke="#adb5bd" stroke-width="1.5"/>
  <rect x="622" y="316" width="38" height="20" rx="4" fill="#fff4e6" stroke="#f08c00"/><text x="641" y="330" text-anchor="middle" font-size="9.5" fill="#e8590c">NIC3</text>
  <rect x="622" y="346" width="38" height="30" rx="5" fill="#edf2ff" stroke="#4c6ef5" stroke-width="2"/><text x="641" y="365" text-anchor="middle" font-size="10.5" font-weight="700" fill="#3b5bdb">GPU3</text>
  <path d="M641 336 L641 346" stroke="#adb5bd" stroke-width="1.5"/>
  <rect x="669" y="316" width="38" height="20" rx="4" fill="#fff4e6" stroke="#f08c00"/><text x="688" y="330" text-anchor="middle" font-size="9.5" fill="#e8590c">NIC4</text>
  <rect x="669" y="346" width="38" height="30" rx="5" fill="#edf2ff" stroke="#4c6ef5"/><text x="688" y="365" text-anchor="middle" font-size="10.5" font-weight="700" fill="#3b5bdb">GPU4</text>
  <path d="M688 336 L688 346" stroke="#adb5bd" stroke-width="1.5"/>
  <rect x="716" y="316" width="38" height="20" rx="4" fill="#fff4e6" stroke="#f08c00"/><text x="735" y="330" text-anchor="middle" font-size="9.5" fill="#e8590c">NIC5</text>
  <rect x="716" y="346" width="38" height="30" rx="5" fill="#edf2ff" stroke="#4c6ef5" stroke-width="2"/><text x="735" y="365" text-anchor="middle" font-size="10.5" font-weight="700" fill="#3b5bdb">GPU5</text>
  <path d="M735 336 L735 346" stroke="#adb5bd" stroke-width="1.5"/>
  <rect x="763" y="316" width="38" height="20" rx="4" fill="#fff4e6" stroke="#f08c00"/><text x="782" y="330" text-anchor="middle" font-size="9.5" fill="#e8590c">NIC6</text>
  <rect x="763" y="346" width="38" height="30" rx="5" fill="#edf2ff" stroke="#4c6ef5"/><text x="782" y="365" text-anchor="middle" font-size="10.5" font-weight="700" fill="#3b5bdb">GPU6</text>
  <path d="M782 336 L782 346" stroke="#adb5bd" stroke-width="1.5"/>
  <rect x="810" y="316" width="38" height="20" rx="4" fill="#fff4e6" stroke="#f08c00"/><text x="829" y="330" text-anchor="middle" font-size="9.5" fill="#e8590c">NIC7</text>
  <rect x="810" y="346" width="38" height="30" rx="5" fill="#edf2ff" stroke="#4c6ef5"/><text x="829" y="365" text-anchor="middle" font-size="10.5" font-weight="700" fill="#3b5bdb">GPU7</text>
