<text x="48.0" y="704.0" font-size="12" fill="#495057" text-anchor="start">2022-12-30 到 2026-11-23，高速组 PE 中位数 9.8 → 16.8 倍，同期 10 年期国债 2.84% → 1.59%；高速股息率与国债的利差从约 4.1 个百分点收</text>
<text x="48.0" y="722.0" font-size="12" fill="#495057" text-anchor="start">窄到约 2.0 个百分点。</text>
<text x="48.0" y="740.0" font-size="12" fill="#495057" text-anchor="start">2022 年 7 月高速股息率跳升，是因为 2021 年度分红恢复（皖通每股 0.23 → 0.55 元、粤高速 0.29 → 0.57 元），而股价还在低位。2020 年高速</text>
<text x="48.0" y="758.0" font-size="12" fill="#495057" text-anchor="start">PE 偏高，是免费通行期压低了 TTM 利润。白酒相反：PE 33 → 22 倍，股息率 1.5% → 5.1%。</text>
