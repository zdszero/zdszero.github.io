<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 486" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="486" rx="12" fill="#ffffff"/>
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#868e96"/>
    </marker>
  </defs>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#212529">一层 GDN / KDA 的完整数据流</text>
  <text x="450" y="56" text-anchor="middle" font-size="13" fill="#868e96">两者骨架相同：投影 → 短卷积 → L2Norm → gated delta rule → 门控 Norm → 输出投影</text>

  <!-- stage headers -->
  <g font-size="12" font-weight="700" fill="#495057" text-anchor="middle">
    <text x="95" y="86">① 输入投影</text>
    <text x="237" y="86">② short conv</text>
    <text x="379" y="86">③ q/k L2Norm</text>
    <text x="521" y="86">④ gated delta rule</text>
    <text x="663" y="86">⑤ 门控 Norm</text>
    <text x="805" y="86">⑥ 输出投影</text>
  </g>

  <!-- GDN row -->
  <text x="30" y="110" font-size="12.5" font-weight="700" fill="#3b5bdb">Gated DeltaNet · Qwen3GatedDeltaNet（models/qwen3_next.py）</text>
  <g>
    <rect x="30" y="118" width="130" height="92" rx="8" fill="#edf2ff" stroke="#4c6ef5"/>
    <rect x="172" y="118" width="130" height="92" rx="8" fill="#edf2ff" stroke="#4c6ef5"/>
    <rect x="314" y="118" width="130" height="92" rx="8" fill="#edf2ff" stroke="#4c6ef5"/>
    <rect x="456" y="118" width="130" height="92" rx="8" fill="#fff9db" stroke="#f08c00"/>
    <rect x="598" y="118" width="130" height="92" rx="8" fill="#edf2ff" stroke="#4c6ef5"/>
    <rect x="740" y="118" width="130" height="92" rx="8" fill="#edf2ff" stroke="#4c6ef5"/>
  </g>
  <g font-size="10.5" fill="#495057">
    <text x="40" y="138" font-family="monospace">in_proj_qkvz</text>
    <text x="40" y="154">→ q, k, v, z</text>
    <text x="40" y="174" font-family="monospace">in_proj_ba</text>
    <text x="40" y="190">→ a, b（每 v-head 1 个）</text>
    <text x="182" y="138" font-family="monospace">causal_conv1d</text>
    <text x="182" y="154">kernel = 4，depthwise</text>
    <text x="182" y="174">作用于拼接的 q|k|v</text>
    <text x="182" y="190">后接 SiLU</text>
    <text x="324" y="138">q、k 单位化</text>
    <text x="324" y="154">在 kernel 内完成</text>
    <text x="324" y="174" font-family="monospace" font-size="9.5">use_qk_l2norm_in_</text>
    <text x="324" y="188" font-family="monospace" font-size="9.5">kernel=True</text>
    <text x="466" y="136" font-family="monospace">g = −exp(A_log)</text>
    <text x="466" y="151" font-family="monospace">  ·softplus(a+dt)</text>
    <text x="466" y="167" font-family="monospace">β = sigmoid(b)</text>
    <text x="466" y="185" font-weight="700" fill="#e8590c">标量门：每 head 1 个</text>
    <text x="466" y="201">GVA：HV ≥ HK</text>
    <text x="608" y="138" font-family="monospace">RMSNormGated(o, z)</text>
    <text x="608" y="154">输出门 z 来自</text>
    <text x="608" y="170" font-family="monospace">in_proj_qkvz</text>
    <text x="750" y="138" font-family="monospace">out_proj</text>
    <text x="750" y="154" font-family="monospace">RowParallelLinear</text>
  </g>

  <!-- KDA row -->
  <text x="30" y="242" font-size="12.5" font-weight="700" fill="#e8590c">KDA · KimiDeltaAttention（models/kimi_linear.py）</text>
  <g>
    <rect x="30" y="250" width="130" height="92" rx="8" fill="#fff4e6" stroke="#f08c00"/>
    <rect x="172" y="250" width="130" height="92" rx="8" fill="#fff4e6" stroke="#f08c00"/>
    <rect x="314" y="250" width="130" height="92" rx="8" fill="#fff4e6" stroke="#f08c00"/>
    <rect x="456" y="250" width="130" height="92" rx="8" fill="#fff9db" stroke="#f08c00"/>
    <rect x="598" y="250" width="130" height="92" rx="8" fill="#fff4e6" stroke="#f08c00"/>
    <rect x="740" y="250" width="130" height="92" rx="8" fill="#fff4e6" stroke="#f08c00"/>
  </g>
  <g font-size="10.5" fill="#495057">
    <text x="40" y="270" font-family="monospace" font-size="9.5">fused_qkvbfg_a_proj</text>
    <text x="40" y="286">→ q,k,v,β,f_a,g_a</text>
    <text x="40" y="306">f_b / g_b 低秩上投影</text>
    <text x="40" y="322" font-family="monospace">d_k → H·d_k</text>
    <text x="182" y="270" font-family="monospace">qkv_conv1d</text>
    <text x="182" y="286">kernel = 4，depthwise</text>
    <text x="182" y="306">q/k/v 三段分别卷积</text>
    <text x="182" y="322">后接 SiLU</text>
    <text x="324" y="270">q、k 单位化</text>
    <text x="324" y="286">在 kernel 内完成</text>
    <text x="324" y="306">（与 GDN 相同）</text>
    <text x="466" y="268" font-family="monospace">g = −exp(A_log[h])</text>
    <text x="466" y="283" font-family="monospace">  ·softplus(f+dt)</text>
    <text x="466" y="299" font-family="monospace">β = sigmoid(b)</text>
    <text x="466" y="317" font-weight="700" fill="#e8590c">向量门：每 head d_k 个</text>
    <text x="466" y="333">q/k/v 头数相同</text>
    <text x="608" y="270" font-family="monospace">o_norm</text>
    <text x="608" y="286" font-family="monospace" font-size="9.5">FusedRMSNormGated</text>
    <text x="608" y="306">RMSNorm(o)⊙σ(g)</text>
    <text x="608" y="322">g 同样由低秩投影得到</text>
    <text x="750" y="270" font-family="monospace">o_proj</text>
    <text x="750" y="286" font-family="monospace">RowParallelLinear</text>
  </g>

  <!-- state row -->
  <g stroke="#0ca678" stroke-width="1.5" stroke-dasharray="4 3" fill="none">
    <path d="M237 342 L237 370"/>
    <path d="M521 342 L521 370"/>
  </g>
  <rect x="122" y="372" width="230" height="50" rx="8" fill="#e6fcf5" stroke="#0ca678"/>
  <text x="136" y="392" font-size="12.5" font-weight="700" fill="#0b7285">conv state（每层）</text>
  <text x="136" y="411" font-size="11" fill="#495057">最近 K−1 = 3 步的卷积输入（bf16）</text>
  <rect x="396" y="372" width="250" height="50" rx="8" fill="#e6fcf5" stroke="#0ca678"/>
  <text x="410" y="392" font-size="12.5" font-weight="700" fill="#0b7285">SSM / temporal state（每层）</text>
  <text x="410" y="411" font-size="11" fill="#495057" font-family="monospace">S: [HV, d_v, d_k]，默认 fp32</text>
  <rect x="700" y="372" width="170" height="50" rx="8" fill="#f1f3f5" stroke="#adb5bd"/>
  <text x="714" y="392" font-size="12.5" font-weight="700" fill="#495057">MambaPool</text>
  <text x="714" y="411" font-size="11" fill="#495057">每个请求一个 slot</text>
  <path d="M352 397 L392 397" stroke="#868e96" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M646 397 L696 397" stroke="#868e96" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="30" y="436" width="840" height="36" rx="8" fill="#f8f9fa" stroke="#e9ecef"/>
  <text x="46" y="459" font-size="12" fill="#495057">两类状态都与序列长度无关：decode 时 conv 窗口滑动一格、SSM 状态原地更新 —— 这就是 linear 层 “每请求固定大小” 显存的全部内容。</text>
</svg>
