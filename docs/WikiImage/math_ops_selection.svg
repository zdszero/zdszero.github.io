<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="470" rx="12" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#212529">同一组分数，六种“选择”方式</text>
  <text x="450" y="56" text-anchor="middle" font-size="13" fill="#868e96">输入 z = [2, 1, 0, −1]；区别在于：各自独立，还是互相竞争；是软的，还是硬的</text>

  <!-- header -->
  <text x="46" y="98" font-size="12" font-weight="700" fill="#868e96">算子</text>
  <rect x="250" y="80" width="90" height="26" rx="6" fill="#f1f3f5" stroke="#adb5bd"/>
  <text x="295" y="98" text-anchor="middle" font-size="13" fill="#495057" font-family="monospace">z₁ = 2</text>
  <rect x="350" y="80" width="90" height="26" rx="6" fill="#f1f3f5" stroke="#adb5bd"/>
  <text x="395" y="98" text-anchor="middle" font-size="13" fill="#495057" font-family="monospace">z₂ = 1</text>
  <rect x="450" y="80" width="90" height="26" rx="6" fill="#f1f3f5" stroke="#adb5bd"/>
  <text x="495" y="98" text-anchor="middle" font-size="13" fill="#495057" font-family="monospace">z₃ = 0</text>
  <rect x="550" y="80" width="90" height="26" rx="6" fill="#f1f3f5" stroke="#adb5bd"/>
  <text x="595" y="98" text-anchor="middle" font-size="13" fill="#495057" font-family="monospace">z₄ = −1</text>
  <text x="670" y="98" font-size="12" font-weight="700" fill="#868e96">Σ 与性质</text>

  <!-- row 1: sigmoid -->
  <rect x="30" y="118" width="840" height="40" rx="8" fill="#f3f0ff" stroke="#7048e8"/>
  <text x="46" y="135" font-size="13" font-weight="700" fill="#5f3dc4">Sigmoid</text>
  <text x="46" y="150" font-size="11" fill="#868e96">每个数各自压到 (0, 1)</text>
  <rect x="258" y="126" width="74" height="10" rx="2" fill="#7048e8"/>
  <text x="258" y="151" font-size="12" fill="#5f3dc4" font-family="monospace">0.881</text>
  <rect x="358" y="126" width="61" height="10" rx="2" fill="#7048e8"/>
  <text x="358" y="151" font-size="12" fill="#5f3dc4" font-family="monospace">0.731</text>
  <rect x="458" y="126" width="42" height="10" rx="2" fill="#7048e8"/>
  <text x="458" y="151" font-size="12" fill="#5f3dc4" font-family="monospace">0.500</text>
  <rect x="558" y="126" width="23" height="10" rx="2" fill="#7048e8"/>
  <text x="558" y="151" font-size="12" fill="#5f3dc4" font-family="monospace">0.269</text>
  <text x="670" y="135" font-size="12" font-weight="700" fill="#5f3dc4" font-family="monospace">Σ = 2.38</text>
  <text x="670" y="150" font-size="11" fill="#495057">不竞争：每个通道自己决定开多大</text>
  <!-- row 2: softmax tau=1 -->
  <rect x="30" y="164" width="840" height="40" rx="8" fill="#fff9db" stroke="#f08c00"/>
  <text x="46" y="181" font-size="13" font-weight="700" fill="#e8590c">Softmax（τ = 1）</text>
  <text x="46" y="196" font-size="11" fill="#868e96">exp 后除以总和</text>
  <rect x="258" y="172" width="54" height="10" rx="2" fill="#f08c00"/>
  <text x="258" y="197" font-size="12" fill="#e8590c" font-family="monospace">0.644</text>
  <rect x="358" y="172" width="20" height="10" rx="2" fill="#f08c00"/>
  <text x="358" y="197" font-size="12" fill="#e8590c" font-family="monospace">0.237</text>
  <rect x="458" y="172" width="7" height="10" rx="2" fill="#f08c00"/>
  <text x="458" y="197" font-size="12" fill="#e8590c" font-family="monospace">0.087</text>
  <rect x="558" y="172" width="3" height="10" rx="1" fill="#f08c00"/>
  <text x="558" y="197" font-size="12" fill="#e8590c" font-family="monospace">0.032</text>
  <text x="670" y="181" font-size="12" font-weight="700" fill="#e8590c" font-family="monospace">Σ = 1</text>
  <text x="670" y="196" font-size="11" fill="#495057">竞争：一个变大，其余必然变小</text>

  <!-- row 3: softmax tau=0.5 -->
  <rect x="30" y="210" width="840" height="40" rx="8" fill="#fff9db" stroke="#f08c00"/>
  <text x="46" y="227" font-size="13" font-weight="700" fill="#e8590c">Softmax（τ = 0.5）</text>
  <text x="46" y="242" font-size="11" fill="#868e96">先 z / τ，差距被放大</text>
  <rect x="258" y="218" width="73" height="10" rx="2" fill="#f08c00"/>
  <text x="258" y="243" font-size="12" fill="#e8590c" font-family="monospace">0.865</text>
  <rect x="358" y="218" width="10" height="10" rx="2" fill="#f08c00"/>
  <text x="358" y="243" font-size="12" fill="#e8590c" font-family="monospace">0.117</text>
  <rect x="458" y="218" width="2" height="10" rx="1" fill="#f08c00"/>
  <text x="458" y="243" font-size="12" fill="#e8590c" font-family="monospace">0.016</text>
  <rect x="558" y="218" width="1" height="10" fill="#f08c00"/>
  <text x="558" y="243" font-size="12" fill="#e8590c" font-family="monospace">0.002</text>
  <text x="670" y="227" font-size="12" font-weight="700" fill="#e8590c" font-family="monospace">Σ = 1</text>
  <text x="670" y="242" font-size="11" fill="#495057">更尖：τ → 0 时退化为 argmax</text>

  <!-- row 4: softmax tau=2 -->
  <rect x="30" y="256" width="840" height="40" rx="8" fill="#fff9db" stroke="#f08c00"/>
  <text x="46" y="273" font-size="13" font-weight="700" fill="#e8590c">Softmax（τ = 2）</text>
  <text x="46" y="288" font-size="11" fill="#868e96">差距被压缩</text>
  <rect x="258" y="264" width="38" height="10" rx="2" fill="#f08c00"/>
  <text x="258" y="289" font-size="12" fill="#e8590c" font-family="monospace">0.455</text>
  <rect x="358" y="264" width="23" height="10" rx="2" fill="#f08c00"/>
  <text x="358" y="289" font-size="12" fill="#e8590c" font-family="monospace">0.276</text>
  <rect x="458" y="264" width="14" height="10" rx="2" fill="#f08c00"/>
  <text x="458" y="289" font-size="12" fill="#e8590c" font-family="monospace">0.167</text>
  <rect x="558" y="264" width="9" height="10" rx="2" fill="#f08c00"/>
  <text x="558" y="289" font-size="12" fill="#e8590c" font-family="monospace">0.102</text>
  <text x="670" y="273" font-size="12" font-weight="700" fill="#e8590c" font-family="monospace">Σ = 1</text>
  <text x="670" y="288" font-size="11" fill="#495057">更平：τ → ∞ 时退化为均匀平均</text>
  <!-- row 5: mask + softmax -->
  <rect x="30" y="302" width="840" height="40" rx="8" fill="#f8f9fa" stroke="#adb5bd"/>
  <text x="46" y="319" font-size="13" font-weight="700" fill="#495057">Mask + Softmax</text>
  <text x="46" y="334" font-size="11" fill="#868e96">z₄ 加上 −∞，exp 后为 0</text>
  <rect x="258" y="310" width="56" height="10" rx="2" fill="#495057"/>
  <text x="258" y="335" font-size="12" fill="#495057" font-family="monospace">0.665</text>
  <rect x="358" y="310" width="21" height="10" rx="2" fill="#495057"/>
  <text x="358" y="335" font-size="12" fill="#495057" font-family="monospace">0.245</text>
  <rect x="458" y="310" width="8" height="10" rx="2" fill="#495057"/>
  <text x="458" y="335" font-size="12" fill="#495057" font-family="monospace">0.090</text>
  <rect x="552" y="308" width="80" height="30" rx="5" fill="#f1f3f5" stroke="#adb5bd" stroke-dasharray="3 3"/>
  <text x="592" y="328" text-anchor="middle" font-size="12" fill="#868e96" font-family="monospace">0（−∞）</text>
  <text x="670" y="319" font-size="12" font-weight="700" fill="#495057" font-family="monospace">Σ = 1</text>
  <text x="670" y="334" font-size="11" fill="#495057">结构性排除：因果 / 滑窗 / padding</text>

  <!-- row 6: top-k -->
  <rect x="30" y="348" width="840" height="40" rx="8" fill="#fff5f5" stroke="#fa5252"/>
  <text x="46" y="365" font-size="13" font-weight="700" fill="#c92a2a">Top-2 + Softmax</text>
  <text x="46" y="380" font-size="11" fill="#868e96">按排名硬选，再在胜者内归一化</text>
  <rect x="258" y="356" width="61" height="10" rx="2" fill="#fa5252"/>
  <text x="258" y="381" font-size="12" fill="#c92a2a" font-family="monospace">0.731</text>
  <rect x="358" y="356" width="23" height="10" rx="2" fill="#fa5252"/>
  <text x="358" y="381" font-size="12" fill="#c92a2a" font-family="monospace">0.269</text>
  <rect x="452" y="354" width="80" height="30" rx="5" fill="#f1f3f5" stroke="#adb5bd" stroke-dasharray="3 3"/>
  <text x="492" y="374" text-anchor="middle" font-size="12" fill="#868e96" font-family="monospace">0（不算）</text>
  <rect x="552" y="354" width="80" height="30" rx="5" fill="#f1f3f5" stroke="#adb5bd" stroke-dasharray="3 3"/>
  <text x="592" y="374" text-anchor="middle" font-size="12" fill="#868e96" font-family="monospace">0（不算）</text>
  <text x="670" y="365" font-size="12" font-weight="700" fill="#c92a2a" font-family="monospace">Σ = 1</text>
  <text x="670" y="380" font-size="11" fill="#495057">稀疏：MoE 路由、DSA 选 token</text>

  <!-- note -->
  <rect x="30" y="402" width="840" height="56" rx="10" fill="#f8f9fa" stroke="#e9ecef"/>
  <text x="46" y="425" font-size="12" fill="#495057">Softmax 只看分数之差：z 整体加一个常数，结果不变——所以 kernel 总是先减去 max 再算 exp，防止溢出。</text>
  <text x="46" y="445" font-size="12" fill="#495057">分母的对数 LSE = log Σ eᶻ = 2.44 是一个“平滑的 max”：max(z) = 2 ≤ LSE ≤ 2 + log 4。</text>
</svg>
