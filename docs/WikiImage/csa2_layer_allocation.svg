  <text x="450" y="441" text-anchor="middle" font-size="10.5" fill="#495057">L21 同时产出候选池（≤ 2048 块 × 8 = 16384 个位置），L25 / L29 / L33 / L37 只在池内重打分</text>
  <rect x="24" y="468" width="852" height="114" rx="8" fill="#f8f9fa" stroke="#e9ecef"/>
  <text x="44" y="494" font-size="12" fill="#495057">计数：Full 4 层（L3 / L9 / L15 / L21），Reindex 4 层，Reuse 30 层，纯 SWA 2 层。每层都还有自己的 SWA KV（不在这张图里）。</text>
  <text x="44" y="516" font-size="12" fill="#495057">常驻的 global cache 只有 4 份：encoder 3 份 × 每 2 token 一条 + decoder 1 份 × 每 token 一条 = 每 token 2.5 条。</text>
  <text x="44" y="538" font-size="12" fill="#495057">Reindex 不产出 cache，只产出「本组的 Top-K」；Reuse 读最近一份 cache，并沿用针对这份 cache 的最近一次 Top-K。</text>
  <text x="44" y="560" font-size="12" fill="#868e96">decoder 的 KV 只依赖 encoder 输出，这点在结构上接近 YOCO（笔者的类比，报告未这样表述）。</text>
