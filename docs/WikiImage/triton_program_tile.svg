<svg xmlns="http://www.w3.org/2000/svg" width="760" height="292" viewBox="0 0 760 292" role="img" aria-labelledby="title"><title id="title">Triton Program 与 Tile：最后一个数据块通过 Mask 处理边界</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#64748b"/></marker></defs><rect width="760" height="292" rx="12" fill="#f8fafc"/><g font-family="Arial, sans-serif" fill="#1e293b"><text x="380" y="32" text-anchor="middle" font-size="20">Grid = (4,) · N = 1003 · BLOCK_SIZE = 256</text><rect x="20" y="60" width="165" height="44" rx="8" fill="#dbeafe" stroke="#94a3b8"/><text x="102.5" y="88.0" text-anchor="middle" font-size="16">Program 0</text><path d="M102 104L102 132" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="138" width="165" height="60" rx="8" fill="#dcfce7" stroke="#94a3b8"/><text x="102.5" y="174.0" text-anchor="middle" font-size="16">0 … 255</text><text x="102" y="223" text-anchor="middle" font-size="14">256 个有效元素</text><rect x="205" y="60" width="165" height="44" rx="8" fill="#dbeafe" stroke="#94a3b8"/><text x="287.5" y="88.0" text-anchor="middle" font-size="16">Program 1</text><path d="M287 104L287 132" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="205" y="138" width="165" height="60" rx="8" fill="#dcfce7" stroke="#94a3b8"/><text x="287.5" y="174.0" text-anchor="middle" font-size="16">256 … 511</text><text x="287" y="223" text-anchor="middle" font-size="14">256 个有效元素</text><rect x="390" y="60" width="165" height="44" rx="8" fill="#dbeafe" stroke="#94a3b8"/><text x="472.5" y="88.0" text-anchor="middle" font-size="16">Program 2</text><path d="M472 104L472 132" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="390" y="138" width="165" height="60" rx="8" fill="#dcfce7" stroke="#94a3b8"/><text x="472.5" y="174.0" text-anchor="middle" font-size="16">512 … 767</text><text x="472" y="223" text-anchor="middle" font-size="14">256 个有效元素</text><rect x="575" y="60" width="165" height="44" rx="8" fill="#dbeafe" stroke="#94a3b8"/><text x="657.5" y="88.0" text-anchor="middle" font-size="16">Program 3</text><path d="M657 104L657 132" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><rect x="575" y="138" width="165" height="60" rx="8" fill="#fef3c7" stroke="#94a3b8"/><text x="657.5" y="174.0" text-anchor="middle" font-size="16">768 … 1023</text><text x="657" y="223" text-anchor="middle" font-size="14">235 有效 / 21 屏蔽</text><text x="380" y="268" text-anchor="middle" font-size="17">Tile 是逻辑数据块；元素由编译器分配给 Warp / Thread</text></g></svg>