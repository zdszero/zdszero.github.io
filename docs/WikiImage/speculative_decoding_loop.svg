<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 484" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="920" height="484" rx="12" fill="#ffffff"/>
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#868e96"/>
    </marker>
  </defs>
  <text x="460" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#212529">投机解码的统一循环</text>
  <text x="460" y="56" text-anchor="middle" font-size="13" fill="#868e96">每个 decode step：draft 提议 k 个 token → target 一次前向验证 → 接受最长正确前缀 + 1 个 bonus</text>

  <!-- pipeline -->
  <rect x="40" y="78" width="240" height="70" rx="10" fill="#f3f0ff" stroke="#7048e8"/>
  <text x="160" y="104" text-anchor="middle" font-size="14" font-weight="700" fill="#5f3dc4">① Draft：提议</text>
  <text x="160" y="124" text-anchor="middle" font-size="11.5" fill="#495057">便宜的来源猜出 k 个候选 token</text>
  <text x="160" y="140" text-anchor="middle" font-size="11" fill="#868e96">可以猜错，只影响速度</text>

  <rect x="340" y="78" width="240" height="70" rx="10" fill="#edf2ff" stroke="#4c6ef5"/>
  <text x="460" y="104" text-anchor="middle" font-size="14" font-weight="700" fill="#3b5bdb">② Verify：target 一次前向</text>
  <text x="460" y="124" text-anchor="middle" font-size="11.5" fill="#495057">k+1 个位置的 logits 一次算出</text>
  <text x="460" y="140" text-anchor="middle" font-size="11" fill="#868e96">访存受限，比 1 个位置贵不了多少</text>

  <rect x="640" y="78" width="240" height="70" rx="10" fill="#e6fcf5" stroke="#0ca678"/>
  <text x="760" y="104" text-anchor="middle" font-size="14" font-weight="700" fill="#0b7285">③ Commit：接受 + 维护</text>
  <text x="760" y="124" text-anchor="middle" font-size="11.5" fill="#495057">留下正确前缀，补 1 个 bonus</text>
  <text x="760" y="140" text-anchor="middle" font-size="11" fill="#868e96">更新 draft 下一轮需要的状态</text>

  <path d="M280 113 L336 113" stroke="#868e96" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M580 113 L636 113" stroke="#868e96" stroke-width="2" marker-end="url(#ar)"/>

  <!-- worked example -->
  <text x="40" y="184" font-size="12" font-weight="700" fill="#495057">例：前缀「今天」，k = 4</text>
  <text x="200" y="184" font-size="11.5" fill="#868e96">draft</text>
  <g font-family="monospace" font-size="13" text-anchor="middle">
    <rect x="240" y="168" width="34" height="24" rx="5" fill="#f3f0ff" stroke="#7048e8"/><text x="257" y="185" fill="#5f3dc4">天</text>
    <rect x="278" y="168" width="34" height="24" rx="5" fill="#f3f0ff" stroke="#7048e8"/><text x="295" y="185" fill="#5f3dc4">气</text>
    <rect x="316" y="168" width="34" height="24" rx="5" fill="#f3f0ff" stroke="#7048e8"/><text x="333" y="185" fill="#5f3dc4">真</text>
    <rect x="354" y="168" width="34" height="24" rx="5" fill="#f3f0ff" stroke="#7048e8"/><text x="371" y="185" fill="#5f3dc4">好</text>
  </g>
  <text x="410" y="184" font-size="11.5" fill="#868e96">verify</text>
  <g font-family="monospace" font-size="13" text-anchor="middle">
    <text x="460" y="185" fill="#0b7285">✓</text>
    <text x="484" y="185" fill="#0b7285">✓</text>
    <text x="508" y="185" fill="#c92a2a">✗</text>
    <text x="606" y="185" fill="#adb5bd">·</text>
  </g>
  <text x="630" y="184" font-size="11.5" fill="#868e96">commit</text>
  <g font-family="monospace" font-size="13" text-anchor="middle">
    <rect x="684" y="168" width="34" height="24" rx="5" fill="#e6fcf5" stroke="#0ca678"/><text x="701" y="185" fill="#0b7285">天</text>
    <rect x="722" y="168" width="34" height="24" rx="5" fill="#e6fcf5" stroke="#0ca678"/><text x="739" y="185" fill="#0b7285">气</text>
    <rect x="760" y="168" width="34" height="24" rx="5" fill="#fff4e6" stroke="#f08c00"/><text x="777" y="185" fill="#e8590c">不</text>
  </g>
  <text x="520" y="184" font-size="11.5" fill="#c92a2a">应为「不」</text>
  <text x="806" y="184" font-size="11.5" fill="#495057">一步出 3 个</text>
  <!-- axes -->
  <text x="40" y="226" font-size="13" font-weight="700" fill="#212529">各方案的差别，都落在这四个选择上</text>

  <rect x="40" y="238" width="195" height="160" rx="10" fill="#f8f9fa" stroke="#adb5bd"/>
  <rect x="40" y="238" width="195" height="28" rx="10" fill="#7048e8"/>
  <rect x="40" y="252" width="195" height="14" fill="#7048e8"/>
  <text x="137" y="257" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">轴 1 · 提议从哪来</text>
  <text x="54" y="288" font-size="11.5" fill="#495057">· n-gram 语料（NGRAM）</text>
  <text x="54" y="310" font-size="11.5" fill="#495057">· 独立小模型（STANDALONE）</text>
  <text x="54" y="332" font-size="11.5" fill="#495057">· target 末层 hidden</text>
  <text x="66" y="348" font-size="11" fill="#868e96">EAGLE、NEXTN / MTP</text>
  <text x="54" y="370" font-size="11.5" fill="#495057">· target 多层 hidden</text>
  <text x="66" y="384" font-size="11" fill="#868e96">EAGLE3、DFLASH、DSPARK</text>

  <rect x="255" y="238" width="195" height="160" rx="10" fill="#f8f9fa" stroke="#adb5bd"/>
  <rect x="255" y="238" width="195" height="28" rx="10" fill="#4c6ef5"/>
  <rect x="255" y="252" width="195" height="14" fill="#4c6ef5"/>
  <text x="352" y="257" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">轴 2 · 怎么产生</text>
  <text x="269" y="288" font-size="11.5" fill="#495057">· 查表：无模型前向</text>
  <text x="269" y="314" font-size="11.5" fill="#495057">· 串行自回归</text>
  <text x="281" y="330" font-size="11" fill="#868e96">k 个 token 要多次 draft 前向</text>
  <text x="269" y="356" font-size="11.5" fill="#495057">· 并行块</text>
  <text x="281" y="372" font-size="11" fill="#868e96">1 次前向出 k 个（DFLASH）</text>

  <rect x="470" y="238" width="195" height="160" rx="10" fill="#f8f9fa" stroke="#adb5bd"/>
  <rect x="470" y="238" width="195" height="28" rx="10" fill="#f08c00"/>
  <rect x="470" y="252" width="195" height="14" fill="#f08c00"/>
  <text x="567" y="257" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">轴 3 · 验证什么形状</text>
  <text x="484" y="288" font-size="11.5" fill="#495057">· 树：每层留 topk 个分支</text>
  <text x="496" y="304" font-size="11" fill="#868e96">EAGLE topk&gt;1、NGRAM</text>
  <text x="484" y="330" font-size="11.5" fill="#495057">· 链：topk = 1</text>
  <text x="496" y="346" font-size="11" fill="#868e96">NEXTN 默认、DFLASH</text>
  <text x="484" y="370" font-size="11.5" fill="#495057">· 每请求变长（DSPARK）</text>

  <rect x="685" y="238" width="195" height="160" rx="10" fill="#f8f9fa" stroke="#adb5bd"/>
  <rect x="685" y="238" width="195" height="28" rx="10" fill="#0ca678"/>
  <rect x="685" y="252" width="195" height="14" fill="#0ca678"/>
  <text x="782" y="257" text-anchor="middle" font-size="12.5" font-weight="700" fill="#ffffff">轴 4 · draft 状态怎么续上</text>
  <text x="699" y="288" font-size="11.5" fill="#495057">· 无状态（NGRAM）</text>
  <text x="699" y="310" font-size="11.5" fill="#495057">· 再跑一次 draft extend</text>
  <text x="699" y="332" font-size="11.5" fill="#495057">· target hidden 投影成</text>
  <text x="711" y="348" font-size="11.5" fill="#495057">draft KV（DFLASH 系）</text>
  <text x="699" y="370" font-size="11.5" fill="#495057">· 直接读 target 的 KV</text>
  <text x="711" y="384" font-size="11" fill="#868e96">FROZEN_KV_MTP</text>

  <rect x="40" y="414" width="840" height="46" rx="8" fill="#f8f9fa" stroke="#e9ecef"/>
  <text x="460" y="433" text-anchor="middle" font-size="12" fill="#495057">收益：每步平均接受的 token 数 τ（含 bonus）。代价：draft 时间 + verify 多算的位置 + draft 状态的显存。</text>
  <text x="460" y="451" text-anchor="middle" font-size="12" fill="#495057">验证用 target 自己的分布做裁决，所以无论 draft 多差，输出分布都不变。</text>
</svg>
