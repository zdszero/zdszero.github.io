<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="500" rx="12" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#212529">跨 stream 使用：执行依赖 ≠ 存储复用</text>
  <text x="450" y="56" text-anchor="middle" font-size="13" fill="#868e96">分配器只跟踪张量“分配所在的 stream”；侧 stream 还在读时，它并不知道</text>

  <!-- TOP: hazard -->
  <rect x="40" y="76" width="820" height="170" rx="10" fill="#fff5f5" stroke="#fa5252"/>
  <text x="58" y="100" font-size="13.5" font-weight="700" fill="#c92a2a">没有 record_stream：block 可能被过早复用</text>
  <text x="58" y="138" font-size="11.5" font-family="monospace" fill="#495057">stream A</text>
  <text x="58" y="194" font-size="11.5" font-family="monospace" fill="#495057">stream B</text>
  <line x1="130" y1="134" x2="840" y2="134" stroke="#dee2e6" stroke-width="1.5"/>
  <line x1="130" y1="190" x2="840" y2="190" stroke="#dee2e6" stroke-width="1.5"/>
  <rect x="140" y="118" width="130" height="32" rx="7" fill="#edf2ff" stroke="#4c6ef5"/>
  <text x="205" y="139" text-anchor="middle" font-size="11.5" fill="#3b5bdb">分配并写入 x</text>
  <path d="M270 150 L300 172" stroke="#868e96" stroke-width="2" marker-end="url(#arS)"/>
  <rect x="300" y="174" width="330" height="32" rx="7" fill="#f3f0ff" stroke="#7048e8"/>
  <text x="465" y="195" text-anchor="middle" font-size="11.5" fill="#5f3dc4">wait_event 后读 x（仍在执行）</text>
  <line x1="350" y1="110" x2="350" y2="226" stroke="#868e96" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="356" y="114" font-size="11" fill="#868e96">CPU: del x</text>
  <rect x="420" y="118" width="210" height="32" rx="7" fill="#ffe3e3" stroke="#fa5252"/>
  <text x="525" y="139" text-anchor="middle" font-size="11.5" font-weight="700" fill="#c92a2a">y = empty(...) 复用同一 block</text>
  <rect x="420" y="112" width="210" height="100" rx="8" fill="none" stroke="#fa5252" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="648" y="160" font-size="11.5" fill="#c92a2a">A 写 y 的同时 B 还在读 x</text>
  <text x="648" y="178" font-size="11.5" fill="#c92a2a">→ 读到被覆盖的数据</text>
  <text x="58" y="232" font-size="11.5" fill="#495057">分配器的判断：A 上之后的工作一定排在旧工作之后，所以 block 立刻可给 A 复用——这对 B 不成立</text>

  <!-- BOTTOM: record_stream -->
  <rect x="40" y="260" width="820" height="170" rx="10" fill="#e6fcf5" stroke="#0ca678"/>
  <text x="58" y="284" font-size="13.5" font-weight="700" fill="#0b7285">x.record_stream(B)：释放推迟到 B 上已提交的工作完成</text>
  <text x="58" y="322" font-size="11.5" font-family="monospace" fill="#495057">stream A</text>
  <text x="58" y="378" font-size="11.5" font-family="monospace" fill="#495057">stream B</text>
  <line x1="130" y1="318" x2="840" y2="318" stroke="#dee2e6" stroke-width="1.5"/>
  <line x1="130" y1="374" x2="840" y2="374" stroke="#dee2e6" stroke-width="1.5"/>
  <rect x="140" y="302" width="130" height="32" rx="7" fill="#edf2ff" stroke="#4c6ef5"/>
  <text x="205" y="323" text-anchor="middle" font-size="11.5" fill="#3b5bdb">分配并写入 x</text>
  <path d="M270 334 L300 356" stroke="#868e96" stroke-width="2" marker-end="url(#arS)"/>
  <rect x="300" y="358" width="330" height="32" rx="7" fill="#f3f0ff" stroke="#7048e8"/>
  <text x="465" y="379" text-anchor="middle" font-size="11.5" fill="#5f3dc4">wait_event 后读 x</text>
  <line x1="350" y1="294" x2="350" y2="410" stroke="#868e96" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="356" y="298" font-size="11" fill="#868e96">CPU: del x</text>
  <path d="M352 404 L352 410 L630 410 L630 404" fill="none" stroke="#f08c00" stroke-width="1.5"/>
  <text x="491" y="424" text-anchor="middle" font-size="11" fill="#e8590c">block 挂在待释放列表，不可复用</text>
  <rect x="650" y="302" width="190" height="32" rx="7" fill="#d3f9d8" stroke="#0ca678"/>
  <text x="745" y="323" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0b7285">B 完成后才回到缓存</text>
  <path d="M632 374 L660 336" stroke="#0ca678" stroke-width="2" marker-end="url(#arT)"/>

  <!-- note -->
  <rect x="40" y="444" width="820" height="44" rx="9" fill="#f8f9fa" stroke="#e9ecef"/>
  <text x="58" y="463" font-size="12" fill="#495057">wait_event 管“B 何时能读”，record_stream 管“block 何时能复用”，两者缺一不可。</text>
  <text x="58" y="480" font-size="12" fill="#495057">代价：频繁新分配 + record_stream 会让大量 block 滞留，allocated 很小而 reserved 持续膨胀。</text>

  <defs>
    <marker id="arS" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#868e96"/></marker>
    <marker id="arT" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#0ca678"/></marker>
  </defs>
</svg>
