<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="920" height="460" rx="12" fill="#ffffff"/>
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#868e96"/>
    </marker>
  </defs>
  <text x="460" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#212529">EAGLE-3 的 training-time test：训练时就把推理展开</text>
  <text x="460" y="56" text-anchor="middle" font-size="13" fill="#868e96">g = target 低中高三层融合特征；a = draft 自己的输出 hidden；每一步都只算 token 交叉熵</text>

  <!-- panel A: EAGLE training vs inference mismatch -->
  <rect x="24" y="74" width="428" height="250" rx="10" fill="#f8f9fa" stroke="#e9ecef"/>
  <text x="40" y="98" font-size="14" font-weight="700" fill="#495057">去掉特征损失、但不展开：分布错位</text>
  <text x="40" y="124" font-size="11.5" fill="#495057">训练</text>
  <g font-size="11" text-anchor="middle">
    <rect x="90" y="110" width="60" height="26" rx="6" fill="#fff4e6" stroke="#f08c00"/><text x="120" y="127" fill="#e8590c">g₁</text>
    <rect x="160" y="110" width="60" height="26" rx="6" fill="#fff4e6" stroke="#f08c00"/><text x="190" y="127" fill="#e8590c">g₂</text>
    <rect x="230" y="110" width="60" height="26" rx="6" fill="#fff4e6" stroke="#f08c00"/><text x="260" y="127" fill="#e8590c">g₃</text>
  </g>
  <text x="300" y="127" font-size="10.5" fill="#868e96">每步都是 target 真特征</text>
  <text x="40" y="174" font-size="11.5" fill="#495057">推理</text>
  <g font-size="11" text-anchor="middle">
    <rect x="90" y="160" width="60" height="26" rx="6" fill="#fff4e6" stroke="#f08c00"/><text x="120" y="177" fill="#e8590c">g₁</text>
    <rect x="160" y="160" width="60" height="26" rx="6" fill="#f3f0ff" stroke="#7048e8"/><text x="190" y="177" fill="#5f3dc4">a₁</text>
    <rect x="230" y="160" width="60" height="26" rx="6" fill="#f3f0ff" stroke="#7048e8"/><text x="260" y="177" fill="#5f3dc4">a₂</text>
  </g>
  <text x="300" y="177" font-size="10.5" fill="#c92a2a">第 2 步起没见过的输入</text>
  <path d="M150 173 L156 173" stroke="#868e96" stroke-width="1.3" marker-end="url(#ar)"/>
  <path d="M220 173 L226 173" stroke="#868e96" stroke-width="1.3" marker-end="url(#ar)"/>
  <text x="40" y="222" font-size="11.5" fill="#495057">EAGLE 用 L_reg 逼 a 去像 g，错位不严重，但 draft 被钉在</text>
  <text x="40" y="242" font-size="11.5" fill="#495057">target 特征空间里，加数据也涨不动。直接去掉 L_reg：</text>
  <text x="40" y="262" font-size="11.5" fill="#495057">第 1 步接受率上升，第 2 步大幅下降。</text>
  <text x="40" y="300" font-size="10.5" fill="#868e96">EAGLE 论文另用 U(−0.1, 0.1) 特征噪声缓解这个问题</text>
  <!-- panel B: TTT unroll -->
  <rect x="468" y="74" width="428" height="250" rx="10" fill="#f8f9fa" stroke="#e9ecef"/>
  <text x="484" y="98" font-size="14" font-weight="700" fill="#5f3dc4">training-time test：训练时也喂自己的输出</text>
  <g font-size="11" text-anchor="middle">
    <text x="510" y="134" fill="#495057" font-size="11.5">步 1</text>
    <rect x="540" y="118" width="54" height="26" rx="6" fill="#fff4e6" stroke="#f08c00"/><text x="567" y="135" fill="#e8590c">g</text>
    <rect x="612" y="118" width="80" height="26" rx="6" fill="#f3f0ff" stroke="#7048e8"/><text x="652" y="135" fill="#5f3dc4">draft 层</text>
    <rect x="710" y="118" width="54" height="26" rx="6" fill="#f3f0ff" stroke="#7048e8"/><text x="737" y="135" fill="#5f3dc4">a₁</text>
    <rect x="782" y="118" width="96" height="26" rx="6" fill="#e6fcf5" stroke="#0ca678"/><text x="830" y="135" fill="#0b7285">CE(t+1)</text>

    <text x="510" y="184" fill="#495057" font-size="11.5">步 2</text>
    <rect x="540" y="168" width="54" height="26" rx="6" fill="#f3f0ff" stroke="#7048e8"/><text x="567" y="185" fill="#5f3dc4">a₁</text>
    <rect x="612" y="168" width="80" height="26" rx="6" fill="#f3f0ff" stroke="#7048e8"/><text x="652" y="185" fill="#5f3dc4">同一层</text>
    <rect x="710" y="168" width="54" height="26" rx="6" fill="#f3f0ff" stroke="#7048e8"/><text x="737" y="185" fill="#5f3dc4">a₂</text>
    <rect x="782" y="168" width="96" height="26" rx="6" fill="#e6fcf5" stroke="#0ca678"/><text x="830" y="185" fill="#0b7285">CE(t+2)×0.8</text>

    <text x="510" y="234" fill="#495057" font-size="11.5">步 3</text>
    <rect x="540" y="218" width="54" height="26" rx="6" fill="#f3f0ff" stroke="#7048e8"/><text x="567" y="235" fill="#5f3dc4">a₂</text>
    <rect x="612" y="218" width="80" height="26" rx="6" fill="#f3f0ff" stroke="#7048e8"/><text x="652" y="235" fill="#5f3dc4">同一层</text>
    <rect x="710" y="218" width="54" height="26" rx="6" fill="#f3f0ff" stroke="#7048e8"/><text x="737" y="235" fill="#5f3dc4">a₃</text>
    <rect x="782" y="218" width="96" height="26" rx="6" fill="#e6fcf5" stroke="#0ca678"/><text x="830" y="235" fill="#0b7285">CE(t+3)×0.8²</text>
  </g>
  <g stroke="#868e96" stroke-width="1.3">
    <path d="M594 131 L608 131" marker-end="url(#ar)"/><path d="M692 131 L706 131" marker-end="url(#ar)"/><path d="M764 131 L778 131" marker-end="url(#ar)"/>
    <path d="M594 181 L608 181" marker-end="url(#ar)"/><path d="M692 181 L706 181" marker-end="url(#ar)"/><path d="M764 181 L778 181" marker-end="url(#ar)"/>
    <path d="M594 231 L608 231" marker-end="url(#ar)"/><path d="M692 231 L706 231" marker-end="url(#ar)"/><path d="M764 231 L778 231" marker-end="url(#ar)"/>
  </g>
  <path d="M737 144 C 737 158, 567 152, 567 164" stroke="#7048e8" stroke-width="1.2" fill="none" stroke-dasharray="4 3" marker-end="url(#ar)"/>
  <path d="M737 194 C 737 208, 567 202, 567 214" stroke="#7048e8" stroke-width="1.2" fill="none" stroke-dasharray="4 3" marker-end="url(#ar)"/>
  <text x="484" y="272" font-size="11.5" fill="#495057">没有特征损失，a 可以长成任何对猜 token 有用的样子；</text>
  <text x="484" y="292" font-size="11.5" fill="#495057">训练和推理看到的输入分布一致。</text>
  <text x="484" y="312" font-size="10.5" fill="#868e96">官方代码展开 7 步、权重 0.8^i；论文图示为 1 原生步 + 2 模拟步</text>

  <rect x="24" y="340" width="872" height="100" rx="8" fill="#f8f9fa" stroke="#e9ecef"/>
  <text x="44" y="364" font-size="12" font-weight="700" fill="#212529">只改 attention mask，不需要真的串行跑 k 次</text>
  <text x="44" y="386" font-size="12" fill="#495057">· 一条长度 L 的训练序列，模拟第 j 步时每个位置 i 的 query：对原始数据的 key 正常因果注意，</text>
  <text x="44" y="406" font-size="12" fill="#495057">  对模拟步产生的 key 只看「同一位置 i 在前几步的输出」，即一条对角线，用逐元素点积算。</text>
  <text x="44" y="426" font-size="12" fill="#495057">· 消融（LLaMA3.1-8B，MT-bench）：EAGLE-2 3.16× → 去掉特征损失 3.82× → 再加多层融合 4.40×。</text>
</svg>
