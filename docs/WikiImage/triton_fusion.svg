<svg xmlns="http://www.w3.org/2000/svg" width="760" height="345" viewBox="0 0 760 345" role="img" aria-labelledby="title"><title id="title">Softmax 融合减少中间 Tensor 的显存读写</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#64748b"/></marker></defs><rect width="760" height="345" rx="12" fill="#f8fafc"/><g font-family="Arial, sans-serif" fill="#1e293b"><text x="380" y="32" text-anchor="middle" font-size="20">逐步实现与融合实现：中间结果在哪里？</text><text x="380" y="67" text-anchor="middle" font-size="16">逐步实现：算子之间将中间 Tensor 写回显存</text><rect x="20" y="90" width="220" height="48" rx="8" fill="#dbeafe" stroke="#94a3b8"/><text x="130.0" y="120.0" text-anchor="middle" font-size="16">Max / Sub</text><rect x="270" y="90" width="220" height="48" rx="8" fill="#dbeafe" stroke="#94a3b8"/><text x="380.0" y="120.0" text-anchor="middle" font-size="16">Exp</text><rect x="520" y="90" width="220" height="48" rx="8" fill="#dbeafe" stroke="#94a3b8"/><text x="630.0" y="120.0" text-anchor="middle" font-size="16">Sum / Div</text><path d="M240 114L266 114" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M490 114L516 114" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="255" y="161" text-anchor="middle" font-size="14">显存读写</text><text x="505" y="161" text-anchor="middle" font-size="14">显存读写</text><text x="380" y="207" text-anchor="middle" font-size="16">融合实现：一个 Program 内完成一行计算</text><rect x="20" y="230" width="140" height="56" rx="8" fill="#dbeafe" stroke="#94a3b8"/><text x="90.0" y="264.0" text-anchor="middle" font-size="16">读取输入</text><rect x="205" y="225" width="350" height="68" rx="8" fill="#dcfce7" stroke="#94a3b8"/><text x="380.0" y="265.0" text-anchor="middle" font-size="16">Max → Sub → Exp → Sum → Div</text><rect x="600" y="230" width="140" height="56" rx="8" fill="#dbeafe" stroke="#94a3b8"/><text x="670.0" y="264.0" text-anchor="middle" font-size="16">写回输出</text><path d="M160 258L200 258" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path d="M555 258L595 258" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="380" y="320" text-anchor="middle" font-size="16">中间结果留在片上；实际效果受寄存器与行宽限制</text></g></svg>