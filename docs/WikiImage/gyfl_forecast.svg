<text x="48.0" y="524.0" font-size="12" fill="#495057" text-anchor="start">2025-10-29 市值见顶时，国金对 2026 年的预测还是 8 月的 393 亿元（次日上调到 430 亿元），按顶部市值约 41 倍；到 2026-03-11 预测上调到</text>
<text x="48.0" y="542.0" font-size="12" fill="#495057" text-anchor="start">596 亿元时，市值已比顶部低三分之一。2026-06 第二次见顶后，预测基本不再上调，2027 年预测在 10 月首次下修。</text>
<text x="48.0" y="560.0" font-size="12" fill="#495057" text-anchor="start">2024 年的预测在 2023 年底最高（287 亿元），实际只有 232 亿元，属于高估；2025 年实际 352.9 亿元高于全部历次预测，属于低估。来源：国金证</text>
<text x="48.0" y="578.0" font-size="12" fill="#495057" text-anchor="start">券研报摘要（东方财富研报中心），2026-11-18 提取。</text>
