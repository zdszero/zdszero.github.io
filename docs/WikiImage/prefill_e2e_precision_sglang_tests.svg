<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="540" rx="12" fill="#ffffff"/>
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#868e96"/>
    </marker>
    <marker id="arT" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#0ca678"/>
    </marker>
  </defs>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#212529">SGLang 里的两种基准：自身对照 vs 滚动 Golden Baseline</text>
  <text x="450" y="56" text-anchor="middle" font-size="13" fill="#868e96">上：同一个 server 的 decode 路径与 prefill 路径互为参照；下：今天的 hidden state 与「上一次通过的版本」比</text>

  <!-- Lane 1 banner -->
  <rect x="30" y="74" width="840" height="200" rx="10" fill="#f3f0ff" stroke="#7048e8"/>
  <rect x="30" y="74" width="840" height="28" rx="10" fill="#7048e8"/>
  <rect x="30" y="90" width="840" height="12" fill="#7048e8"/>
  <text x="46" y="93" font-size="13" font-weight="700" fill="#ffffff">kl_test_utils.test_input_output_logprobs_match_helper：decode ↔ prefill 自洽</text>

  <rect x="48" y="116" width="240" height="96" rx="8" fill="#ffffff" stroke="#7048e8"/>
  <text x="62" y="138" font-size="12.5" font-weight="700" fill="#5f3dc4">① 生成（decode 路径）</text>
  <text x="62" y="158" font-size="11" font-family="monospace" fill="#495057">flush_cache → /generate</text>
  <text x="62" y="176" font-size="11" font-family="monospace" fill="#495057">temperature=0, ignore_eos</text>
  <text x="62" y="196" font-size="11" fill="#868e96">得到 output_ids + output logprob</text>

  <rect x="330" y="116" width="250" height="96" rx="8" fill="#ffffff" stroke="#7048e8"/>
  <text x="344" y="138" font-size="12.5" font-weight="700" fill="#5f3dc4">② 重算（prefill 路径）</text>
  <text x="344" y="158" font-size="11" font-family="monospace" fill="#495057">prompt + output_ids，flush_cache</text>
  <text x="344" y="176" font-size="11" font-family="monospace" fill="#495057">max_new_tokens=0</text>
  <text x="344" y="196" font-size="11" fill="#868e96">logprob_start_len=0，取末尾 len(output) 个</text>

  <rect x="622" y="116" width="230" height="96" rx="8" fill="#ffffff" stroke="#7048e8"/>
  <text x="636" y="138" font-size="12.5" font-weight="700" fill="#5f3dc4">③ compare_kl_divergence</text>
  <text x="636" y="158" font-size="11" fill="#495057">每条样本：位置上 k3 取均值</text>
  <text x="636" y="176" font-size="11" fill="#495057">所有样本再取均值</text>
  <text x="636" y="196" font-size="11" font-family="monospace" fill="#495057">avg &lt; ACC_THRESHOLDS[kl_div]</text>

  <path d="M288 164 L326 164" fill="none" stroke="#868e96" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M580 164 L618 164" fill="none" stroke="#868e96" stroke-width="2" marker-end="url(#ar)"/>

  <rect x="48" y="224" width="804" height="38" rx="8" fill="#ffffff" stroke="#e5dbff"/>
  <text x="62" y="248" font-size="11.5" fill="#495057">变体 <tspan font-family="monospace" fill="#5f3dc4">…_prefill_cache_hit</tspan> / <tspan font-family="monospace" fill="#5f3dc4">…_decode_cache_hit</tspan>：先把 KV 写进 radix cache，再在命中时生成，检验复用的 KV 是否可信</text>

  <!-- Lane 2 banner -->
  <rect x="30" y="290" width="840" height="230" rx="10" fill="#e6fcf5" stroke="#0ca678"/>
  <rect x="30" y="290" width="840" height="28" rx="10" fill="#0ca678"/>
  <rect x="30" y="306" width="840" height="12" fill="#0ca678"/>
  <text x="46" y="309" font-size="13" font-weight="700" fill="#ffffff">test_nightly_precision_regression + precision_baseline_store：逐层 hidden state 回归</text>

  <rect x="48" y="332" width="186" height="110" rx="8" fill="#ffffff" stroke="#0ca678"/>
  <text x="62" y="354" font-size="12.5" font-weight="700" fill="#0b7285">① 固定请求 + dump</text>
  <text x="62" y="374" font-size="11" fill="#495057">固定 PROMPT，max_tokens=2</text>
  <text x="62" y="392" font-size="11" fill="#495057">temperature=0</text>
  <text x="62" y="410" font-size="11" fill="#495057">首层 / 末层 / 每 8 层的</text>
  <text x="62" y="428" font-size="11" fill="#495057">self_attn 输入 hidden</text>

  <rect x="252" y="332" width="190" height="110" rx="8" fill="#ffffff" stroke="#0ca678"/>
  <text x="266" y="354" font-size="12.5" font-weight="700" fill="#0b7285">② 取最近的 baseline</text>
  <text x="266" y="374" font-size="11" fill="#495057">HF dataset 的 manifest</text>
  <text x="266" y="392" font-size="11" fill="#495057">同 model、同采集形状</text>
  <text x="266" y="410" font-size="11" fill="#495057">（capture_signature）才可比</text>
  <text x="266" y="428" font-size="11" fill="#e8590c">跳过 failed 的 run</text>

  <rect x="460" y="332" width="190" height="110" rx="8" fill="#ffffff" stroke="#0ca678"/>
  <text x="474" y="354" font-size="12.5" font-weight="700" fill="#0b7285">③ comparator</text>
  <text x="474" y="374" font-size="11" fill="#495057">每个张量算 rel_diff</text>
  <text x="474" y="394" font-size="11" font-family="monospace" fill="#495057">‖x−y‖²/(‖x‖²+‖y‖²)</text>
  <text x="474" y="414" font-size="11" font-family="monospace" fill="#495057">&lt; 1e-3（默认）</text>
  <text x="474" y="432" font-size="11" fill="#868e96">0 层可比也判失败</text>

  <rect x="668" y="332" width="184" height="52" rx="8" fill="#ffffff" stroke="#0ca678"/>
  <text x="682" y="354" font-size="12.5" font-weight="700" fill="#0b7285">passed</text>
  <text x="682" y="373" font-size="11" fill="#495057">今天的张量成为新 baseline</text>
  <rect x="668" y="390" width="184" height="52" rx="8" fill="#fff5f5" stroke="#fa5252"/>
  <text x="682" y="412" font-size="12.5" font-weight="700" fill="#c92a2a">failed</text>
  <text x="682" y="431" font-size="11" fill="#495057">上传留证，不当下次基准</text>

  <path d="M234 387 L248 387" fill="none" stroke="#868e96" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M442 387 L456 387" fill="none" stroke="#868e96" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M650 375 L664 360" fill="none" stroke="#868e96" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M650 400 L664 414" fill="none" stroke="#868e96" stroke-width="2" marker-end="url(#ar)"/>
  <path d="M852 358 L862 358 L862 460 L347 460 L347 446" fill="none" stroke="#0ca678" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arT)"/>
  <text x="604" y="480" text-anchor="middle" font-size="11" fill="#0b7285">只有通过的版本滚动成为下一次的 Golden Baseline</text>
  <text x="48" y="506" font-size="11.5" fill="#495057">rel_diff 只能说明「从哪一层开始不一样」，不回答输出质量；它负责定位，logprob 指标负责下结论。</text>
</svg>
