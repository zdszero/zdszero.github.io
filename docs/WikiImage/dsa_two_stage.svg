  <text x="30" y="80" font-size="11.5" fill="#3b5bdb">全部 S 个历史 token 的 indexer key</text>
  <text x="470" y="80" font-size="11.5" fill="#e8590c">只有被选中的 k 个 token 的 MLA KV 被读取</text>
  <path d="M31 108 L31 114 L429 114 L429 108" fill="none" stroke="#4c6ef5" stroke-width="1.5"/>
  <path d="M471 108 L471 114 L869 114 L869 108" fill="none" stroke="#f08c00" stroke-width="1.5"/>
  <rect x="30" y="126" width="400" height="132" rx="10" fill="#edf2ff" stroke="#4c6ef5" stroke-width="1"/>
  <rect x="30" y="126" width="400" height="26" rx="10" fill="#4c6ef5"/>
  <text x="44" y="144" font-size="13" fill="#ffffff" font-weight="700">① Lightning Indexer：挑</text>
  <text x="44" y="174" font-size="11.5" fill="#495057">64 head × 128 dim，单个 key head（MQA）</text>
  <text x="44" y="193" font-size="11.5" fill="#495057">fp8 · ReLU · 加权求和 · 无 softmax · 无 value</text>
  <text x="44" y="212" font-size="11.5" fill="#495057">输出 logits (Q, S) → 取 top-2048</text>
  <text x="44" y="246" font-size="12" fill="#4c6ef5" font-weight="700">单价 ≈ 2 × 64 × 128 ≈ 16K FLOPs / key（fp8）</text>
  <rect x="470" y="126" width="400" height="132" rx="10" fill="#f3f0ff" stroke="#7048e8" stroke-width="1"/>
  <rect x="470" y="126" width="400" height="26" rx="10" fill="#7048e8"/>
  <text x="484" y="144" font-size="13" fill="#ffffff" font-weight="700">② Sparse MLA：算</text>
  <text x="484" y="174" font-size="11.5" fill="#495057">128 head，absorb 形态：576 维点积 + 512 维加权</text>
  <text x="484" y="193" font-size="11.5" fill="#495057">按 top-k 的 token 位置 gather KV（不是 block）</text>
  <text x="484" y="212" font-size="11.5" fill="#495057">计算量 ∝ min(S, k)</text>
  <text x="484" y="246" font-size="12" fill="#7048e8" font-weight="700">单价 ≈ 2 × 128 × 1088 ≈ 278K FLOPs / key（bf16）</text>
  <path d="M432 192 L466 192" stroke="#f08c00" stroke-width="2" fill="none" marker-end="url(#aro)"/>
  <text x="449" y="182" font-size="10.5" fill="#e8590c" text-anchor="middle">top-k</text>
  <text x="30" y="286" font-size="12" fill="#212529" font-weight="700">每个 query token 的 attention 计算量（单层，按单价估算）</text>
  <path d="M90 294 L90 450 L566 450" fill="none" stroke="#adb5bd" stroke-width="1.2"/>
  <text x="90.0" y="466" font-size="10" fill="#868e96" text-anchor="middle" font-family="monospace">0K</text>
  <text x="207.5" y="466" font-size="10" fill="#868e96" text-anchor="middle" font-family="monospace">16K</text>
  <text x="325.0" y="466" font-size="10" fill="#868e96" text-anchor="middle" font-family="monospace">32K</text>
  <text x="442.5" y="466" font-size="10" fill="#868e96" text-anchor="middle" font-family="monospace">48K</text>
  <text x="560.0" y="466" font-size="10" fill="#868e96" text-anchor="middle" font-family="monospace">64K</text>
  <text x="586" y="454" font-size="10.5" fill="#868e96" font-family="monospace">S</text>
  <line x1="90" y1="403.125" x2="560" y2="403.125" stroke="#f1f3f5" stroke-width="1"/>
  <text x="84" y="407.125" font-size="10" fill="#868e96" text-anchor="end" font-family="monospace">0.5G</text>
  <line x1="90" y1="356.25" x2="560" y2="356.25" stroke="#f1f3f5" stroke-width="1"/>
  <text x="84" y="360.25" font-size="10" fill="#868e96" text-anchor="end" font-family="monospace">1.0G</text>
  <line x1="90" y1="309.375" x2="560" y2="309.375" stroke="#f1f3f5" stroke-width="1"/>
  <text x="84" y="313.375" font-size="10" fill="#868e96" text-anchor="end" font-family="monospace">1.5G</text>
  <path d="M90.0 450.0 L132.26618705035972 300.0" stroke="#adb5bd" stroke-width="2" fill="none" stroke-dasharray="5 3"/>
  <text x="138.26618705035972" y="312.0" font-size="10.5" fill="#868e96">dense MLA：278K·S（冲出图外）</text>
  <path d="M90.0 450.0 L105.04 396.624 L560.0 396.624" stroke="#7048e8" stroke-width="2" fill="none"/>
  <text x="398.4375" y="412.624" font-size="10.5" fill="#5f3dc4">sparse MLA：封顶 ≈ 0.57G</text>
  <path d="M90.0 450.0 L560.0 354.0" stroke="#4c6ef5" stroke-width="2" fill="none"/>
  <text x="501.25" y="358.0" font-size="10.5" fill="#3b5bdb" text-anchor="end">indexer：16K·S</text>
  <circle cx="351.32000000000005" cy="396.624" r="4" fill="#f08c00"/>
  <line x1="351.32000000000005" y1="396.624" x2="351.32000000000005" y2="450" stroke="#f08c00" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="357.32000000000005" y="444" font-size="10.5" fill="#e8590c">S ≈ 35K</text>
  <rect x="600" y="280" width="270" height="176" rx="10" fill="#fff4e6" stroke="#f08c00" stroke-width="1"/>
  <text x="614" y="304" font-size="13" fill="#e8590c" font-weight="700">读图</text>
  <text x="614" y="328" font-size="11.5" fill="#212529">S ≤ 2048：top-k 选中全部，</text>
  <text x="614" y="348" font-size="11.5" fill="#495057">sparse = dense，indexer 是纯开销</text>
  <text x="614" y="368" font-size="11.5" fill="#495057">→ prefill 回退 dense MHA</text>
  <text x="614" y="388" font-size="11.5" fill="#212529">S > 2048：MLA 不再增长</text>
  <text x="614" y="408" font-size="11.5" fill="#495057">S > 35K：indexer 反超 MLA，</text>
  <text x="614" y="428" font-size="11.5" fill="#495057">成为 attention 的主要计算</text>
  <rect x="30" y="476" width="840" height="54" rx="8" fill="#f8f9fa" stroke="#e9ecef" stroke-width="1"/>
  <text x="46" y="498" font-size="12" fill="#495057">DSA 省的是计算，不是显存：每个历史 token 的 MLA KV 都得留着（不知道哪天会被选中），还多了一份 indexer key。</text>
  <text x="46" y="516" font-size="12" fill="#495057">decode 时 T = 1；prefill 时每个 query 的曲线相同，总量再乘以 T。</text>
</svg>
