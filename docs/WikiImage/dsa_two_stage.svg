  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#212529">DSA 的两阶段：indexer 挑 token，sparse MLA 只算被选中的</text>
  <text x="450" y="56" text-anchor="middle" font-size="13" fill="#868e96">单价差一个数量级以上：便宜的阶段扫全部 S 个 key，贵的阶段只算 k = 2048 个</text>
