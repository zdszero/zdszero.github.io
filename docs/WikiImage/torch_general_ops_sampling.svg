<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="920" height="560" rx="12" fill="#ffffff"/>
  <text x="460" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#212529">top-k / top-p 采样：排序换坐标系，掩码在新坐标系里做，最后 gather 回原坐标</text>
  <text x="460" y="56" text-anchor="middle" font-size="13" fill="#868e96">一行请求、vocab = 6、top_k = 4、top_p = 0.8（对应 sampler.py 的 top_k_top_p_min_p_sampling_from_probs_torch）</text>

  <!-- row guides -->
  <g fill="#f8f9fa" stroke="#e9ecef">
    <rect x="28" y="76" width="864" height="52" rx="8"/>
    <rect x="28" y="136" width="864" height="78" rx="8"/>
    <rect x="28" y="222" width="864" height="52" rx="8"/>
    <rect x="28" y="282" width="864" height="78" rx="8"/>
    <rect x="28" y="368" width="864" height="52" rx="8"/>
    <rect x="28" y="428" width="864" height="52" rx="8"/>
  </g>

  <!-- step labels -->
  <g font-size="13" font-weight="700">
    <text x="44" y="100" fill="#212529">probs</text>
    <text x="44" y="160" fill="#5f3dc4">① sort(descending)</text>
    <text x="44" y="246" fill="#0b7285">② cumsum(dim=-1)</text>
    <text x="44" y="306" fill="#3b5bdb">③ 两个布尔掩码</text>
    <text x="44" y="392" fill="#3b5bdb">④ probs_sort[mask] = 0</text>
    <text x="44" y="452" fill="#e8590c">⑤ multinomial + gather</text>
  </g>
  <g font-size="11" fill="#868e96">
    <text x="44" y="118">按 token id 排列</text>
    <text x="44" y="178">值 + 原 token id 两份输出</text>
    <text x="44" y="194">（idx 记住“从哪来”）</text>
    <text x="44" y="264">前缀和，行内依赖</text>
    <text x="44" y="324">[1,V] 与 [B,1] 广播比较</text>
    <text x="44" y="340">任一为 True 即置 0</text>
    <text x="44" y="410">布尔索引赋值 = index_put_</text>
    <text x="44" y="470">在排序坐标里抽到位置 1</text>
  </g>

  <!-- op family tags -->
  <g font-size="11" font-weight="700" text-anchor="middle">
    <rect x="790" y="90" width="90" height="22" rx="11" fill="#f1f3f5" stroke="#adb5bd"/><text x="835" y="105" fill="#495057">输入</text>
    <rect x="790" y="164" width="90" height="22" rx="11" fill="#e6fcf5" stroke="#0ca678"/><text x="835" y="179" fill="#0b7285">行内排序</text>
    <rect x="790" y="236" width="90" height="22" rx="11" fill="#e6fcf5" stroke="#0ca678"/><text x="835" y="251" fill="#0b7285">扫描</text>
    <rect x="790" y="310" width="90" height="22" rx="11" fill="#edf2ff" stroke="#4c6ef5"/><text x="835" y="325" fill="#3b5bdb">逐元素+广播</text>
    <rect x="790" y="382" width="90" height="22" rx="11" fill="#f3f0ff" stroke="#7048e8"/><text x="835" y="397" fill="#5f3dc4">按掩码写回</text>
    <rect x="790" y="442" width="90" height="22" rx="11" fill="#f3f0ff" stroke="#7048e8"/><text x="835" y="457" fill="#5f3dc4">gather</text>
  </g>
  <!-- row 1: probs in vocab order -->
  <g fill="#f1f3f5" stroke="#adb5bd">
    <rect x="340" y="82" width="62" height="24" rx="5"/><rect x="412" y="82" width="62" height="24" rx="5"/>
    <rect x="484" y="82" width="62" height="24" rx="5"/><rect x="556" y="82" width="62" height="24" rx="5"/>
    <rect x="628" y="82" width="62" height="24" rx="5"/><rect x="700" y="82" width="62" height="24" rx="5"/>
  </g>
  <g font-family="monospace" font-size="12" font-weight="700" fill="#495057" text-anchor="middle">
    <text x="371" y="99">0.06</text><text x="443" y="99">0.12</text><text x="515" y="99">0.04</text>
    <text x="587" y="99">0.40</text><text x="659" y="99">0.08</text><text x="731" y="99">0.30</text>
  </g>
  <g font-family="monospace" font-size="10" fill="#868e96" text-anchor="middle">
    <text x="371" y="121">id 0</text><text x="443" y="121">id 1</text><text x="515" y="121">id 2</text>
    <text x="587" y="121">id 3</text><text x="659" y="121">id 4</text><text x="731" y="121">id 5</text>
  </g>

  <!-- row 2: sort -->
  <g font-family="monospace" font-size="10.5" fill="#868e96" text-anchor="end">
    <text x="332" y="161">val</text><text x="332" y="193">idx</text>
    <text x="332" y="249">sum</text><text x="332" y="307">pos≥4</text><text x="332" y="339">前缀&gt;0.8</text>
  </g>
  <g fill="#f3f0ff" stroke="#7048e8">
    <rect x="340" y="144" width="62" height="24" rx="5"/><rect x="412" y="144" width="62" height="24" rx="5"/>
    <rect x="484" y="144" width="62" height="24" rx="5"/><rect x="556" y="144" width="62" height="24" rx="5"/>
    <rect x="628" y="144" width="62" height="24" rx="5"/><rect x="700" y="144" width="62" height="24" rx="5"/>
    <rect x="340" y="176" width="62" height="24" rx="5"/>
    <rect x="484" y="176" width="62" height="24" rx="5"/><rect x="556" y="176" width="62" height="24" rx="5"/>
    <rect x="628" y="176" width="62" height="24" rx="5"/><rect x="700" y="176" width="62" height="24" rx="5"/>
  </g>
  <rect x="412" y="176" width="62" height="24" rx="5" fill="#fff9db" stroke="#f08c00" stroke-width="2"/>
  <g font-family="monospace" font-size="12" font-weight="700" fill="#5f3dc4" text-anchor="middle">
    <text x="371" y="161">0.40</text><text x="443" y="161">0.30</text><text x="515" y="161">0.12</text>
    <text x="587" y="161">0.08</text><text x="659" y="161">0.06</text><text x="731" y="161">0.04</text>
    <text x="371" y="193">3</text><text x="443" y="193" fill="#e8590c">5</text><text x="515" y="193">1</text>
    <text x="587" y="193">4</text><text x="659" y="193">0</text><text x="731" y="193">2</text>
  </g>

  <!-- row 3: cumsum -->
  <g fill="#e6fcf5" stroke="#0ca678">
    <rect x="340" y="236" width="62" height="24" rx="5"/><rect x="412" y="236" width="62" height="24" rx="5"/>
    <rect x="484" y="236" width="62" height="24" rx="5"/><rect x="556" y="236" width="62" height="24" rx="5"/>
    <rect x="628" y="236" width="62" height="24" rx="5"/><rect x="700" y="236" width="62" height="24" rx="5"/>
  </g>
  <g font-family="monospace" font-size="12" font-weight="700" fill="#0b7285" text-anchor="middle">
    <text x="371" y="253">0.40</text><text x="443" y="253">0.70</text><text x="515" y="253">0.82</text>
    <text x="587" y="253">0.90</text><text x="659" y="253">0.96</text><text x="731" y="253">1.00</text>
  </g>

  <!-- row 4: masks -->
  <g fill="#edf2ff" stroke="#4c6ef5">
    <rect x="340" y="290" width="62" height="24" rx="5"/><rect x="412" y="290" width="62" height="24" rx="5"/>
    <rect x="484" y="290" width="62" height="24" rx="5"/><rect x="556" y="290" width="62" height="24" rx="5"/>
    <rect x="340" y="322" width="62" height="24" rx="5"/><rect x="412" y="322" width="62" height="24" rx="5"/>
    <rect x="484" y="322" width="62" height="24" rx="5"/>
  </g>
  <g fill="#fff5f5" stroke="#fa5252">
    <rect x="628" y="290" width="62" height="24" rx="5"/><rect x="700" y="290" width="62" height="24" rx="5"/>
    <rect x="556" y="322" width="62" height="24" rx="5"/><rect x="628" y="322" width="62" height="24" rx="5"/>
    <rect x="700" y="322" width="62" height="24" rx="5"/>
  </g>
  <g font-family="monospace" font-size="11.5" font-weight="700" text-anchor="middle">
    <text x="371" y="307" fill="#3b5bdb">F</text><text x="443" y="307" fill="#3b5bdb">F</text>
    <text x="515" y="307" fill="#3b5bdb">F</text><text x="587" y="307" fill="#3b5bdb">F</text>
    <text x="659" y="307" fill="#c92a2a">T</text><text x="731" y="307" fill="#c92a2a">T</text>
    <text x="371" y="339" fill="#3b5bdb">0.00 F</text><text x="443" y="339" fill="#3b5bdb">0.40 F</text>
    <text x="515" y="339" fill="#3b5bdb">0.70 F</text><text x="587" y="339" fill="#c92a2a">0.82 T</text>
    <text x="659" y="339" fill="#c92a2a">0.90 T</text><text x="731" y="339" fill="#c92a2a">0.96 T</text>
  </g>
  <!-- row 5: masked result -->
  <g fill="#f3f0ff" stroke="#7048e8">
    <rect x="340" y="382" width="62" height="24" rx="5"/><rect x="412" y="382" width="62" height="24" rx="5"/>
    <rect x="484" y="382" width="62" height="24" rx="5"/>
  </g>
  <g fill="#f8f9fa" stroke="#dee2e6" stroke-dasharray="3 3">
    <rect x="556" y="382" width="62" height="24" rx="5"/><rect x="628" y="382" width="62" height="24" rx="5"/>
    <rect x="700" y="382" width="62" height="24" rx="5"/>
  </g>
  <g font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">
    <text x="371" y="399" fill="#5f3dc4">0.40</text><text x="443" y="399" fill="#5f3dc4">0.30</text>
    <text x="515" y="399" fill="#5f3dc4">0.12</text><text x="587" y="399" fill="#adb5bd">0</text>
    <text x="659" y="399" fill="#adb5bd">0</text><text x="731" y="399" fill="#adb5bd">0</text>
  </g>

  <!-- row 6: sample + gather -->
  <g font-family="monospace" font-size="12.5" font-weight="700" fill="#e8590c">
    <text x="340" y="459">sampled_index = 1  →  probs_idx[1] = 5  →  token 5</text>
  </g>

  <rect x="28" y="492" width="864" height="54" rx="9" fill="#f8f9fa" stroke="#e9ecef"/>
  <text x="46" y="514" font-size="12" fill="#495057">sort 把“按 token id 排列”换成“按概率降序排列”，top-k 退化为比较位置、top-p 退化为比较前缀和，都是一次广播比较；</text>
  <text x="46" y="533" font-size="12" fill="#495057">用 cumsum − self（不含自身的前缀）判断，越过阈值的那个 token 仍被保留。抽到的是排序坐标里的位置，必须 gather(probs_idx) 映回 token id。</text>
</svg>
