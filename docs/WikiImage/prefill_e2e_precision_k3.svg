<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="500" rx="12" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#212529">只用实际 token 的 logprob 估计 KL：k3 估计量</text>
  <text x="450" y="56" text-anchor="middle" font-size="13" fill="#868e96">SGLang compare_kl_divergence 对每个位置算 (e^δ − 1) − δ，δ = log p_input − log p_output</text>

  <!-- plot panel -->
  <rect x="30" y="76" width="520" height="340" rx="10" fill="#ffffff" stroke="#dee2e6"/>
  <rect x="256" y="160" width="88" height="200" fill="#e6fcf5" opacity="0.7"/>
  <text x="300" y="152" text-anchor="middle" font-size="10.5" fill="#0b7285">|δ| 小：两条曲线重合</text>
  <!-- grid -->
  <line x1="80" y1="310" x2="520" y2="310" stroke="#f1f3f5"/>
  <line x1="80" y1="260" x2="520" y2="260" stroke="#f1f3f5"/>
  <line x1="80" y1="210" x2="520" y2="210" stroke="#f1f3f5"/>
  <line x1="80" y1="160" x2="520" y2="160" stroke="#f1f3f5"/>
  <!-- axes -->
  <line x1="80" y1="360" x2="520" y2="360" stroke="#adb5bd"/>
  <line x1="300" y1="160" x2="300" y2="360" stroke="#adb5bd"/>
  <text x="153.3" y="378" text-anchor="middle" font-size="11" font-family="monospace" fill="#868e96">−1</text>
  <text x="300" y="378" text-anchor="middle" font-size="11" font-family="monospace" fill="#868e96">0</text>
  <text x="446.7" y="378" text-anchor="middle" font-size="11" font-family="monospace" fill="#868e96">+1</text>
  <text x="300" y="400" text-anchor="middle" font-size="11.5" fill="#495057">δ = Δlog p（单个位置）</text>
  <text x="72" y="314" text-anchor="end" font-size="10.5" font-family="monospace" fill="#868e96">0.5</text>
  <text x="72" y="264" text-anchor="end" font-size="10.5" font-family="monospace" fill="#868e96">1.0</text>
  <text x="72" y="214" text-anchor="end" font-size="10.5" font-family="monospace" fill="#868e96">1.5</text>
  <text x="72" y="164" text-anchor="end" font-size="10.5" font-family="monospace" fill="#868e96">2.0</text>
  <!-- curves -->
  <polyline fill="none" stroke="#868e96" stroke-width="2" stroke-dasharray="5 4" points="80.0,247.5 87.3,254.9 94.7,262.0 102.0,268.9 109.3,275.5 116.7,281.9 124.0,288.0 131.3,293.9 138.7,299.5 146.0,304.9 153.3,310.0 160.7,314.9 168.0,319.5 175.3,323.9 182.7,328.0 190.0,331.9 197.3,335.5 204.7,338.9 212.0,342.0 219.3,344.9 226.7,347.5 234.0,349.9 241.3,352.0 248.7,353.9 256.0,355.5 263.3,356.9 270.7,358.0 278.0,358.9 285.3,359.5 292.7,359.9 300.0,360.0 307.3,359.9 314.7,359.5 322.0,358.9 329.3,358.0 336.7,356.9 344.0,355.5 351.3,353.9 358.7,352.0 366.0,349.9 373.3,347.5 380.7,344.9 388.0,342.0 395.3,338.9 402.7,335.5 410.0,331.9 417.3,328.0 424.7,323.9 432.0,319.5 439.3,314.9 446.7,310.0 454.0,304.9 461.3,299.5 468.7,293.9 476.0,288.0 483.3,281.9 490.7,275.5 498.0,268.9 505.3,262.0 512.7,254.9 520.0,247.5"/>
  <polyline fill="none" stroke="#7048e8" stroke-width="2.5" points="80.0,287.7 87.3,291.5 94.7,295.3 102.0,299.1 109.3,302.7 116.7,306.3 124.0,309.9 131.3,313.3 138.7,316.7 146.0,320.0 153.3,323.2 160.7,326.3 168.0,329.3 175.3,332.3 182.7,335.1 190.0,337.8 197.3,340.3 204.7,342.8 212.0,345.1 219.3,347.3 226.7,349.3 234.0,351.2 241.3,353.0 248.7,354.5 256.0,355.9 263.3,357.1 270.7,358.1 278.0,358.9 285.3,359.5 292.7,359.9 300.0,360.0 307.3,359.9 314.7,359.5 322.0,358.8 329.3,357.9 336.7,356.6 344.0,355.0 351.3,353.1 358.7,350.8 366.0,348.2 373.3,345.1 380.7,341.7 388.0,337.8 395.3,333.4 402.7,328.6 410.0,323.3 417.3,317.4 424.7,311.0 432.0,304.0 439.3,296.4 446.7,288.2 454.0,279.2 461.3,269.6 468.7,259.2 476.0,248.0 483.3,236.0 490.7,223.1 498.0,209.3 505.3,194.5 512.7,178.7 520.0,161.8"/>
  <!-- curve labels -->
  <text x="470" y="200" text-anchor="end" font-size="12" font-weight="700" fill="#5f3dc4">(e^δ − 1) − δ</text>
  <text x="90" y="236" font-size="12" fill="#868e96">½ δ²（= ½ 平方误差）</text>
  <text x="88" y="348" font-size="10.5" fill="#5f3dc4">δ &lt; 0：近似线性</text>
  <text x="420" y="250" text-anchor="end" font-size="10.5" fill="#5f3dc4">δ &gt; 0：指数增长</text>

  <!-- right column -->
  <rect x="570" y="76" width="300" height="74" rx="10" fill="#f3f0ff" stroke="#7048e8"/>
  <text x="586" y="100" font-size="13" font-weight="700" fill="#5f3dc4">期望 = KL</text>
  <text x="586" y="120" font-size="11.5" fill="#495057">token 若采样自 P_output，则</text>
  <text x="586" y="138" font-size="11" font-family="monospace" fill="#495057">E[k3] = KL(P_output ‖ P_input)</text>

  <rect x="570" y="160" width="300" height="74" rx="10" fill="#e6fcf5" stroke="#0ca678"/>
  <text x="586" y="184" font-size="13" font-weight="700" fill="#0b7285">小误差 ≈ ½ MSE</text>
  <text x="586" y="204" font-size="11.5" fill="#495057">泰勒展开 e^δ − 1 − δ = ½δ² + O(δ³)，</text>
  <text x="586" y="222" font-size="11.5" fill="#495057">数值噪声区间里它就是半个 logprob MSE</text>

  <rect x="570" y="244" width="300" height="74" rx="10" fill="#fff9db" stroke="#f08c00"/>
  <text x="586" y="268" font-size="13" font-weight="700" fill="#e8590c">恒 ≥ 0，且不对称</text>
  <text x="586" y="288" font-size="11.5" fill="#495057">正负误差不会相互抵消；input 侧把实际</text>
  <text x="586" y="306" font-size="11.5" fill="#495057">token 估得比 output 侧高（δ &gt; 0）罚得更重</text>

  <rect x="570" y="328" width="300" height="88" rx="10" fill="#f8f9fa" stroke="#adb5bd"/>
  <text x="586" y="352" font-size="13" font-weight="700" fill="#495057">代价：只需 1 个数 / 位置</text>
  <text x="586" y="372" font-size="11.5" fill="#495057">不必取回 V 维分布，普通的</text>
  <text x="586" y="390" font-size="11.5" fill="#495057">return_logprob 接口就够；greedy 下</text>
  <text x="586" y="408" font-size="11.5" fill="#495057">不是严格采样，只算近似 KL 信号</text>

  <!-- note -->
  <rect x="30" y="430" width="840" height="54" rx="10" fill="#f8f9fa" stroke="#e9ecef"/>
  <text x="48" y="453" font-size="12" fill="#495057">它把「只比较实际 token logprob」的低成本，和 KL 的语义（非负、以参考分布为期望）接到了一起；</text>
  <text x="48" y="472" font-size="12" fill="#495057">误差小时，它和 MSE 只差一个常数 ½——所以文首说 MSE 是有效的回归信号，并不是巧合。</text>
</svg>
