<text x="48.0" y="970.0" font-size="12" fill="#495057" text-anchor="start">研发费用已在净利润中扣除；比值低说明利润之外还要持续投钱。高速改扩建和新路投资让宁沪、山东的 7 年累计 FCF 接近零或为负，</text>
<text x="48.0" y="988.0" font-size="12" fill="#495057" text-anchor="start">分红靠新增借款维持。数据：东方财富 F10 年报，2019—2025 年合计，提取于 2026-11-23。</text>
