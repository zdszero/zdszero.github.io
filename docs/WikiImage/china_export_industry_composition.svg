<text x="48.0" y="710.0" font-size="12" fill="#495057" text-anchor="start">机电产品 16.47 万亿元，占 61.0%；高新技术产品 6.78 万亿元，占 25.1%（两者有重叠）。七类劳动密集型商品是本文按海关表加总，合计 4.07 万</text>
