<text x="48.0" y="640.0" font-size="12" fill="#495057" text-anchor="start">外销更高的典型是国内价格战或需求下行的行业：工程机械、光伏、风电、造船、钢铁，以及以海外客户为主的光模块与 CXO。内销更高的多是国内品</text>
<text x="48.0" y="658.0" font-size="12" fill="#495057" text-anchor="start">牌强、海外靠代工或收购品牌的公司，如格力、海信家电、顾家家居。</text>
<text x="48.0" y="676.0" font-size="12" fill="#495057" text-anchor="start">未标名的小点依次为比亚迪、徐工、中联、潍柴、美的、新易盛、赛轮、玲珑、恒立、三花、思源、中天、亿纬、上汽、紫金、汇川（外销更高），长</text>
<text x="48.0" y="694.0" font-size="12" fill="#495057" text-anchor="start">城、海尔（内销更高）。未纳入：工业富联、歌尔、迈瑞（未披露分地区毛利），传音、华利、巨星（无内销分部），匠心家居（内销不足 1%），洛阳</text>
<text x="48.0" y="712.0" font-size="12" fill="#495057" text-anchor="start">钼业（分部含贸易），两家游戏公司（毛利率 67%—78%）。</text>
