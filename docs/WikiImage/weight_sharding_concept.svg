  <rect x="210" y="246" width="160" height="176" rx="10" fill="#f8f9fa" stroke="#e9ecef"/>
  <text x="222" y="272" font-size="11" fill="#868e96">L1</text><rect x="244" y="258" width="112" height="20" rx="4" fill="none" stroke="#ced4da" stroke-dasharray="4 3"/><rect x="244" y="258" width="28" height="20" rx="3" fill="#edf2ff" stroke="#4c6ef5"/><text x="258" y="272" text-anchor="middle" font-size="10" font-family="monospace" fill="#3b5bdb">W0</text>
  <text x="222" y="298" font-size="11" fill="#868e96">L2</text><rect x="244" y="284" width="112" height="20" rx="4" fill="none" stroke="#ced4da" stroke-dasharray="4 3"/><rect x="244" y="284" width="28" height="20" rx="3" fill="#edf2ff" stroke="#4c6ef5"/><text x="258" y="298" text-anchor="middle" font-size="10" font-family="monospace" fill="#3b5bdb">W0</text>
  <text x="222" y="324" font-size="11" fill="#868e96">L3</text><rect x="244" y="310" width="112" height="20" rx="4" fill="none" stroke="#ced4da" stroke-dasharray="4 3"/><rect x="244" y="310" width="28" height="20" rx="3" fill="#edf2ff" stroke="#4c6ef5"/><text x="258" y="324" text-anchor="middle" font-size="10" font-family="monospace" fill="#3b5bdb">W0</text>
  <text x="222" y="350" font-size="11" fill="#868e96">L4</text><rect x="244" y="336" width="112" height="20" rx="4" fill="none" stroke="#ced4da" stroke-dasharray="4 3"/><rect x="244" y="336" width="28" height="20" rx="3" fill="#edf2ff" stroke="#4c6ef5"/><text x="258" y="350" text-anchor="middle" font-size="10" font-family="monospace" fill="#3b5bdb">W0</text>
  <rect x="244" y="366" width="54" height="36" rx="6" fill="#e6fcf5" stroke="#0ca678"/><text x="271" y="388" text-anchor="middle" font-size="11" fill="#0b7285">slot A</text>
  <rect x="302" y="366" width="54" height="36" rx="6" fill="#e6fcf5" stroke="#0ca678"/><text x="329" y="388" text-anchor="middle" font-size="11" fill="#0b7285">slot B</text>

  <rect x="380" y="246" width="160" height="176" rx="10" fill="#f8f9fa" stroke="#e9ecef"/>
  <text x="392" y="272" font-size="11" fill="#868e96">L1</text><rect x="414" y="258" width="112" height="20" rx="4" fill="none" stroke="#ced4da" stroke-dasharray="4 3"/><rect x="442" y="258" width="28" height="20" rx="3" fill="#edf2ff" stroke="#4c6ef5"/><text x="456" y="272" text-anchor="middle" font-size="10" font-family="monospace" fill="#3b5bdb">W1</text>
  <text x="392" y="298" font-size="11" fill="#868e96">L2</text><rect x="414" y="284" width="112" height="20" rx="4" fill="none" stroke="#ced4da" stroke-dasharray="4 3"/><rect x="442" y="284" width="28" height="20" rx="3" fill="#edf2ff" stroke="#4c6ef5"/><text x="456" y="298" text-anchor="middle" font-size="10" font-family="monospace" fill="#3b5bdb">W1</text>
  <text x="392" y="324" font-size="11" fill="#868e96">L3</text><rect x="414" y="310" width="112" height="20" rx="4" fill="none" stroke="#ced4da" stroke-dasharray="4 3"/><rect x="442" y="310" width="28" height="20" rx="3" fill="#edf2ff" stroke="#4c6ef5"/><text x="456" y="324" text-anchor="middle" font-size="10" font-family="monospace" fill="#3b5bdb">W1</text>
  <text x="392" y="350" font-size="11" fill="#868e96">L4</text><rect x="414" y="336" width="112" height="20" rx="4" fill="none" stroke="#ced4da" stroke-dasharray="4 3"/><rect x="442" y="336" width="28" height="20" rx="3" fill="#edf2ff" stroke="#4c6ef5"/><text x="456" y="350" text-anchor="middle" font-size="10" font-family="monospace" fill="#3b5bdb">W1</text>
  <rect x="414" y="366" width="54" height="36" rx="6" fill="#e6fcf5" stroke="#0ca678"/><text x="441" y="388" text-anchor="middle" font-size="11" fill="#0b7285">slot A</text>
  <rect x="472" y="366" width="54" height="36" rx="6" fill="#e6fcf5" stroke="#0ca678"/><text x="499" y="388" text-anchor="middle" font-size="11" fill="#0b7285">slot B</text>
  <rect x="550" y="246" width="160" height="176" rx="10" fill="#f8f9fa" stroke="#e9ecef"/>
  <text x="562" y="272" font-size="11" fill="#868e96">L1</text><rect x="584" y="258" width="112" height="20" rx="4" fill="none" stroke="#ced4da" stroke-dasharray="4 3"/><rect x="640" y="258" width="28" height="20" rx="3" fill="#edf2ff" stroke="#4c6ef5"/><text x="654" y="272" text-anchor="middle" font-size="10" font-family="monospace" fill="#3b5bdb">W2</text>
  <text x="562" y="298" font-size="11" fill="#868e96">L2</text><rect x="584" y="284" width="112" height="20" rx="4" fill="none" stroke="#ced4da" stroke-dasharray="4 3"/><rect x="640" y="284" width="28" height="20" rx="3" fill="#edf2ff" stroke="#4c6ef5"/><text x="654" y="298" text-anchor="middle" font-size="10" font-family="monospace" fill="#3b5bdb">W2</text>
  <text x="562" y="324" font-size="11" fill="#868e96">L3</text><rect x="584" y="310" width="112" height="20" rx="4" fill="none" stroke="#ced4da" stroke-dasharray="4 3"/><rect x="640" y="310" width="28" height="20" rx="3" fill="#edf2ff" stroke="#4c6ef5"/><text x="654" y="324" text-anchor="middle" font-size="10" font-family="monospace" fill="#3b5bdb">W2</text>
  <text x="562" y="350" font-size="11" fill="#868e96">L4</text><rect x="584" y="336" width="112" height="20" rx="4" fill="none" stroke="#ced4da" stroke-dasharray="4 3"/><rect x="640" y="336" width="28" height="20" rx="3" fill="#edf2ff" stroke="#4c6ef5"/><text x="654" y="350" text-anchor="middle" font-size="10" font-family="monospace" fill="#3b5bdb">W2</text>
  <rect x="584" y="366" width="54" height="36" rx="6" fill="#e6fcf5" stroke="#0ca678"/><text x="611" y="388" text-anchor="middle" font-size="11" fill="#0b7285">slot A</text>
  <rect x="642" y="366" width="54" height="36" rx="6" fill="#e6fcf5" stroke="#0ca678"/><text x="669" y="388" text-anchor="middle" font-size="11" fill="#0b7285">slot B</text>

  <rect x="720" y="246" width="160" height="176" rx="10" fill="#f8f9fa" stroke="#e9ecef"/>
