<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="500" rx="12" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#212529">存储分片，计算不分片</text>
  <text x="450" y="56" text-anchor="middle" font-size="13" fill="#868e96">N=4 示意：常驻时每卡只放每层的 1/N 行；用到哪一层，才把那一层拼回一块 workspace</text>

  <!-- column headers -->
  <text x="290" y="88" text-anchor="middle" font-size="13" font-weight="700" fill="#495057">GPU 0</text>
  <text x="460" y="88" text-anchor="middle" font-size="13" font-weight="700" fill="#495057">GPU 1</text>
  <text x="630" y="88" text-anchor="middle" font-size="13" font-weight="700" fill="#495057">GPU 2</text>
  <text x="800" y="88" text-anchor="middle" font-size="13" font-weight="700" fill="#495057">GPU 3</text>

  <!-- row 1 labels -->
  <text x="24" y="140" font-size="14" font-weight="700" fill="#212529">Replicated</text>
  <text x="24" y="160" font-size="12" fill="#495057">每卡一份完整副本</text>
  <text x="24" y="180" font-size="12" font-family="monospace" fill="#e8590c">常驻 ≈ R</text>

  <!-- row 2 labels -->
  <text x="24" y="296" font-size="14" font-weight="700" fill="#212529">Weight shard</text>
  <text x="24" y="316" font-size="12" fill="#495057">每卡存每层的 1/N 行</text>
  <text x="24" y="336" font-size="12" font-family="monospace" fill="#3b5bdb">常驻 ≈ R/N</text>
  <text x="24" y="384" font-size="12" fill="#0b7285">+ 2 块 full workspace</text>
  <text x="24" y="402" font-size="11" fill="#868e96">各层轮流复用（ping-pong）</text>
  <!-- row 1 cells: full copy of every layer on every GPU -->
  <rect x="210" y="100" width="160" height="126" rx="10" fill="#f8f9fa" stroke="#e9ecef"/>
  <text x="222" y="126" font-size="11" fill="#868e96">L1</text><rect x="244" y="112" width="112" height="20" rx="4" fill="#fff4e6" stroke="#f08c00"/><text x="300" y="126" text-anchor="middle" font-size="11" fill="#e8590c">完整</text>
  <text x="222" y="152" font-size="11" fill="#868e96">L2</text><rect x="244" y="138" width="112" height="20" rx="4" fill="#fff4e6" stroke="#f08c00"/><text x="300" y="152" text-anchor="middle" font-size="11" fill="#e8590c">完整</text>
  <text x="222" y="178" font-size="11" fill="#868e96">L3</text><rect x="244" y="164" width="112" height="20" rx="4" fill="#fff4e6" stroke="#f08c00"/><text x="300" y="178" text-anchor="middle" font-size="11" fill="#e8590c">完整</text>
  <text x="222" y="204" font-size="11" fill="#868e96">L4</text><rect x="244" y="190" width="112" height="20" rx="4" fill="#fff4e6" stroke="#f08c00"/><text x="300" y="204" text-anchor="middle" font-size="11" fill="#e8590c">完整</text>

  <rect x="380" y="100" width="160" height="126" rx="10" fill="#f8f9fa" stroke="#e9ecef"/>
  <text x="392" y="126" font-size="11" fill="#868e96">L1</text><rect x="414" y="112" width="112" height="20" rx="4" fill="#fff4e6" stroke="#f08c00" stroke-dasharray="5 3"/><text x="470" y="126" text-anchor="middle" font-size="11" fill="#e8590c">副本</text>
