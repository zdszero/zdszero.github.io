  <text x="392" y="178" font-size="11" fill="#868e96">L3</text><rect x="414" y="164" width="112" height="20" rx="4" fill="#fff4e6" stroke="#f08c00" stroke-dasharray="5 3"/><text x="470" y="178" text-anchor="middle" font-size="11" fill="#e8590c">副本</text>
  <text x="392" y="204" font-size="11" fill="#868e96">L4</text><rect x="414" y="190" width="112" height="20" rx="4" fill="#fff4e6" stroke="#f08c00" stroke-dasharray="5 3"/><text x="470" y="204" text-anchor="middle" font-size="11" fill="#e8590c">副本</text>

  <rect x="550" y="100" width="160" height="126" rx="10" fill="#f8f9fa" stroke="#e9ecef"/>
  <text x="562" y="126" font-size="11" fill="#868e96">L1</text><rect x="584" y="112" width="112" height="20" rx="4" fill="#fff4e6" stroke="#f08c00" stroke-dasharray="5 3"/><text x="640" y="126" text-anchor="middle" font-size="11" fill="#e8590c">副本</text>
