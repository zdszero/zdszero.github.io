  <text x="562" y="178" font-size="11" fill="#868e96">L3</text><rect x="584" y="164" width="112" height="20" rx="4" fill="#fff4e6" stroke="#f08c00" stroke-dasharray="5 3"/><text x="640" y="178" text-anchor="middle" font-size="11" fill="#e8590c">副本</text>
  <text x="562" y="204" font-size="11" fill="#868e96">L4</text><rect x="584" y="190" width="112" height="20" rx="4" fill="#fff4e6" stroke="#f08c00" stroke-dasharray="5 3"/><text x="640" y="204" text-anchor="middle" font-size="11" fill="#e8590c">副本</text>

  <rect x="720" y="100" width="160" height="126" rx="10" fill="#f8f9fa" stroke="#e9ecef"/>
  <text x="732" y="126" font-size="11" fill="#868e96">L1</text><rect x="754" y="112" width="112" height="20" rx="4" fill="#fff4e6" stroke="#f08c00" stroke-dasharray="5 3"/><text x="810" y="126" text-anchor="middle" font-size="11" fill="#e8590c">副本</text>
  <text x="732" y="152" font-size="11" fill="#868e96">L2</text><rect x="754" y="138" width="112" height="20" rx="4" fill="#fff4e6" stroke="#f08c00" stroke-dasharray="5 3"/><text x="810" y="152" text-anchor="middle" font-size="11" fill="#e8590c">副本</text>
  <text x="732" y="178" font-size="11" fill="#868e96">L3</text><rect x="754" y="164" width="112" height="20" rx="4" fill="#fff4e6" stroke="#f08c00" stroke-dasharray="5 3"/><text x="810" y="178" text-anchor="middle" font-size="11" fill="#e8590c">副本</text>
