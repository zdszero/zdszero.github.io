  <rect x="812" y="366" width="54" height="36" rx="6" fill="#e6fcf5" stroke="#0ca678"/><text x="839" y="388" text-anchor="middle" font-size="11" fill="#0b7285">slot B</text>

  <!-- note -->
  <rect x="24" y="440" width="852" height="44" rx="8" fill="#f8f9fa" stroke="#e9ecef"/>
  <text x="450" y="467" text-anchor="middle" font-size="12" fill="#495057">forward 前用一次 AllGather 把第 ℓ 层的 N 片拼进一块 slot，GEMM 看到的仍是完整 W；省下约 (1 − 1/N)·R，代价是每层一次权重通信</text>
