<text x="46.0" y="590.0" font-size="12" fill="#495057" text-anchor="start">这些名字背后只有一个问题：前一方的力量是否被后一方吞掉，吞掉了多少。吞没 &gt; 刺透，三根 &gt; 两根。</text>
<text x="46.0" y="609.0" font-size="12" fill="#495057" text-anchor="start">组合越复杂越少见，样本也越少。比起背名字，更重要的是看出“谁在最后几根里收复了失地”。</text>
</svg>
