  <text x="44" y="328" font-size="12" font-weight="700" fill="#212529">为什么这样切</text>
  <text x="44" y="347" font-size="11.5" fill="#495057">· 偶数段从 bank 写入层开始，奇数段只透传 bank → 跨机边 s7→s8 可在 s7 forward 前先发 bank（eager bank）。</text>
  <text x="44" y="366" font-size="11.5" fill="#495057">· 长前缀下 MLA 的代价随 prefix 增长，KDA 不随之增长；5 层段多 1 个 MLA，层数少 2 层，让两种段在负载上大致持平。</text>
  <text x="44" y="385" font-size="11.5" fill="#495057">· s15 只放 3 层：它还要做输出侧 attn-res 聚合、final norm、lm_head 采样，以及把 DSPARK draft context KV 写进 draft pool。</text>
