<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 330" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="920" height="330" rx="12" fill="#ffffff"/>
  <text x="460" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#212529">lazy alloc：decode 的 KV 只在“马上要传”时才占用</text>
  <text x="460" y="56" text-anchor="middle" font-size="13" fill="#868e96">同一个长 prompt 请求的时间线；红色条是 decode 侧 KV / state 被占着却没在用的时间</text>

  <g font-size="12" font-weight="700">
    <text x="24" y="98" fill="#3b5bdb">prefill</text>
    <text x="24" y="148" fill="#c92a2a">decode · 旧</text>
    <text x="24" y="198" fill="#0b7285">decode · 新</text>
  </g>

  <!-- prefill lane -->
  <rect x="130" y="82" width="180" height="26" rx="5" fill="#f1f3f5" stroke="#adb5bd"/>
  <text x="220" y="99" text-anchor="middle" font-size="11" fill="#495057">在 prefill 排队</text>
  <rect x="310" y="82" width="380" height="26" rx="5" fill="#edf2ff" stroke="#4c6ef5"/>
  <text x="500" y="99" text-anchor="middle" font-size="11" fill="#3b5bdb">PP16 计算（非最后 chunk 先缓存在 P 侧）</text>
  <rect x="690" y="82" width="90" height="26" rx="5" fill="#fff4e6" stroke="#f08c00"/>
  <text x="735" y="99" text-anchor="middle" font-size="11" fill="#e8590c">传 KV</text>

  <!-- old decode -->
  <rect x="130" y="132" width="560" height="26" rx="5" fill="#fff5f5" stroke="#fa5252"/>
  <text x="410" y="149" text-anchor="middle" font-size="11" fill="#c92a2a">请求一到就分配 KV 与 KDA state 槽位，干等 prefill</text>
  <rect x="690" y="132" width="90" height="26" rx="5" fill="#fff4e6" stroke="#f08c00"/>
  <text x="735" y="149" text-anchor="middle" font-size="11" fill="#e8590c">收 KV</text>
  <rect x="780" y="132" width="110" height="26" rx="5" fill="#e6fcf5" stroke="#0ca678"/>
  <text x="835" y="149" text-anchor="middle" font-size="11" fill="#0b7285">decode</text>

  <!-- new decode -->
  <rect x="130" y="182" width="560" height="26" rx="5" fill="#f8f9fa" stroke="#e9ecef" stroke-dasharray="4 3"/>
  <text x="410" y="199" text-anchor="middle" font-size="11" fill="#868e96">只发 CLAIM 认领请求，不占 KV</text>
  <rect x="672" y="182" width="18" height="26" rx="3" fill="#f3f0ff" stroke="#7048e8"/>
  <rect x="690" y="182" width="90" height="26" rx="5" fill="#fff4e6" stroke="#f08c00"/>
  <text x="735" y="199" text-anchor="middle" font-size="11" fill="#e8590c">收 KV</text>
  <rect x="780" y="182" width="110" height="26" rx="5" fill="#e6fcf5" stroke="#0ca678"/>
  <text x="835" y="199" text-anchor="middle" font-size="11" fill="#0b7285">decode</text>
  <path d="M681 112 L681 178" stroke="#7048e8" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="600" y="226" font-size="10.5" fill="#5f3dc4">P 报 COMPUTE_DONE → D 分配并回传 index</text>

  <rect x="20" y="242" width="880" height="72" rx="10" fill="#f8f9fa" stroke="#e9ecef"/>
  <text x="36" y="264" font-size="12" fill="#495057">实测（提交记录）：5 节点测试中 kvcache_transfer_time 55.8 s → 142 ms（传输时间不再包含排队和计算）；K3 P2D2 跑</text>
  <text x="36" y="282" font-size="12" fill="#495057">500 请求、2950 万输入 token，decode 预分配占用 0.00（旧 0.02~0.08）。并发 8 时 p99 TTFT 好 17%；并发 4 时 TTFT +54%。</text>
  <text x="36" y="300" font-size="10.5" fill="#868e96">并发低时多出的 CLAIM / COMPUTE_DONE 往返还没被藏住。两次等待都有超时（脚本里 60 s），超时即中止并通知对端；P / D 必须同时打开。</text>
</svg>
