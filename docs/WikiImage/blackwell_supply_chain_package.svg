<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="540" rx="12" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#212529">一颗 Blackwell GPU 封装的剖面</text>
  <text x="450" y="56" text-anchor="middle" font-size="13" fill="#868e96">CoWoS-L：先把 die 和 HBM 贴到中介层上（CoW），再整体贴到 ABF 载板上（oS）</text>

  <defs>
    <pattern id="hbm" width="8" height="5.5" patternUnits="userSpaceOnUse">
      <rect width="8" height="5.5" fill="#e6fcf5"/>
      <path d="M0 5 L8 5" stroke="#0ca678" stroke-width="0.8"/>
    </pattern>
  </defs>

  <!-- brackets: CoW / oS -->
  <path d="M70 118 L62 118 L62 250 L70 250" fill="none" stroke="#e8590c" stroke-width="1.5"/>
  <text x="48" y="188" text-anchor="middle" font-size="12" font-weight="700" fill="#e8590c" transform="rotate(-90 48 188)">CoW</text>
  <path d="M70 254 L62 254 L62 360 L70 360" fill="none" stroke="#0b7285" stroke-width="1.5"/>
  <text x="48" y="307" text-anchor="middle" font-size="12" font-weight="700" fill="#0b7285" transform="rotate(-90 48 307)">oS</text>

  <!-- lid -->
  <path d="M92 264 L92 92 L548 92 L548 264 L540 264 L540 108 L100 108 L100 264 Z" fill="#dee2e6" stroke="#868e96"/>

  <!-- HBM stacks + GPU dies -->
  <rect x="108" y="122" width="50" height="78" fill="url(#hbm)" stroke="#0ca678"/>
  <rect x="108" y="192" width="50" height="8" fill="#0ca678"/>
  <rect x="163" y="122" width="50" height="78" fill="url(#hbm)" stroke="#0ca678"/>
  <rect x="163" y="192" width="50" height="8" fill="#0ca678"/>
  <rect x="427" y="122" width="50" height="78" fill="url(#hbm)" stroke="#0ca678"/>
  <rect x="427" y="192" width="50" height="8" fill="#0ca678"/>
  <rect x="482" y="122" width="50" height="78" fill="url(#hbm)" stroke="#0ca678"/>
  <rect x="482" y="192" width="50" height="8" fill="#0ca678"/>
  <rect x="223" y="130" width="95" height="70" rx="3" fill="#edf2ff" stroke="#4c6ef5"/>
  <text x="270" y="162" text-anchor="middle" font-size="12" font-weight="700" fill="#3b5bdb">GPU die</text>
  <rect x="322" y="130" width="95" height="70" rx="3" fill="#edf2ff" stroke="#4c6ef5"/>
  <text x="370" y="162" text-anchor="middle" font-size="12" font-weight="700" fill="#3b5bdb">GPU die</text>
  <text x="320" y="122" text-anchor="middle" font-size="10" fill="#3b5bdb">片间 ~10 TB/s</text>

  <!-- micro bumps -->
  <path d="M112 205 h4 M120 205 h4 M128 205 h4 M136 205 h4 M144 205 h4 M152 205 h4 M167 205 h4 M175 205 h4 M183 205 h4 M191 205 h4 M199 205 h4 M207 205 h4 M227 205 h4 M235 205 h4 M243 205 h4 M251 205 h4 M259 205 h4 M267 205 h4 M275 205 h4 M283 205 h4 M291 205 h4 M299 205 h4 M307 205 h4 M326 205 h4 M334 205 h4 M342 205 h4 M350 205 h4 M358 205 h4 M366 205 h4 M374 205 h4 M382 205 h4 M390 205 h4 M398 205 h4 M406 205 h4 M431 205 h4 M439 205 h4 M447 205 h4 M455 205 h4 M463 205 h4 M471 205 h4 M486 205 h4 M494 205 h4 M502 205 h4 M510 205 h4 M518 205 h4 M526 205 h4" stroke="#868e96" stroke-width="6"/>

  <!-- RDL interposer with LSI bridges -->
  <rect x="104" y="210" width="432" height="40" rx="3" fill="#fff9db" stroke="#f08c00"/>
  <rect x="198" y="214" width="40" height="18" rx="2" fill="#e5dbff" stroke="#7048e8"/>
  <text x="218" y="227" text-anchor="middle" font-size="10" fill="#5f3dc4">LSI</text>
  <rect x="300" y="214" width="40" height="18" rx="2" fill="#e5dbff" stroke="#7048e8"/>
  <text x="320" y="227" text-anchor="middle" font-size="10" fill="#5f3dc4">LSI</text>
  <rect x="402" y="214" width="40" height="18" rx="2" fill="#e5dbff" stroke="#7048e8"/>
  <text x="422" y="227" text-anchor="middle" font-size="10" fill="#5f3dc4">LSI</text>
  <text x="320" y="245" text-anchor="middle" font-size="10.5" fill="#e8590c">有机 RDL 中介层（多层细线路）</text>
  <!-- C4 bumps -->
  <path d="M112 257 h0 M128 257 h0 M144 257 h0 M160 257 h0 M176 257 h0 M192 257 h0 M208 257 h0 M224 257 h0 M240 257 h0 M256 257 h0 M272 257 h0 M288 257 h0 M304 257 h0 M320 257 h0 M336 257 h0 M352 257 h0 M368 257 h0 M384 257 h0 M400 257 h0 M416 257 h0 M432 257 h0 M448 257 h0 M464 257 h0 M480 257 h0 M496 257 h0 M512 257 h0 M528 257 h0" stroke="#adb5bd" stroke-width="10" stroke-linecap="round"/>

  <!-- ABF substrate -->
  <rect x="88" y="264" width="464" height="96" rx="3" fill="#e6fcf5" stroke="#0ca678"/>
  <rect x="88" y="290" width="464" height="44" fill="#f1f3f5" stroke="#adb5bd"/>
  <text x="320" y="282" text-anchor="middle" font-size="10.5" fill="#0b7285">ABF 增层（激光微孔 + SAP 镀铜）</text>
  <text x="320" y="317" text-anchor="middle" font-size="11.5" font-weight="700" fill="#495057">T-glass 芯板（低热膨胀玻纤布 + 树脂 + 铜）</text>
  <text x="320" y="352" text-anchor="middle" font-size="10.5" fill="#0b7285">ABF 增层</text>

  <!-- BGA + system PCB -->
  <path d="M104 369 h0 M128 369 h0 M152 369 h0 M176 369 h0 M200 369 h0 M224 369 h0 M248 369 h0 M272 369 h0 M296 369 h0 M320 369 h0 M344 369 h0 M368 369 h0 M392 369 h0 M416 369 h0 M440 369 h0 M464 369 h0 M488 369 h0 M512 369 h0 M536 369 h0" stroke="#868e96" stroke-width="14" stroke-linecap="round"/>
  <rect x="70" y="378" width="500" height="42" rx="3" fill="#f8f9fa" stroke="#868e96"/>
  <text x="320" y="404" text-anchor="middle" font-size="11.5" font-weight="700" fill="#495057">系统 PCB（计算托盘主板：HDI／高多层）</text>

  <!-- number callouts in drawing -->
  <circle cx="320" cy="100" r="9" fill="#212529"/><text x="320" y="104" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">1</text>
  <circle cx="270" cy="182" r="9" fill="#212529"/><text x="270" y="186" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">2</text>
  <circle cx="133" cy="160" r="9" fill="#212529"/><text x="133" y="164" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">3</text>
  <circle cx="562" cy="205" r="9" fill="#212529"/><text x="562" y="209" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">4</text>
  <path d="M553 205 L536 205" stroke="#212529" stroke-width="1"/>
  <circle cx="482" cy="230" r="9" fill="#212529"/><text x="482" y="234" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">5</text>
  <circle cx="120" cy="312" r="9" fill="#212529"/><text x="120" y="316" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">6</text>
  <circle cx="110" cy="399" r="9" fill="#212529"/><text x="110" y="403" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">7</text>
  <!-- right column: suppliers -->
  <circle cx="600" cy="96" r="9" fill="#212529"/><text x="600" y="100" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">1</text>
  <text x="616" y="100" font-size="12.5" font-weight="700" fill="#495057">散热盖（lid）</text>
  <text x="616" y="117" font-size="11" fill="#868e96">健策</text>
  <circle cx="600" cy="146" r="9" fill="#212529"/><text x="600" y="150" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">2</text>
  <text x="616" y="150" font-size="12.5" font-weight="700" fill="#3b5bdb">GPU die ×2（4NP，近光罩上限）</text>
  <text x="616" y="167" font-size="11" fill="#868e96">台积电；CP 测试：京元电 · 爱德万</text>
  <circle cx="600" cy="196" r="9" fill="#212529"/><text x="600" y="200" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">3</text>
  <text x="616" y="200" font-size="12.5" font-weight="700" fill="#0b7285">HBM3E 12 层 ×8（剖面只画 4 颗）</text>
  <text x="616" y="217" font-size="11" fill="#868e96">SK 海力士 · 美光 · 三星；键合机：韩美</text>
  <circle cx="600" cy="246" r="9" fill="#212529"/><text x="600" y="250" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">4</text>
  <text x="616" y="250" font-size="12.5" font-weight="700" fill="#495057">微凸块 + 底部填充</text>
  <text x="616" y="267" font-size="11" fill="#868e96">填充材料：Resonac · Namics</text>
  <circle cx="600" cy="296" r="9" fill="#212529"/><text x="600" y="300" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">5</text>
  <text x="616" y="300" font-size="12.5" font-weight="700" fill="#e8590c">RDL 中介层 + LSI 硅桥</text>
  <text x="616" y="317" font-size="11" fill="#868e96">台积电；设备：DISCO · 弘塑 · 万润</text>
  <circle cx="600" cy="346" r="9" fill="#212529"/><text x="600" y="350" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">6</text>
  <text x="616" y="350" font-size="12.5" font-weight="700" fill="#0b7285">ABF 载板</text>
  <text x="616" y="367" font-size="11" fill="#868e96">揖斐电 · 欣兴 · 南电；材料：味之素 · 日东纺</text>
  <circle cx="600" cy="396" r="9" fill="#212529"/><text x="600" y="400" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">7</text>
  <text x="616" y="400" font-size="12.5" font-weight="700" fill="#495057">BGA 焊球 → 系统 PCB</text>
  <text x="616" y="417" font-size="11" fill="#868e96">胜宏 · 沪电 · 金像电；CCL：台光电 · 生益</text>

  <!-- note -->
  <rect x="30" y="444" width="840" height="74" rx="8" fill="#f8f9fa" stroke="#e9ecef"/>
  <text x="48" y="468" font-size="12" fill="#495057">封装后还要经过 FT 功能测试 → 老化 → SLT 系统级测试（京元电、日月光、Amkor；测试机 爱德万、Teradyne；分选机 鸿劲）。</text>
  <text x="48" y="488" font-size="12" fill="#495057">die、硅桥、RDL、载板四种材料的热膨胀系数不同，封装越大越容易翘曲：业内报道 2024 年 Blackwell 改版与此有关，</text>
  <text x="48" y="506" font-size="12" fill="#495057">也是载板芯板必须用 T-glass 的原因。</text>
</svg>
