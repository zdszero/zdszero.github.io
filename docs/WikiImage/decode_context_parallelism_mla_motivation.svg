<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="470" rx="12" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#212529">为什么需要 DCP：MLA 的 latent KV 无法按 head 切</text>
  <text x="450" y="56" text-anchor="middle" font-size="13" fill="#868e96">例：attention TP = 4，一个请求有 12 个历史 token；每格代表一个 token 的 latent KV</text>

  <!-- left panel: TP only -->
  <rect x="30" y="80" width="410" height="290" rx="10" fill="#fff5f5" stroke="#fa5252"/>
  <text x="48" y="106" font-size="14.5" font-weight="700" fill="#c92a2a">只用 TP（dcp_size = 1）</text>
  <text x="48" y="126" font-size="11.5" fill="#868e96">head 被切成 4 份，但所有 head 共享同一份 latent KV</text>
  <!-- right panel: TP + DCP -->
  <rect x="460" y="80" width="410" height="290" rx="10" fill="#e6fcf5" stroke="#0ca678"/>
  <text x="478" y="106" font-size="14.5" font-weight="700" fill="#0b7285">TP + DCP（dcp_size = 4）</text>
  <text x="478" y="126" font-size="11.5" fill="#868e96">同样 4 张卡，KV 改为按 token 交错切；虚线格 = 不在本卡</text>
