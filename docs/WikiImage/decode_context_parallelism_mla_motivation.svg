  <text x="478" y="348" font-size="12" fill="#0b7285" font-weight="600">每个 rank 只存 3 行、只读 3 行 → 无冗余，容量 ×4</text>

  <!-- bottom note -->
  <rect x="30" y="388" width="840" height="64" rx="8" fill="#f8f9fa" stroke="#e9ecef"/>
  <text x="46" y="411" font-size="12.5" fill="#495057" font-weight="600">关键思想：</text>
  <text x="130" y="411" font-size="12.5" fill="#495057">TP 能切 head 和权重，却切不动被所有 head 共享的 latent KV；DCP 换一个轴，沿 token 去掉这份冗余。</text>
  <text x="46" y="434" font-size="12" fill="#868e96">代价是每层 attention 多一次与上下文长度无关的集合通信（交换 query、合并 partial output + LSE）。</text>
