<text x="48.0" y="708.0" font-size="12" fill="#495057" text-anchor="start">2022-08 至 2025-11 东方财富无该股个股研报，主升浪期间没有可画的预测；不同券商的预测连成一条线，只表示同一目标年度，不是一致预期。</text>
