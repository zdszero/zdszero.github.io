<text x="48.0" y="672.0" font-size="12" fill="#495057" text-anchor="start">按东吴 2026E 计算，市值对应的预测 PE 从 01-20 的约 17.5 倍降到 11-19 的约 9.2 倍。预测不变而估值减半，说明市场不再相信 2027 年还能增长</text>
