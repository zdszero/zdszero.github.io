<svg xmlns="http://www.w3.org/2000/svg" width="760" height="365" viewBox="0 0 760 365" role="img" aria-labelledby="title"><title id="title">Triton GEMM 沿 K 轴加载输入 Tile 并累加输出 Tile</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#64748b"/></marker></defs><rect width="760" height="365" rx="12" fill="#f8fafc"/><g font-family="Arial, sans-serif" fill="#1e293b"><text x="380" y="32" text-anchor="middle" font-size="20">一个 Program 累加一个 C Tile，沿 K 轴迭代</text><rect x="25" y="65" width="205" height="92" rx="8" fill="#dbeafe" stroke="#94a3b8"/><text x="127.5" y="117.0" text-anchor="middle" font-size="16">A Tile: BM × BK</text><text x="250" y="118" text-anchor="middle" font-size="24">×</text><rect x="275" y="65" width="205" height="92" rx="8" fill="#dbeafe" stroke="#94a3b8"/><text x="377.5" y="117.0" text-anchor="middle" font-size="16">B Tile: BK × BN</text><text x="502" y="118" text-anchor="middle" font-size="24">→</text><rect x="535" y="65" width="200" height="92" rx="8" fill="#dcfce7" stroke="#94a3b8"/><text x="635.0" y="117.0" text-anchor="middle" font-size="16">acc: BM × BN</text><text x="128" y="185" text-anchor="middle" font-size="14">选择输出行 / 当前 K 块</text><text x="378" y="185" text-anchor="middle" font-size="14">当前 K 块 / 选择输出列</text><text x="635" y="185" text-anchor="middle" font-size="14">FP32 累加器</text><rect x="100" y="225" width="560" height="48" rx="8" fill="#fef3c7" stroke="#94a3b8"/><text x="380.0" y="255.0" text-anchor="middle" font-size="16">K 块 0 → K 块 1 → … → K 块 ceil(K / BK) − 1</text><path d="M635 190L635 220" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><text x="380" y="310" text-anchor="middle" font-size="17">每一步：加载 A/B → tl.dot → 累加；完成后写回 C</text><text x="380" y="341" text-anchor="middle" font-size="15">BM = BLOCK_M · BN = BLOCK_N · BK = BLOCK_K</text></g></svg>