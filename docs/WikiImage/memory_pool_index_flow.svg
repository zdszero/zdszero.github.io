<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="920" height="500" rx="12" fill="#ffffff"/>
  <text x="460" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#212529">索引解引用链：从 Request 到 Attention Kernel</text>
  <text x="460" y="56" text-anchor="middle" font-size="13" fill="#868e96">create_flashinfer_kv_indices_triton 把二维 req_to_token 展平成一维 kv_indices</text>

  <!-- Step 1 ScheduleBatch -->
  <rect x="40" y="80" width="300" height="110" rx="10" fill="#edf2ff" stroke="#4c6ef5"/>
  <text x="56" y="102" font-size="13.5" font-weight="700" fill="#3b5bdb">① ScheduleBatch</text>
  <text x="56" y="126" font-size="12" font-family="monospace" fill="#343a40">req_pool_indices = [7, 3]</text>
  <text x="56" y="148" font-size="12" font-family="monospace" fill="#343a40">seq_lens = [4, 3]</text>
  <text x="56" y="174" font-size="11.5" fill="#868e96">当前 batch 的两个请求</text>

  <!-- Step 2 req_to_token -->
  <rect x="380" y="80" width="500" height="110" rx="10" fill="#ffffff" stroke="#adb5bd"/>
  <text x="396" y="102" font-size="13.5" font-weight="700" fill="#495057">② req_to_token 二维表（按行取出）</text>
  <g font-size="11.5" font-family="monospace">
    <text x="396" y="128" fill="#868e96">row 7:</text>
    <text x="452" y="128" fill="#3b5bdb">[ 12, 13, 40, 41 ]</text>
    <text x="640" y="128" fill="#adb5bd">… （后续位置未使用）</text>
    <text x="396" y="152" fill="#868e96">row 3:</text>
    <text x="452" y="152" fill="#0b7285">[ 5, 6, 7 ]</text>
    <text x="640" y="152" fill="#adb5bd">… </text>
  </g>
  <text x="396" y="178" font-size="11.5" fill="#868e96">只读取每行前 seq_len 个有效 kv_index</text>

  <path d="M340 135 L378 135" stroke="#868e96" stroke-width="2" marker-end="url(#ar2)"/>

  <!-- down arrow -->
  <path d="M460 190 L460 222" stroke="#868e96" stroke-width="2" marker-end="url(#ar2)"/>
  <text x="474" y="212" font-size="11.5" fill="#868e96">Triton kernel 并行 gather（每个请求一个 program）</text>

  <!-- Step 3 CSR -->
  <rect x="40" y="226" width="840" height="120" rx="10" fill="#e6fcf5" stroke="#0ca678"/>
  <text x="56" y="248" font-size="13.5" font-weight="700" fill="#0b7285">③ CSR 格式的扁平化结果</text>
  <text x="56" y="274" font-size="12" font-family="monospace" fill="#343a40">kv_indptr = [0, 4, 7]　← cumsum(seq_lens)，标记每个请求在 kv_indices 中的区间</text>

  <!-- kv_indices cells -->
  <g font-size="12" font-family="monospace" text-anchor="middle">
    <g><rect x="56"  y="292" width="46" height="38" rx="4" fill="#d0ebff" stroke="#4dabf7"/><text x="79"  y="316" fill="#1864ab">12</text></g>
    <g><rect x="104" y="292" width="46" height="38" rx="4" fill="#d0ebff" stroke="#4dabf7"/><text x="127" y="316" fill="#1864ab">13</text></g>
    <g><rect x="152" y="292" width="46" height="38" rx="4" fill="#d0ebff" stroke="#4dabf7"/><text x="175" y="316" fill="#1864ab">40</text></g>
    <g><rect x="200" y="292" width="46" height="38" rx="4" fill="#d0ebff" stroke="#4dabf7"/><text x="223" y="316" fill="#1864ab">41</text></g>
    <g><rect x="256" y="292" width="46" height="38" rx="4" fill="#c3fae8" stroke="#20c997"/><text x="279" y="316" fill="#0b7285">5</text></g>
    <g><rect x="304" y="292" width="46" height="38" rx="4" fill="#c3fae8" stroke="#20c997"/><text x="327" y="316" fill="#0b7285">6</text></g>
    <g><rect x="352" y="292" width="46" height="38" rx="4" fill="#c3fae8" stroke="#20c997"/><text x="375" y="316" fill="#0b7285">7</text></g>
  </g>
  <text x="151" y="344" text-anchor="middle" font-size="11" fill="#1864ab">req 7 → [0:4)</text>
  <text x="327" y="344" text-anchor="middle" font-size="11" fill="#0b7285">req 3 → [4:7)</text>
  <text x="430" y="312" font-size="12" font-family="monospace" fill="#495057">kv_indices（一维，供 kernel 直接寻址）</text>

  <path d="M460 346 L460 378" stroke="#868e96" stroke-width="2" marker-end="url(#ar2)"/>

  <!-- Step 4 attention -->
  <rect x="40" y="382" width="840" height="96" rx="10" fill="#fff9db" stroke="#f08c00"/>
  <text x="56" y="404" font-size="13.5" font-weight="700" fill="#e8590c">④ FlashInfer / Triton Attention Backend</text>
  <text x="56" y="430" font-size="12" font-family="monospace" fill="#343a40">for req i:  idx = kv_indices[kv_indptr[i] : kv_indptr[i+1]]</text>
  <text x="56" y="452" font-size="12" font-family="monospace" fill="#343a40">            K, V = k_buffer[L][idx], v_buffer[L][idx]  →  Attention(Q[i], K, V)</text>
  <text x="56" y="472" font-size="11.5" fill="#868e96">每个 forward pass 都执行一次，kernel 的高效性直接决定吞吐</text>

  <defs>
    <marker id="ar2" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#868e96"/>
    </marker>
  </defs>
</svg>
