<text x="48.0" y="644.0" font-size="12" fill="#495057" text-anchor="start">2020 年利润 100.4 亿，与 2019 年持平，平均 PE 却从 11.7 倍升到 23.4 倍；2021 年利润增长 145%，年末 PE 回落到 13.1 倍。</text>
<text x="48.0" y="662.0" font-size="12" fill="#495057" text-anchor="start">2018 年为吸收合并万华化工后的重述口径（原口径 106.1 亿）；2017-12-05 至 2018-06-01 停牌，停牌日不计入统计。2017 年末值取停牌前</text>
<text x="48.0" y="680.0" font-size="12" fill="#495057" text-anchor="start">12-04。2026 为截至 11-20 的 YTD，利润为前三季度。</text>
<text x="48.0" y="698.0" font-size="12" fill="#495057" text-anchor="start">来源：东方财富估值分析日度 PE（TTM）、F10 主要财务指标；2016—2017 年与 2019-04 至 2020-03 由本文按当时已披露利润重算。</text>
