<text x="46.0" y="514.0" font-size="12" fill="#495057" text-anchor="start">2021 年初的预测只有实际利润的五分之一。股价见顶那天，2022 年预测仍只有 240 亿，而且它预计 2022 年会比 2021 年少赚近七成；</text>
<text x="46.0" y="532.0" font-size="12" fill="#495057" text-anchor="start">到 2022 年 4 月预测追上 1,100 亿时，股价已经比顶部低了约三分之一。预测是跟着财报改的，股价没有等它。</text>
<text x="46.0" y="550.0" font-size="12" fill="#495057" text-anchor="start">来源：国金证券 2021-01-05、2021-07-08、2022-04-01、2022-05-24、2022-09-09、2023-04-03、2023-05-04 报告摘要（东方财富研报中心）。</text>
