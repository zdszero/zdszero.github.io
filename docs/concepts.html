                <tr>
                <td>静态 PE（LYR）</td>
                <td>当前总市值 ÷ 上一完整会计年度归母净利润</td>
                <td>利润数据更新较慢</td>
                </tr>
                <tr>
                <td>滚动 PE（TTM）</td>
                <td>当前总市值 ÷ 最近连续 12 个月归母净利润</td>
                <td>每季度随财报更新</td>
                </tr>
                <tr>
